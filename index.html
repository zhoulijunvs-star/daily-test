/* ====== 打卡日历 + 补做 ====== */
const CK_KEY="yijian_checkins";
function getCheckins(){try{return JSON.parse(localStorage.getItem(CK_KEY)||"{}");}catch(e){return {};}}
function markCheckin(subj,dateStr){
  const ck=getCheckins();
  if(!ck[dateStr]) ck[dateStr]={};
  ck[dateStr][subj]=1;
  ck[dateStr]._ts=Date.now();
  localStorage.setItem(CK_KEY,JSON.stringify(ck));
}
function isDone(dateStr,subj){const ck=getCheckins();return !!(ck[dateStr]&&ck[dateStr][subj]);}
function dayDoneCount(dateStr){const ck=getCheckins();if(!ck[dateStr])return 0;return ORDER.filter(s=>ck[dateStr][s]).length;}
function totalCheckinDays(){const ck=getCheckins();return Object.keys(ck).filter(d=>ORDER.some(s=>ck[d]&&ck[d][s])).length;}
function streak(){
  const ck=getCheckins();
  const has=d=>ORDER.some(s=>ck[d]&&ck[d][s]);
  let cur=new Date();
  if(!has(todayStr())) cur.setDate(cur.getDate()-1);  // 今天还没打卡则从昨天起算，不算断
  let s=0;
  while(true){
    const ds=cur.getFullYear()+"-"+pad(cur.getMonth()+1)+"-"+pad(cur.getDate());
    if(has(ds)){s++;cur.setDate(cur.getDate()-1);}else break;
  }
  return s;
}
function refreshCheckinBadge(){
  const b=document.getElementById("toCheckin");
  if(b){const n=dayDoneCount(todayStr());b.textContent="📅 打卡日历 · 今日"+n+"/3";}
}
function updateModeBar(){
  const el=document.getElementById("subdate");
  if(viewDate===todayStr()){
    el.textContent="每日 "+todayStr()+" ｜ 法规/管理/经济 各 "+PER+" 题（单选+多选）";
    document.getElementById("toToday").classList.add("hidden");
  }else{
    el.innerHTML="📅 <b>补做模式："+viewDate+"</b>（点击「返回今日」回到今天）｜ 该日题目 各 "+PER+" 题";
    document.getElementById("toToday").classList.remove("hidden");
  }
}
let calMonth=null;
function showCheckin(){
  document.getElementById("quizView").classList.add("hidden");
  document.getElementById("statsView").classList.add("hidden");
  document.getElementById("checkinView").classList.remove("hidden");
  document.getElementById("toStats").classList.add("hidden");
  document.getElementById("toCheckin").classList.add("hidden");
  document.getElementById("toQuiz").classList.remove("hidden");
  const t=new Date();
  if(!calMonth) calMonth={y:t.getFullYear(),m:t.getMonth()};
  renderCalendar();
}
function enterMakeup(ds){
  viewDate=ds;
  buildSets();renderTabs();renderQuiz();
  document.getElementById("checkinView").classList.add("hidden");
  document.getElementById("quizView").classList.remove("hidden");
  document.getElementById("toQuiz").classList.add("hidden");
  document.getElementById("toCheckin").classList.remove("hidden");
  document.getElementById("toToday").classList.remove("hidden");
  updateModeBar();
  refreshCheckinBadge();
  window.scrollTo({top:0,behavior:"smooth"});
}
function renderCalendar(){
  const panel=document.getElementById("checkinPanel");
  const y=calMonth.y, m=calMonth.m;
  const today=todayStr();
  const ck=getCheckins();
  const ym=y+"-"+pad(m+1);
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m+1,0).getDate();
  const monthDates=Object.keys(ck).filter(d=>d.slice(0,7)===ym);
  const fullDays=monthDates.filter(d=>ORDER.every(s=>ck[d]&&ck[d][s])).length;
  let h="<h2>📅 打卡日历</h2>";
  h+="<div class='ov'>"+
     "<div><b>"+totalCheckinDays()+"</b>累计打卡天</div>"+
     "<div><b>"+streak()+"</b>连续打卡</div>"+
     "<div><b>"+fullDays+"</b>"+pad(m+1)+"月全勤天</div>"+
     "<div><b>"+(daysInMonth?Math.round(fullDays/daysInMonth*100):0)+"%</b>本月全勤率</div></div>";
  h+="<div style='display:flex;justify-content:space-between;align-items:center;margin:14px 0'>"+
     "<button class='btn sec' id='prevM'>‹ 上月</button>"+
     "<b style='font-size:16px'>"+y+"年 "+(m+1)+"月</b>"+
     "<button class='btn sec' id='nextM'>下月 ›</button></div>";
  h+="<div class='cal'>";
  const wks=["一","二","三","四","五","六","日"];
  h+="<div class='cal-row cal-head'>"+wks.map(w=>"<div>"+w+"</div>").join("")+"</div>";
  let cells="<div class='cal-row'>";
  for(let i=0;i<startDow;i++) cells+="<div class='cal-cell empty'></div>";
  for(let d=1;d<=daysInMonth;d++){
    const ds=y+"-"+pad(m+1)+"-"+pad(d);
    const fut=ds>today;
    const n=dayDoneCount(ds);
    const isToday=ds===today;
    let cls="cal-cell"+(fut?" fut":"")+(isToday?" today":"")+(n>=3?" done":(n>0?" partial":(fut?"":" miss")));
    let dots=ORDER.map(s=>"<i class='"+(isDone(ds,s)?"dot on":"dot")+"'></i>").join("");
    let inner="<div class='cd'>"+d+(isToday?" <small>今</small>":"")+"</div>"+
              "<div class='dots'>"+dots+"</div>"+
              (n>0?("<div class='cn'>"+n+"/3</div>"):"");
    cells+="<div class='"+cls+"' data-d='"+ds+"'>"+inner+"</div>";
  }
  cells+="</div>";
  h+=cells+"</div>";
  h+="<div class='note'>点击任意日期可加载当天题目 <b>补做</b>（未来日期不可补）。<span style='color:#2e7d32'>绿</span>=三科全做　<span style='color:#f39c12'>黄</span>=部分完成　<span style='color:#c62828'>红</span>=未做。小圆点：●法规 ●管理 ●经济（亮=已做）。</div>";
  h+="<div style='display:flex;gap:8px;flex-wrap:wrap;margin-top:10px'>"+
     "<button class='btn sec' id='ckExp'>⬇ 导出打卡记录</button>"+
     "<button class='btn sec' id='ckClr' style='color:#c62828'>🗑 清空打卡</button></div>";
  panel.innerHTML=h;
  panel.querySelectorAll(".cal-cell[data-d]").forEach(c=>{
    const ds=c.dataset.d;
    if(ds>today) return;   // 未来日期不可补做
    c.onclick=()=>enterMakeup(ds);
  });
  document.getElementById("prevM").onclick=()=>{calMonth.m--; if(calMonth.m<0){calMonth.m=11;calMonth.y--;}renderCalendar();};
  document.getElementById("nextM").onclick=()=>{calMonth.m++; if(calMonth.m>11){calMonth.m=0;calMonth.y++;}renderCalendar();};
  document.getElementById("ckExp").onclick=()=>{
    const blob=new Blob([JSON.stringify(getCheckins(),null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="一建打卡记录_"+todayStr()+".json";a.click();
  };
  document.getElementById("ckClr").onclick=()=>{
    if(confirm("确认清空全部打卡记录？此操作不可恢复。")){localStorage.removeItem(CK_KEY);calMonth=null;renderCalendar();refreshCheckinBadge();}
  };
}
function renderStats(){
  let arr=[];
  try{arr=JSON.parse(localStorage.getItem("yijian_records")||"[]");}catch(e){}
  const panel=document.getElementById("statsPanel");
  if(!arr.length){
    panel.innerHTML="<h2>薄弱知识点统计</h2><p style='color:#888'>暂无做题记录。完成一次提交后，这里会汇总你的薄弱知识点（按章节统计错误率、支持搜索与导出）。</p>";
    return;
  }
  const total=arr.length;
  const right=arr.filter(r=>r.correct).length;
  const pct=Math.round(right/total*100);
  const days=new Set(arr.map(r=>r.date)).size;
  // 按 科目+知识点 聚合
  const map={};
  arr.forEach(r=>{
    const k=r.subject+"｜"+r.kp;
    if(!map[k]) map[k]={subject:r.subject,kp:r.kp,total:0,right:0,tableTotal:0,tableRight:0};
    map[k].total++; if(r.correct) map[k].right++;
    if(r.hasTable){map[k].tableTotal++; if(r.correct) map[k].tableRight++;}
  });
  let rows=Object.values(map).map(m=>({...m,err:Math.round((m.total-m.right)/m.total*100)}));
  // 默认按错误率降序，样本>=3优先
  rows.sort((a,b)=> (b.total>=3?1:0)-(a.total>=3?1:0) || b.err-a.err || b.total-a.total);

  let h="<h2>📊 薄弱知识点统计</h2>";
  const tRecs=arr.filter(r=>r.date===todayStr());
  const tRight=tRecs.filter(r=>r.correct).length;
  const tPct=tRecs.length?Math.round(tRight/tRecs.length*100):0;
  h+="<div class='ov'>"+
     "<div><b>"+tRecs.length+"</b>今日题次</div><div><b>"+tPct+"%</b>今日正确率</div>"+
     "<div><b>"+(tRecs.length-tRight)+"</b>今日答错(题)</div>"+
     "<div style='border-left:1px solid #eee;padding-left:12px'><b>"+total+"</b>累计题次</div>"+
     "<div><b>"+pct+"%</b>累计正确率</div><div><b>"+days+"</b>做题天数</div>"+
     "<div><b>"+rows.length+"</b>涉及知识点</div></div>";
  h+="<div class='note'>「今日」仅含今天 "+todayStr()+" 的提交；「累计」含全部历史做题记录。今天做错的题请以「今日答错」为准，不要与累计混淆。</div>";

  h+="<input class='search' id='kw' placeholder='🔍 搜索知识点 / 章节名（如：合同、现金流量、质量）'>";
  h+="<table class='wk' id='wk'><thead><tr><th data-k='kp'>知识点（章节）</th><th>科目</th><th>做题</th>"+
     "<th data-k='err'>错误率</th><th>图表题错误率</th></tr></thead><tbody>";
  rows.forEach(r=>{
    const tErr = r.tableTotal? Math.round((r.tableTotal-r.tableRight)/r.tableTotal*100)+"%" : "—";
    h+="<tr><td>"+esc(r.kp)+"</td><td>"+esc(r.subject)+"</td><td>"+r.total+"</td>"+
       "<td><span class='barbg'><span class='barfill' style='width:"+r.err+"%'></span></span> "+r.err+"%"+(r.total<3?" <small style='color:#aaa'>(样本少)</small>":"")+"</td>"+
       "<td>"+tErr+"</td></tr>";
  });
  h+="</tbody></table>";

  // 趋势：按日期
  const byDate={};
  arr.forEach(r=>{ if(!byDate[r.date]) byDate[r.date]={t:0,r:0}; byDate[r.date].t++; if(r.correct) byDate[r.date].r++; });
  const dates=Object.keys(byDate).sort().slice(-14);
  h+="<h2>每日正确率趋势（最近14天）</h2><div class='trend'>";
  dates.forEach(d=>{
    const p=Math.round(byDate[d].r/byDate[d].t*100);
    h+="<div class='row'><span class='d'>"+d.slice(5)+"</span><span class='tb'><span class='tf' style='width:"+p+"%'></span></span><span class='v'>"+p+"% ("+byDate[d].r+"/"+byDate[d].t+")</span></div>";
  });
  h+="</div>";

  h+="<h2>数据管理</h2><div style='display:flex;gap:8px;flex-wrap:wrap'>"+
     "<button class='btn sec' id='exp'>⬇ 导出记录JSON</button>"+
     "<button class='btn sec' id='imp'>⬆ 导入记录JSON</button>"+
     "<button class='btn sec' id='clr' style='color:#c62828'>🗑 清空记录</button></div>"+
     "<input type='file' id='impFile' accept='application/json' class='hidden'>";

  panel.innerHTML=h;

  document.getElementById("kw").oninput=function(){
    const v=this.value.trim();
    document.querySelectorAll("#wk tbody tr").forEach(tr=>{
      tr.style.display=(!v || tr.children[0].textContent.indexOf(v)>=0 || tr.children[1].textContent.indexOf(v)>=0)?"":"none";
    });
  };
  document.querySelectorAll("#wk th[data-k]").forEach(th=>{
    th.onclick=()=>{const k=th.dataset.k;rows.sort((a,b)=>k==="err"?b.err-a.err:a.kp.localeCompare(b.kp));renderStats();};
  });
  document.getElementById("exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(arr,null,2)],{type:"application/json"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);
    a.download="一建刷题记录_"+todayStr()+".json";a.click();
  };
  document.getElementById("imp").onclick=()=>document.getElementById("impFile").click();
  document.getElementById("impFile").onchange=function(){
    const f=this.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const imp=JSON.parse(rd.result);
      let base=JSON.parse(localStorage.getItem("yijian_records")||"[]");
      // 以 日期|科目|题干指纹(qid) 精确去重；旧导出无 qid 时回退 kp+type
      const recKey=r=>r.date+"|"+r.subject+"|"+(r.qid||(r.kp+"|"+r.type));
      const seen=new Set(base.map(recKey));
      let add=0;
      imp.forEach(r=>{const key=recKey(r); if(!seen.has(key)){base.push(r);seen.add(key);add++;}});
      localStorage.setItem("yijian_records",JSON.stringify(base.slice(-8000)));
      alert("已导入 "+add+" 条新记录，重新汇总中…");renderStats();
    }catch(e){alert("导入失败：文件格式不正确");}};
    rd.readAsText(f);
    this.value="";
  };
  document.getElementById("clr").onclick=()=>{
    if(confirm("确认清空全部做题记录？此操作不可恢复。")){localStorage.removeItem("yijian_records");renderStats();}
  };
}
