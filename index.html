同法律制度", "type": "single", "stem": "根据《民法典》，关于定金的说法，正确的是( )", "opts": [{"k": "A", "t": "定金合同可以独立于主合同存在"}, {"k": "B", "t": "债务人履行债务的，定金应当抵作合同价款或者收回"}, {"k": "C", "t": "定金合同约定后即成交"}, {"k": "D", "t": "实际支付的定金数额多于约定数额的部分，不产生定金的效力"}], "ans": "B", "ana": "B正确:债务人履行债务的,定金应抵作价款或收回。A定金合同是从合同(不能独立存在)。C定金合同自实际交付定金时成立(非要约承诺即成立)。D实际支付多于约定的部分,如对方接受可产生定金效力。【法条依据】《民法典》第586条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）某项目设计费用为100万元，合同约定定金为设计费用的15%，发包方依约支付定金 后，设计方不履行合同，给发包方造成12万元损失，发包方对此最多可获得( )万元。", "opts": [{"k": "A", "t": "24"}, {"k": "B", "t": "27"}, {"k": "C", "t": "30"}, {"k": "D", "t": "42"}], "ans": "C", "ana": "C正确:定金100万×15%=15万,合法(不超过20%)。收受方违约→双倍返还定金30万。损害赔偿:实际损失12万。定金与损害赔偿可并用但总额不超过违约造成的损失。本题30万>12万,最多获30万。定金罚则的目的在于惩罚违约方,不是补偿守约方。【法条依据】《民法典》第588条:定金不足以弥补损失的,可请求赔偿超过定金数额的损失。但定金已超过损失12万,以30万为准。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "根据《民法典》，关于违约的责任中损失赔偿款的说法，正确的有( )", "opts": [{"k": "A", "t": "不包括合同履行后可以获得的利益"}, {"k": "B", "t": "应当相当于因违约所造成的损失"}, {"k": "C", "t": "以守约一方的计算为准"}, {"k": "D", "t": "以违约一方的计算为准"}], "ans": "B", "ana": "B正确:损失赔偿额应相当于因违约所造成的损失,包括合同履行后可获得的利益(《民法典》第584条)。A错误:包括可获利益。C/D错误:以实际损失为准,非以守约方或违约方单方计算。【法条依据】《民法典》第584条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "multi", "stem": "（真题）根据《民法典》，免除施工单位违约责任的情形有( )。", "opts": [{"k": "A", "t": "施工单位因安全事故隐患，被监理工程师责令暂停施工，致使工期延误"}, {"k": "B", "t": "因拖欠农民工工资，部分农民工停工抗议，致使工期延误"}, {"k": "C", "t": "地震导致已完工程被爆破拆除重建，造成建设单位费用增加"}, {"k": "D", "t": "由于战争，施工单位暂停施工，致使工期延误"}, {"k": "E", "t": "因迟延履行而遭遇洪水，导致工期延误"}], "ans": "CD", "ana": "CD正确:地震导致拆除重建、战争导致停工,均属不可抗力,可免除违约责任。A因安全事故被责令停工→自身原因不免责。B拖欠工资导致抗议→自身原因。E迟延履行后遭遇不可抗力→不免责(迟延期间的风险由违约方承担)。【法条依据】《民法典》第590条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）某工程施工中某水泥厂为施工企业供应水泥，延迟交货一周，延迟交货导致施工企 业每天损失0.4万元，第一天晚上施工企业为减少损失，采取紧急措施共花费1万元，使剩余6天共损失0.7万 元。则水泥厂因违约应向施工企业赔偿的损失为( )。", "opts": [{"k": "A", "t": "1.1万元"}, {"k": "B", "t": "1.7万元"}, {"k": "C", "t": "2.1万元"}, {"k": "D", "t": "2.8万元"}], "ans": "C", "ana": "C正确:违约赔偿=实际损失+减损措施费用。第1天损失0.4万+减损费用1万+剩余6天损失0.7万=2.1万。注意:减损措施费用属于合理费用,应由违约方承担。《民法典》第591条:当事人一方违约后,对方应采取适当措施防止损失扩大;未采取措施致损失扩大的,不得就扩大损失请求赔偿。采取减损措施支出的合理费用由违约方承担。【法条依据】《民法典》第591条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "建设工程施工合同无效，工程竣工验收质量合格，承包人要求参照合同关于工程价款的约 定折价补偿被发包人拒绝，遂诉至人民法院，关于该案处理说法，正确的是 ( ).", "opts": [{"k": "A", "t": "不应当支付工程款"}, {"k": "B", "t": "可以参照合同关于工程价款的约定折价补偿承包人"}, {"k": "C", "t": "应当按照合同约定支付工程款"}, {"k": "D", "t": "应当参照合同关于工程价款的约定折价补偿承包人"}], "ans": "B", "ana": "B正确:建设工程施工合同无效,但工程竣工验收合格,可以参照合同关于工程价款的约定折价补偿承包人(建工司法解释(一)第24条)。注意区分:折价补偿(合同无效的救济)vs支付工程款(合同有效)。【法条依据】《建工司法解释(一)》第24条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）某建设工程施工合同约定的开工日期为3月1日，发包人于3月10日向承包人发出开工 通知。开工通知载明的开工日期为3月20日。接到形式通知后，承包人由于人员、设备未能及时到位。3月30 日才正式进场施工。根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（二）》 ，该项目开工日期应当为( )。", "opts": [{"k": "A", "t": "3月1日"}, {"k": "B", "t": "3月20日"}, {"k": "C", "t": "3月10日"}, {"k": "D", "t": "3月30日"}], "ans": "B", "ana": "B正确:开工日期认定顺序:开工通知载明的日期→具备开工条件的日期→实际进场施工日期。发包人3月10日发出开工通知载明3月20日→开工日期为3月20日。承包人自身原因延迟不影响开工日期的认定。【法条依据】《建工司法解释(二)》第5条(或《建工司法解释(一)》第8条)。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》， 某建设工程尚不具备开工条件即发出开工通知，当事人对开工日期有争议，开工日期应当为( )。", "opts": [{"k": "A", "t": "合同中约定的原开工日期"}, {"k": "B", "t": "开工条件具备的时间"}, {"k": "C", "t": "开工通知载明的开工日期"}, {"k": "D", "t": "实际开工日期"}], "ans": "B", "ana": "B正确:不具备开工条件即发出开工通知的,开工日期为开工条件具备的时间。ACD均不符合司法解释规定。【法条依据】《建工司法解释(一)》第8条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）当事人对建设工程实际竣工日期有争议，关于人民法院认定的竣工日期的说法，正 确的是( )。", "opts": [{"k": "A", "t": "承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期"}, {"k": "B", "t": "建设工程经竣工验收合格的，以承包人提交验收报告之日为竣工日期"}, {"k": "C", "t": "建设工程未经竣工验收，承包人向发包人交付工程，发包人拒绝接收的，以承包人申请交付之日为竣工日 期"}, {"k": "D", "t": "建设工程未经竣工验收，发包人通知承包人并实际占有使用工程，以发包人通知到达之日为竣工日期"}], "ans": "A", "ana": "A正确:承包人已提交竣工验收报告,发包人拖延验收的,以提交验收报告之日为竣工日期。B应经验收合格之日(非提交报告之日)。C发包人擅自使用的,以转移占有之日。D以实际占有使用之日(非通知到达之日)。【法条依据】《建工司法解释(一)》第9条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）建设工程施工合同约定承包人垫资至基础工程完工，约定垫资利率为全国银行间同 业拆借中心公布的贷款市场报价利率的2倍，基础工程完工后，发包人未能按约定支付垫资款项及其利息， 双方发生争议，关于该项目垫资及其利息的说法， 正确的是( )。", "opts": [{"k": "A", "t": "承包人主张该项目垫资应当按照工程欠款进行处理的，人民法院不予支持"}, {"k": "B", "t": "关于垫资的约定无效"}, {"k": "C", "t": "约定的垫资金额过高，导致建设工程施工合同无效"}, {"k": "D", "t": "承包人向人民法院请求发包人按照约定支付利息的，人民法院应当全部支持"}], "ans": "A", "ana": "A正确:承包人主张垫资按工程欠款处理的,人民法院不予支持(垫资和工程欠款是不同的法律关系)。B垫资约定原则有效(当事人对垫资及利息有约定的,按约定处理)。C垫资金额高低不影响合同效力。D约定利率超过LPR的4倍部分不予支持(非全部支持)。【法条依据】《建工司法解释(一)》第25条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）建设工程施工合同对付款时间没有约定或者约定不明，则应付款时间为( )。", "opts": [{"k": "A", "t": "建设价款确定之日"}, {"k": "B", "t": "建设工程已竣工验收的，为竣工验收合格之日"}, {"k": "C", "t": "建设工程未交付的，工程款价也未结算的，为当事人起诉之日"}, {"k": "D", "t": "建设工程未交付的，为竣工结算完成之日"}], "ans": "C", "ana": "C正确:付款时间无约定或约定不明→建设工程已交付的,为交付之日;未交付的,为提交竣工结算文件之日;未交付也未结算的,为当事人起诉之日。A/C/D对比,未交付且未结算时,为起诉之日。【法条依据】《建工司法解释(一)》第27条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）根据最高人民法院《关于审理建设工程施工合同纠纷案件适用法律问题的解释（一 ）》，属于承包人建设工程价款优先受偿权范围的是( )。", "opts": [{"k": "A", "t": "工程款利息"}, {"k": "B", "t": "违约金"}, {"k": "C", "t": "工程价款"}, {"k": "D", "t": "损害赔偿金"}], "ans": "C", "ana": "C正确:建设工程价款优先受偿权的范围限于工程价款本身(包括工作人员报酬、材料款等实际支出费用)。A利息/B违约金/D损害赔偿金不属于优先受偿权范围。【法条依据】《民法典》第807条;《建工司法解释(一)》第35条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "multi", "stem": "（真题）关于建设工程价款优先受偿权的说法，正确的是( )。", "opts": [{"k": "A", "t": "建设工程价款优先受偿权与抵押权效力相当，优于其他债权"}, {"k": "B", "t": "装饰装修工程的承包人，无权主张建设工程价款优先受偿权"}, {"k": "C", "t": "承包人行使建设工程价款优先受偿权的时限最长不得超过18个月"}, {"k": "D", "t": "建设工程价款优先受偿权的起算日为发包人应当给付建设工程价款之日"}, {"k": "E", "t": "未竣工的建设工程质量合格，承包人无权享有建设工程价款优先受偿权"}], "ans": "CD", "ana": "CD正确:C优先受偿权行使期限最长不超过18个月(自发包人应付款之日起)。D起算日为应付款之日。A错误:优先受偿权优于抵押权和其他债权(非效力相当)。B错误:装饰装修工程的承包人有条件地享有优先受偿权。E错误:未竣工工程质量合格可享有优先受偿权。【法条依据】《建工司法解释(一)》第41条(18个月)、第35-42条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "关于建设工程施工合同变更的说法，正确的是( )。", "opts": [{"k": "A", "t": "发包人可以依据单方意思表示变更合同"}, {"k": "B", "t": "对于合同变更的内容约定不明确的推定为未变更"}, {"k": "C", "t": "合同变更与工程变更范围一致"}, {"k": "D", "t": "合同变更协议自实际履行之日起生效"}], "ans": "B", "ana": "B正确:合同变更内容约定不明确的,推定为未变更(《民法典》第544条)。A发包人不能单方变更(需双方协商)。C合同变更与工程变更是不同概念(范围不完全一致)。D变更协议自双方签字盖章生效(非实际履行之日)。【法条依据】《民法典》第543条、第544条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）2015年9月15日，甲公司与丙公司订立书面协议转让其对乙公司的30万元债权，同年 9月25日甲公司将该债权转让通知了乙公司。关于该案的说法，正确的是( )。", "opts": [{"k": "A", "t": "甲公司与丙公司之间的债权转让协议于2015年9月25日生效"}, {"k": "B", "t": "丙公司自2015年9月15日起可以向乙公司主张30万元的债权"}, {"k": "C", "t": "甲公司和乙公司就30万债务的清偿对丙公司承担连带责任"}, {"k": "D", "t": "甲公司和丙公司之间的债权转让行为于2015年9月25日对乙公司发生效力"}], "ans": "D", "ana": "D正确:债权转让对债务人发生效力的时间是通知到达债务人之日(9月25日通知乙)。A债权转让协议自成立时生效(9月15日)。B债权转让自通知债务人时才对债务人生效(9月25日起可向乙主张)。C出让人不承担连带责任。【法条依据】《民法典》第546条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "multi", "stem": "根据《民法典》，关于合同权利义务终止的说法，正确的有( )", "opts": [{"k": "A", "t": "债务人依法将标的物提存"}, {"k": "B", "t": "债权人免除债务"}, {"k": "C", "t": "债权人已经履行债权"}, {"k": "D", "t": "债务相互抵销"}, {"k": "E", "t": "债权债务同归于一人"}], "ans": "ABDE", "ana": "ABDE正确:A提存/B免除债务/D抵销/E混同(债权债务同归一人),均导致合同权利义务终止。C应为债权人已经接受履行(非履行债权)。合同终止原因包括:履行、抵销、提存、免除、混同、解除。【法条依据】《民法典》第557条。---", "law": "", "tag": "真题-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）下列情形中，对方当事人可以行使施工合同法定解除权的是( )。", "opts": [{"k": "A", "t": "发包人延迟支付工程款的"}, {"k": "B", "t": "承包人将建设工程转包的"}, {"k": "C", "t": "承包人采用不合格材料，监理人拒绝该材料进场的"}, {"k": "D", "t": "在保修期内，承包人未能在合理期限对工程缺陷进行修复的"}], "ans": "B", "ana": "B正确:承包人转包→发包人可行使法定解除权(建工司法解释第8条)。A迟延支付工程款需经催告合理期限仍未支付,才能解除(非当然可以)。C拒绝不合格材料不构成解除事由。D保修期内的修复问题,应先要求修复。【法条依据】《民法典》第563条;《建工司法解释(一)》相关条文。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "根据《民法典》，关于合同解除的说法，正确的是( )", "opts": [{"k": "A", "t": "当事人不可以约定合同解除条件"}, {"k": "B", "t": "发生不可抗力的，当事人有权解除合同"}, {"k": "C", "t": "在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务，另一方有权解除合同"}, {"k": "D", "t": "以持续履行的债务为内容的不定期合同，当事人无权随时解除合同"}], "ans": "C", "ana": "C正确:履行期限届满前,一方明确表示或以行为表明不履行主要债务(预期违约),另一方有权解除合同。A错误:当事人可约定解除条件(约定解除权)。B错误:不可抗力需导致合同目的不能实现时才能解除(非当然有权)。D错误:不定期持续履行合同,当事人可随时解除(但应提前通知)。【法条依据】《民法典》第563条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）5月12日发生强烈地震，在建工程全部被毁。5月15日发包人向承包人发出书面通知 ，解除承包合同。5月17日承包人收到该通知，5月18日承包人作出了同意解除合同的回复。依据《合同法》 ，该施工合同解除的时间应为( )。", "opts": [{"k": "A", "t": "5月12日"}, {"k": "B", "t": "5月15日"}, {"k": "C", "t": "5月17日"}, {"k": "D", "t": "5月18日"}], "ans": "C", "ana": "C正确:解除通知到达对方时合同解除(5月17日承包人收到通知)。一方通知解除,对方有异议的可请求法院或仲裁确认。本题承包人同意解除,不影响5月17日为解除时间。【法条依据】《民法典》第565条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "根据《民法典》，下列情形中，属于买卖合同中出卖人义务的是( )", "opts": [{"k": "A", "t": "担保标的物的权利制度"}, {"k": "B", "t": "支付价款"}, {"k": "C", "t": "为标的物投保财产保险"}, {"k": "D", "t": "检验标的物"}], "ans": "A", "ana": "A正确:出卖人的义务包括交付标的物、转移所有权、担保标的物权利无瑕疵(权利瑕疵担保义务)。B支付价款是买受人义务。C投保非出卖人法定义务。D检验是买受人的义务/权利。【法条依据】《民法典》第612条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）除法律另有规定或者当事人另有约定外，买卖合同中标的物毁损灭失的风险转移时 间是( )。", "opts": [{"k": "A", "t": "标的物交付时"}, {"k": "B", "t": "合同成立时"}, {"k": "C", "t": "合同生效时"}, {"k": "D", "t": "价款付清时"}], "ans": "A", "ana": "A正确:买卖合同中标的物毁损灭失的风险,除法律另有规定或当事人另有约定外,自标的物交付时起转移。B合同成立/C合同生效/D价款付清均非风险转移时间点。【法条依据】《民法典》第604条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）在买卖合同中，出卖人出卖交由承运人运输的在途标的物，除当事人另有约定的以 外，毁损、灭失的风险自( )时起由买受人承担。", "opts": [{"k": "A", "t": "标的物交付"}, {"k": "B", "t": "合同成立"}, {"k": "C", "t": "合同生效"}, {"k": "D", "t": "支付贷款"}], "ans": "B", "ana": "B正确:出卖人出卖交由承运人运输的在途标的物(路货买卖),毁损灭失的风险自合同成立时起由买受人承担。这是路货买卖的特殊风险转移规则。【法条依据】《民法典》第606条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）某建筑设备有限公司向某施工企业出售了一批交由承运人运输的在途二手外墙喷涂 机器人，关于该买卖合同的履行的说法，正确的是( )。", "opts": [{"k": "A", "t": "设备公司对机器人不承担权利瑕症担保义务"}, {"k": "B", "t": "设备公司对机器人承担质量瑕症担保义务"}, {"k": "C", "t": "在途机器人毁损、灭失的风险自机器人交付时起由施工企业承担"}, {"k": "D", "t": "因机器人不符合质量要求，施工企业拒绝接受机器人，机器人毁损、灭失的风险由设备公司与企业共同承 担"}], "ans": "B", "ana": "B正确:出卖人对标的物承担质量瑕疵担保义务(无论什么情况下,出卖人应对标的物质量负责)。A权利瑕疵担保义务不可免除(除非买受人明知)。C在途标的物风险自合同成立时转移(非交付时)。D因质量不合格买受人拒绝接受→风险由出卖人承担(出卖人违约)。【法条依据】《民法典》第606条、第610条、第612条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）甲公司向乙公司订购2台同型号施工设备，同时订购了配套维修工具。合同约定设备 与维修工具分两批交货。根据《民法典》，关于该合同解除的说法，正确的是( )。", "opts": [{"k": "A", "t": "如果因设备不符合约定而解除合同，解除的效力及于维修工具"}, {"k": "B", "t": "如果因维修工具不符合约定而解除合同，解除的效力及于设备"}, {"k": "C", "t": "如果其中1台设备质量不符合约定，甲公司可以就全部2台设备解除合同"}, {"k": "D", "t": "如果第二批交付的设备不符合约定，甲公司可以就第一批交付的设备解除合同"}], "ans": "A", "ana": "A正确:因主物(设备)不符合约定解除合同,解除效力及于从物(维修工具)。但反之则否:因从物不符合约定解除合同,效力不及于主物。C标的物为数物,其中一物不符合约定可就该物解除。D分批交付的,一批不符合约定不影响其他批次的合同效力。【法条依据】《民法典》第631条、第632条、第633条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）关于借款合同的说法，正确的是( )。", "opts": [{"k": "A", "t": "自然人之间的借款合同，自贷款人提供借款时生效"}, {"k": "B", "t": "借款合同为有偿合同"}, {"k": "C", "t": "借款合同必须采用书面形式"}, {"k": "D", "t": "借款合同自双方当事人签字盖章之日起生效"}], "ans": "A", "ana": "A正确:自然人之间的借款合同为实践合同,自贷款人提供借款时成立(非诺成合同)。B借款合同可有偿也可无偿(自然人之间无约定利息视为无利息)。C不必须书面形式。D自然人借款为实践合同(非签字盖章时生效)。【法条依据】《民法典》第679条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）关于借款合同利息的说法，正确的是( )。", "opts": [{"k": "A", "t": "借款的利息可以预先在本金中扣除"}, {"k": "B", "t": "对支付利息的期限没有约定的，应当在返还借款时一并支付"}, {"k": "C", "t": "借款合同对支付利息没有约定的，视为没有利息"}, {"k": "D", "t": "借款人提前返还借款的，应当按照借款合同约定的期间支付利息"}], "ans": "C", "ana": "C正确:借款合同对支付利息没有约定的,视为没有利息。A不得预先扣除(按实际借款数额返还)。B无约定时,借款期不满1年→返还时一并支付;1年以上→每届满1年支付。D提前返还→按实际借款期间计算利息。【法条依据】《民法典》第670条、第674条、第677条、第680条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）借款100万元，约定利率5%，贷款支付借款时，扣除利息实际支付95万元，借款人需 要偿还( )万元。", "opts": [{"k": "A", "t": "100"}, {"k": "B", "t": "95"}, {"k": "C", "t": "99.75"}, {"k": "D", "t": "105"}], "ans": "C", "ana": "B正确:利息不得预先扣除,实际借款95万,按95万还本+按约定利率5%支付利息:95万×5%=4.75万,共99.75万。但本题实际计算方法:约定利率5%,实际借款95万(已扣5万利息),应还本金95万+利息95万×5%=95+4.75=99.75万。但王欣教材中答案可能不同。注意:民法典第670条规定利息不得预先扣除,按实际借款数额返还并计算利息。95+95*5%=95+4.75=99.75。【法条依据】《民法典》第670条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "下列主体中，不得担任保证人的是( )。", "opts": [{"k": "A", "t": "自然人"}, {"k": "B", "t": "营利法人"}, {"k": "C", "t": "以公益为目的的非营利法人"}, {"k": "D", "t": "公司的分支机构"}], "ans": "C", "ana": "C正确:以公益为目的的非营利法人不得担任保证人(《民法典》第683条)。A自然人可作保证人。B营利法人可作保证人(如担保公司)。D公司的分支机构经法人书面授权可在授权范围内提供保证。【法条依据】《民法典》第683条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）甲建设单位与乙施工单位签订了施工合同，由丙公司为甲出具工程款的支付担保， 担保方式为一般保证。甲到期未能支付工程款，乙应当要求( )。", "opts": [{"k": "A", "t": "丙先行代为支付"}, {"k": "B", "t": "甲和丙按比例支付"}, {"k": "C", "t": "甲先行支付"}, {"k": "D", "t": "甲和丙协商支付"}], "ans": "C", "ana": "C正确:一般保证中,保证人享有先诉抗辩权。债权人应先向债务人主张权利,经强制执行仍不能清偿时,保证人才承担保证责任。A丙不能先行代为支付(有先诉抗辩权)。B按份支付错。D不是协商问题。【法条依据】《民法典》第687条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "multi", "stem": "关于担保合同的说法，正确的是( )。", "opts": [{"k": "A", "t": "保证合同的双方当事人是债务人与债权人"}, {"k": "B", "t": "保证合同期限没有约定的，按主合同履行期限届满之日起6个月内"}, {"k": "C", "t": "主合同的效力不影响担保合同的效力"}, {"k": "D", "t": "第三人加入债务的，保证人的保证责任不受影响"}, {"k": "E", "t": "保证合同中，保证方式没有约定的，视为一般保证"}], "ans": "BDE", "ana": "BDE正确:B无约定的保证期间为6个月(自主债务履行期届满之日起)。D第三人加入债务,保证责任不受影响。E无约定或约定不明时,按一般保证(民法典第686条改了一般保证为默认)。A保证合同双方是保证人与债权人(非债务人)。C主合同无效,担保合同无效(从属性)。【法条依据】《民法典》第682条、第686条、第692条、第697条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "关于主合同变更对保证合同影响的说法，正确的是( )。", "opts": [{"k": "A", "t": "债权人和债务人未经保证人书面同意，协商变重主债权债务合同内容，保证不再承担保证责任"}, {"k": "B", "t": "债权人转让全部或部分债权，未通知保证人的，该转让对保证人不发生效力"}, {"k": "C", "t": "债权人和债务人的主合同履行期限，不得变更"}, {"k": "D", "t": "第三人加入债务的，保证人不再承担保证表任"}], "ans": "B", "ana": "B正确:债权人转让债权未通知保证人的,该转让对保证人不发生效力。A减轻债务的,保证人继续承担;加重债务的,对加重部分不承担(非全部不承担)。C主合同履行期限可经协商变更。D第三人加入债务的,保证人的保证责任不受影响(民法典第697条)。【法条依据】《民法典》第695-697条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）关于租赁合同中承租人转租的说法，正确的是( )。", "opts": [{"k": "A", "t": "承租人可以决定是否转租"}, {"k": "B", "t": "承租人转租的，承租人与出租人之间的租赁合同继续有效"}, {"k": "C", "t": "承租人转租的，转租合同的内容可以突破租赁合同的内容"}, {"k": "D", "t": "转租合同订立后，租赁合同自动解除"}], "ans": "B", "ana": "B正确:承租人转租的,承租人与出租人之间的租赁合同继续有效。第三人造成租赁物损失的,承租人应赔偿损失。A转租需经出租人同意(非承租人可随意决定)。C转租合同内容不得超出原租赁合同。D租赁合同不因转租自动解除。【法条依据】《民法典》第716条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）关于租赁合同的说法，正确的是( )。", "opts": [{"k": "A", "t": "租赁期限超过20年的，超过部分无效"}, {"k": "B", "t": "租赁期限超过6个月的，可以采用书面形式"}, {"k": "C", "t": "租赁合同应当采用书面形式，当事人未采用的，视为租赁合同未生效"}, {"k": "D", "t": "租赁物在租赁期间发生所有权变动的，租赁合同解除"}], "ans": "A", "ana": "A正确:租赁期限超过20年的,超过部分无效。B期限超过6个月的应采用书面形式。C未采用书面形式且无法确定期限的,视为不定期租赁(非未生效)。D买卖不破租赁:所有权变动不影响租赁合同效力。【法条依据】《民法典》第705条(20年)、第707条(书面)、第725条(买卖不破租赁)。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）甲公司与乙公司订立书面租赁合同，合同约定甲公司租用乙公司的施工设备，租期 12个月，租金月付。租赁期满后，因工程延期，甲公司继续支付租金，乙公司亦未拒绝。根据《民法典》， 关于租期届满后甲乙租赁合同效力的说法，正确的是( )。", "opts": [{"k": "A", "t": "甲乙租赁合同继续有效，但乙有权随时解除租赁合同"}, {"k": "B", "t": "甲乙租赁合同效力待定，乙公司事后明确同意续租才有效"}, {"k": "C", "t": "因双方并未明确续订租赁合同，甲乙租赁合同终止"}, {"k": "D", "t": "乙仍接受甲支付的租金，可视为双方租赁合同续订了12个月"}], "ans": "A", "ana": "A正确:租赁期满后,承租人继续使用、出租人未提出异议的,原租赁合同继续有效,但为不定期租赁。不定期租赁中,双方可随时解除合同(但应在合理期限前通知)。A描述正确:继续有效+可随时解除。B效力待定错。C合同终止错。D续订12个月错(不定期租赁无固定期限)。【法条依据】《民法典》第734条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）关于承揽合同，说法正确的是( )。", "opts": [{"k": "A", "t": "承揽合同应当采用书面形式"}, {"k": "B", "t": "承揽人发现定作人提供的图纸不合理的，可以直接修改"}, {"k": "C", "t": "承揽人在工作期间，应当接受定作人必要的监督检验"}, {"k": "D", "t": "承揽人可以根据工作需要自行决定是否留存复制品或者技术资料"}], "ans": "C", "ana": "C正确:承揽人在工作期间,应接受定作人必要的监督检验。A承揽合同不要求书面形式。B发现图纸不合理应及时通知定作人(不能直接修改)。D未经定作人同意不得留存复制品。【法条依据】《民法典》第779条、第782条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）关于承揽合同中解除权的说法，正确的是( )。", "opts": [{"k": "A", "t": "定作人不履行协助义务的，承揽人可以解除合同"}, {"k": "B", "t": "承揽人将承揽的工作交由第三人完成的，定作人有权解除合同"}, {"k": "C", "t": "承揽人可以随时解除合同，造成定作人损失的，应当赔偿损失"}, {"k": "D", "t": "定作人在承揽人完成工作前可以随时解除合同，造成承揽人损失的，应该赔偿损失"}], "ans": "D", "ana": "D正确:定作人在承揽人完成工作前可随时解除合同,造成承揽人损失的应当赔偿(定作人的任意解除权)。A定作人不履行协助义务,承揽人可催告→逾期可解除(不是当然可以)。B承揽人将主要工作交第三人需定作人同意;辅助工作可自行决定。C承揽人没有任意解除权(只有定作人有)。【法条依据】《民法典》第787条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "关于承揽合同解除权的说法，正确的是( )。", "opts": [{"k": "A", "t": "定作人可以解除合同，承揽人不得解除"}, {"k": "B", "t": "承揽人未经定作人同意，将主要承揽工作交由第三人完成，定作人可以解除合同"}, {"k": "C", "t": "定作人在承揽人完成承揽工作50%以上时，不得解除合同"}, {"k": "D", "t": "承揽合同不得由双方当事人协商解除"}], "ans": "B", "ana": "B正确:承揽人未经定作人同意将主要工作交第三人完成的,定作人可解除合同。A定作人和承揽人都有法定解除权(定作人任意解除权;承揽人特定情形解除权,如定作人不履行协助义务)。C定作人可随时解除(无50%限制)。D可协商解除所有合同。【法条依据】《民法典》第772条、第778条、第787条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）关于货运合同法律特征的说法，正确的是( )", "opts": [{"k": "A", "t": "货运合同是单务、有偿合同"}, {"k": "B", "t": "货运合同是实践合同"}, {"k": "C", "t": "货运合同的收货人和托运人可以是同一人，也可以不是同一人"}, {"k": "D", "t": "货运合同的标的是货物"}], "ans": "C", "ana": "C正确:收货人和托运人可以是同一人也可以不是同一人(货运合同可为第三人利益订立)。A货运合同为双务、有偿合同(非单务)。B货运合同为诺成合同(非实践合同)。D货运合同的标的是运输行为(非货物)。【法条依据】《民法典》第809条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）根据《民法典》，托运人或者收货人不支付运费、保管费或者其他费用的，除当事 人另有约定外,承运人对相应的运输货物享有( )。", "opts": [{"k": "A", "t": "提存权"}, {"k": "B", "t": "拍卖权"}, {"k": "C", "t": "拒绝运输权"}, {"k": "D", "t": "留置权"}], "ans": "D", "ana": "D正确:托运人或收货人不支付运费、保管费等,承运人对相应的运输货物享有留置权。A提存权/B拍卖权/C拒绝运输权均非此时的权利。【法条依据】《民法典》第836条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "（真题）关于货物在运输过程中因不可抗力灭失时运费承担的说法，正确的是( )。", "opts": [{"k": "A", "t": "未收取运费的，承运人有权请求支付运费"}, {"k": "B", "t": "无论是否收取运费，均应当由双方协商确定"}, {"k": "C", "t": "已经收取运费的，托运人有权请求返还"}, {"k": "D", "t": "承运人和托运人根据公平原则平均承担"}], "ans": "C", "ana": "C正确:货物在运输过程中因不可抗力灭失,未收取运费的承运人不得请求支付;已收取运费的,托运人可请求返还。A错误(不得请求)。B协商错。D平均承担错(承运人承担运费损失,托运人承担货物损失)。【法条依据】《民法典》第835条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "在仓储合同中，储存期限内仓储物毁损的，应由保管人承担赔偿责任的情形是( )", "opts": [{"k": "A", "t": "因仓储物本身的自然性质造成的。"}, {"k": "B", "t": "因包装不符合约定造成的；"}, {"k": "C", "t": "因保管不善造成的；"}, {"k": "D", "t": "因超过有效储存期造成的"}], "ans": "C", "ana": "C正确:因保管不善造成仓储物毁损的,保管人应承担赔偿责任。A自然性质/B包装不符合约定/D超过有效储存期→保管人不承担责任。【法条依据】《民法典》第917条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "关于仓储合同保管人的权利义务的说法，正确的是( )。", "opts": [{"k": "A", "t": "保管人仅负责保管，不负责对入库仓储物进行验收"}, {"k": "B", "t": "因仓储物超过有效储存期造成仓储物变质、损坏的，保管人不承担赔偿责任"}, {"k": "C", "t": "保管期间，保管人有权拒绝仓单持有人检查仓储物的要求"}, {"k": "D", "t": "仓单持有人不得转让提取仓储物的权利"}], "ans": "B", "ana": "B正确:因仓储物超过有效储存期造成变质损坏的,保管人不承担赔偿责任。A保管人应进行验收并出具仓单。C保管期间应允许仓单持有人检查仓储物或提取样品。D仓单可以转让(记名仓单可背书转让)。【法条依据】《民法典》第908条、第910条、第911条、第917条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "single", "stem": "某施工企业与某仓储中心签订了建材仓储合同，并按照合同约定支付了建材后施工企业提取建材时 发现部分建材因保管不善潮湿损坏，双方发生争议，关于该仓储合同的说法，正确的是( )。", "opts": [{"k": "A", "t": "仓储中心应当对潮湿损坏的建材承担赔偿责任"}, {"k": "B", "t": "施工企业向仓储中心交付建材时合同成立"}, {"k": "C", "t": "施工企业逾期提取建材，仓储中心可以直接提取建材"}, {"k": "D", "t": "施工企业提前提取建材，仓储中心应当减收仓储费"}], "ans": "A", "ana": "A正确:保管不善造成损坏,仓储中心应承担赔偿责任。B仓储合同为诺成合同(非实践合同)。C逾期提取,保管人可提存(非直接提取)。D提前提取不减收仓储费。【法条依据】《民法典》第914条、第915条、第917条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第5章 建设工程合同法律制度", "type": "multi", "stem": "根据《民法典》，关于委托合同中委托人义务的说法，正确的是( )。", "opts": [{"k": "A", "t": "受托人为处理委托事务垫付的必要费用，委托人应当偿还该费用，但不用支付利息"}, {"k": "B", "t": "委托人应当预付处理委托事务的费用"}, {"k": "C", "t": "受托人完成委托事务的，委托人应当按照约定向其支付报酬"}, {"k": "D", "t": "委托人经受托人同意，可以在受托人之外委托第三人处理委托事务"}, {"k": "E", "t": "因不可归责于受托人的事由，委托事务不能完成的，委托人应当向受托人支付相应的报酬，但当事人另有 约定的除外"}], "ans": "BCDE", "ana": "BCDE正确:B委托人应预付费用。C应按约定支付报酬。D经受托人同意可委托第三人。E因不可归责于受托人的事由未完成,应支付相应报酬。A错误:垫付必要费用应偿还并支付利息(自垫付之日起)。【法条依据】《民法典》第921条、第928条。---", "law" 单位可以委托具备相应资质的其他单位，以本单位的名义承揽工程；"}, {"k": "E", "t": "不得对有特殊要求的专用设备指定供应商"}], "ans": "AB", "ana": "A正确：设计单位须按工程建设强制性标准设计并对其设计质量负责。B正确：设计单位应在施工前就设计意图向施工企业和监理单位作出说明。C错误：注册执业人员须签字盖章，未经注册人员不得以本人名义执业。D错误：设计单位不得允许他人以本单位名义承揽工程（禁止挂靠）。E错误：对特殊要求的专用设备，设计单位可以指定供应商（但不得指定生产厂），故\"不得指定供应商\"表述错误。故选AB。【法条依据】《建设工程勘察设计管理条例》。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（真题）关于工程监理单位质量责任和义务,正确的是（ ）。", "opts": [{"k": "A", "t": "建设工程勘察设计文件是实施建设工程监理的依据"}, {"k": "B", "t": "工程监理单位与被监理的工程设备的供应单位有隶属关系的，可以承担该项建设工程的监理义务"}, {"k": "C", "t": "未经总监理工程师签字，建筑材料不得在工程上使用或者安装"}, {"k": "D", "t": "未经监理工程师签字，建设单位不得进行竣工验收"}], "ans": "A", "ana": "A正确:勘察设计文件是监理的依据之一。B与被监理工程的设备供应单位有隶属关系不得承担监理。C未经监理工程师签字建筑材料不得使用(非总监理工程师)。D未经总监理工程师签字建设单位不得进行竣工验收。【法条依据】《建设工程质量管理条例》第37条、第38条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（真题）根据《建设工程质量管理条例》，关于建设单位质量责任和义务的说法，正确的是 （ ）。", "opts": [{"k": "A", "t": "建设单位应当就施工图设计文件向施工企业进行技术交底"}, {"k": "B", "t": "建设单位不得明示或暗示设计单位违反抗震设防强制性标准，降低工程抗震性能"}, {"k": "C", "t": "建设单位在开工后，应当尽快办理工程质量监督手续"}, {"k": "D", "t": "建设单位应当对其采购的材料设备进行使用前的检验和试验"}], "ans": "B", "ana": "B正确:建设单位不得明示或暗示违反抗震设防强制标准。A向施工企业技术交底→设计单位职责。C开工前(非开工后)办理工程质量监督手续。D检验试验→施工单位职责(建设单位采购的材料设备由施工单位检验)。【法条依据】《建设工程质量管理条例》第10条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（真题）关于总分包单位的质量责任的说法,正确的是（ ）。", "opts": [{"k": "A", "t": "分包工程质量由分包单位自行向建设单位负责"}, {"k": "B", "t": "分包单位应当接受总承包单位的质量管理"}, {"k": "C", "t": "总承包单位与分包单位对分包工程的质量各自向建设单位承担相应的责任"}, {"k": "D", "t": "分包工程发生质量问题，建设单位只能向总承包单位请求赔偿"}], "ans": "B", "ana": "B正确:分包单位应接受总承包单位的质量管理。A总分包就分包工程对建设单位承担连带责任(非自行负责)。C连带责任(非各自承担相应责任)。D可向总承包或分包单位请求赔偿(连带责任)。【法条依据】《建筑法》第55条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（模拟题）某单位工程设计图纸注明的混凝土标号为C30，但监理工程师认为该设计不符合承 包合同约定的C35等级，书面通知承包人按照合同约定的C35施工。该事件说法正确的是（ ）。", "opts": [{"k": "A", "t": "施工单位应当继续按照原施工图纸施工"}, {"k": "B", "t": "施工单位应当按照监理通知要求施工"}, {"k": "C", "t": "施工单位发现设计不符合承包合同约定时，应按照承包合同约定施工"}, {"k": "D", "t": "监理单位认为设计不符合技术标准和合同约定的，应当报告建设单位"}], "ans": "D", "ana": "D正确:监理认为设计不符合技术标准或合同约定应报告建设单位,由建设单位要求设计单位修改。A按图纸施工。B应按图纸施工,监理通知不得替代设计文件。C发现设计问题应通过建设单位处理(非自行按合同施工)。【法条依据】《建设工程质量管理条例》第28条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "根据《建设工程勘察设计管理条例》，关于设计文件修改的说法，正确的是（ ）", "opts": [{"k": "A", "t": "监理单位发现设计文件不符合工程建设强制性标准，应当报告建设单位"}, {"k": "B", "t": "原设计单位已经注销，可以由具有执业资格的原注册人员修改"}, {"k": "C", "t": "经原设计单位授权，具有相应资质的设计单位可以按照相关设计规范修改"}, {"k": "D", "t": "委托其他设计单位修改设计文件的，无需原设计单位同意"}], "ans": "A", "ana": "A正确:监理发现设计不符合强制标准应报告建设单位。B原设计单位注销后,修改需由具有相应资质的设计单位修改(非原注册人员)。C经建设单位同意可委托其他设计单位(非原设计单位授权)。D委托其他设计单位修改需原设计单位书面同意(对原设计负责)。【法条依据】《建设工程勘察设计管理条例》第28条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（真题）关于建设工程见证取样的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "见证人员应当在试样或其包装上作出标识、标志"}, {"k": "B", "t": "涉及结构安全的试块、试件和材料见证取样比例不得低于有关技术标准中规定应取样数量的50%"}, {"k": "C", "t": "见证人员应当由施工企业中具备施工试验知识的专业技术人员担任"}, {"k": "D", "t": "用于承重墙体的砌筑砂浆试块必须实施见证取样"}], "ans": "D", "ana": "D正确:用于承重墙体的砌筑砂浆试块必须实施见证取样。A标识由取样人员+见证人员共同进行。B见证取样比例不得低于应取样数量的30%(非50%)。C见证人员应由建设单位或监理单位具备试验知识的专业人员担任(非施工单位)。【法条依据】《房屋建筑工程和市政基础设施工程实行见证取样和送检的规定》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（模拟题）关于工程质量检测的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "检测机构应当建立档案管理制度，并应当单独建立检测结果不合格项目台账"}, {"k": "B", "t": "应当由施工企业委托具有相应资质的检测机构进行检测"}, {"k": "C", "t": "检测机构可以监制建筑材料、构配件和设备"}, {"k": "D", "t": "检测报告应当由工程质量机构法定代表人签署"}], "ans": "A", "ana": "A正确:检测机构应建立档案管理制度并单独建立不合格项目台账。B应由建设单位委托检测机构(非施工单位)。C检测机构不得监制建筑材料。D检测报告由检测人员签字+检测机构法定代表人签署+加盖检测机构公章。【法条依据】《建设工程质量检测管理办法》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（真题）因施工企业的原因，致使建设工程质量不符合约定的，发包人请求并经施工企业修 理后造成逾期交付的，施工企业（ ）。", "opts": [{"k": "A", "t": "不承担违约责任，修理费用由施工企业承担"}, {"k": "B", "t": "应当承担缔约过失责任"}, {"k": "C", "t": "应当承担违约责任"}, {"k": "D", "t": "应当承担侵权责任"}], "ans": "C", "ana": "C正确:因施工企业原因质量不符合约定,修理后逾期交付→应承担违约责任(包括逾期违约金)。A需承担违约责任。B不是缔约过失(合同已成立)。D应是合同责任(违约责任)非侵权责任。【法条依据】《民法典》第582条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（真题）关于建设工程返修的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "施工企业仅对已完成的工程负责返修"}, {"k": "B", "t": "对施工中出现质量问题的建设工程，无论是否属于施工企业原因造成的，施工企业都应当负责返修"}, {"k": "C", "t": "对于竣工验收不合格的建设工程，若是施工企业原因造成的质量问题，由施工企业有偿返修"}, {"k": "D", "t": "由设计缺陷造成质量不合格的，承包人不负责返修"}], "ans": "B", "ana": "B正确:对施工中出现质量问题的建设工程,不论何种原因施工单位都应负责返修(然后按责任归属追偿费用)。A不仅对已完工程负责(施工过程中的质量问题也应返修)。C施工单位原因造成的应无偿返修。D设计缺陷造成的由设计单位承担返修费用但施工单位仍应负责返修。【法条依据】《建设工程质量管理条例》第40条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（真题）关于施工单位施工质量检验和返修的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "隐蔽工程在隐蔽前，应当通知建设单位和勘察、设计单位"}, {"k": "B", "t": "建设工程竣工验收不合格的，施工单位应当负责返修"}, {"k": "C", "t": "因建设单位原因导致工程质量缺陷的，施工单位应当无偿修复"}, {"k": "D", "t": "因修复工程质量缺陷造成逾期交付的，施工单位均应承担违约责任"}], "ans": "B", "ana": "B正确:竣工验收不合格的施工单位应负责返修。A隐蔽前应通知建设单位和监理单位(非勘察设计单位)。C因建设单位原因造成缺陷,施工单位负责返修但费用由建设单位承担(非无偿)。D因建设单位原因造成逾期交付的,施工单位不承担违约责任。【法条依据】《建设工程质量管理条例》第32条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "multi", "stem": "（真题）根据《建设工程质量管理条例》，属于建设工程竣工验收应当具备的条件有（ ）", "opts": [{"k": "A", "t": "完成建设工程设计和合同约定的各项内容"}, {"k": "B", "t": "有健全的财务管理档案"}, {"k": "C", "t": "有完整的技术档案和施工管理资料"}, {"k": "D", "t": "有监理单位出具的竣工验收报告"}, {"k": "E", "t": "有施工企业签署的工程保修书"}], "ans": "ACE", "ana": "ACE正确:竣工验收条件:完成设计和合同约定内容、有完整技术档案和施工管理资料、有材料设备试验报告、有质量合格文件、有工程保修书。B财务管理档案不是竣工验收条件。D由监理单位出具质量评估报告(非竣工验收报告),竣工报告由施工单位出具。【法条依据】《建设工程质量管理条例》第16条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "multi", "stem": "建设工程竣工验收条件有（ ）。", "opts": [{"k": "A", "t": "已经办理工程竣工资料归档手续"}, {"k": "B", "t": "有完整的技术档案和施工管理资料"}, {"k": "C", "t": "有施工企业签署的工程保修书"}, {"k": "D", "t": "有工程使用的全部建筑材料的进场试验报告"}, {"k": "E", "t": "有建设、设计、施工、工程监理等单位分别签署的质量合格文件"}], "ans": "BC", "ana": "BC正确:B完整技术档案和施工管理资料。C工程保修书。AE表述不准确:归档手续在验收后进行;质量合格文件由各单位分别签署是对的。D全部材料的试验报告(错,是主要材料的)。【法条依据】《建设工程质量管理条例》第16条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "（真题）关于建设工程竣工规划验收的说法,正确的是（ ）。", "opts": [{"k": "A", "t": "建设工程竣工后，施工企业应当向城乡规划主管部门提出竣工规划验收申请"}, {"k": "B", "t": "竣工规划验收合格的，由城乡规划主管部门出具规划认可文件或核发建设工程规划验收合格证"}, {"k": "C", "t": "报送有关竣工验收材料必须在竣工后1年完成"}, {"k": "D", "t": "未在规定时间内向城乡规划主管部门报告竣工验收材料的，责令限期补报，并罚款"}], "ans": "B", "ana": "B正确:竣工规划验收合格由城乡规划主管部门出具规划认可文件或核发验收合格证。A建设单位(非施工企业)申请规划验收。C验收后6个月内报送资料(非竣工后1年完成)。D责令限期补报,逾期不报的罚款(非直接罚款)。【法条依据】《城乡规划法》第45条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "multi", "stem": "关于建筑工程节能的说法，正确的有（ ）。", "opts": [{"k": "A", "t": "建设单位组织竣工验收应当对民用建筑是否符合民用建筑节能强制性标准进行查验"}, {"k": "B", "t": "单位工程竣工验收应当在建筑节能分部工程验收合格后进行"}, {"k": "C", "t": "政府投资项目不符合强制性节能标准的不得批准建设"}, {"k": "D", "t": "不符合强制性节能标准的项目可以开工建设"}, {"k": "E", "t": "建筑节能分部工程的质量验收，建设单位应当先行自检合格"}], "ans": "ABC", "ana": "ABC正确:A竣工验收应查验建筑节能标准。B单位工程验收应在节能分部验收合格后进行。C政府投资项目不符合节能标准不得批准建设。D不符合节能标准的项目不得开工建设。E建筑节能分部验收由建设单位组织(非自检)。【法条依据】《民用建筑节能条例》。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第7章 建设工程质量法律制度", "type": "single", "stem": "根据《建设项目环境保护管理条件》，依法应当编制环境影响报告书，环境影响报告表建设 项目，关于其竣工环保验收的说法，正确的是（ ）", "opts": [{"k": "A", "t": "分期建设，分期投入生产或使用的建设项目，其相应的环境保护设施应当合并验收"}, {"k": "B", "t": "对配套建设的环境设施进行验收，编制的验收报告一律向社会公开"}, {"k": "C", "t": "配套建设的环境保护设施未经验收合格，可以先行使用"}, {"k": "D", "t": "建设单位应当对配套建设的环境保护设施进行验收，编制验收报告"}], "ans": "D", "a 水水源保护区内"}, {"k": "D", "t": "具有特殊经济文化价值的水体"}], "ans": "C", "ana": "C正确:饮用水水源保护区内禁止设置排污口(《水污染防治法》第64条)。A风景名胜区水体→禁止新建排污口(已有需限期治理)。B货运码头非特别保护区。D有特殊经济文化价值水体→禁止新建排污口。【法条依据】《水污染防治法》第64条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第8章 建设工程环境保护和历史文化遗产保护法律制度", "type": "single", "stem": "（真题）关于危险废物污染环境防治，说法正确的是（ ）。", "opts": [{"k": "A", "t": "危险废物的容器和包装物应当根据实际需要设置危险废物识别标志"}, {"k": "B", "t": "产生工业固体废物的单位，应当按照国家有关规定申请取得排污许可证"}, {"k": "C", "t": "将危险废物与旅客在同一运输工具上运载的，应当按照国家有关规定申请取得许可证"}, {"k": "D", "t": "危险废物的容器和包装物转作他用时，应当经行政主管部门批准"}], "ans": "B", "ana": "B正确:产生工业固体废物的单位应申请取得排污许可证。A危险废物容器和包装物必须(非根据实际需要)设置危险废物识别标志。C禁止将危险废物与旅客在同一运输工具上运载。D危险废物容器和包装物不得转作他用。【法条依据】《固体废物污染环境防治法》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第8章 建设工程环境保护和历史文化遗产保护法律制度", "type": "single", "stem": "根据《关于推进建筑垃圾减量化的指导意见》，关于建筑垃圾处理的说法，正确的是（ ）", "opts": [{"k": "A", "t": "建设单位应当建立建筑垃圾分类收集与存放管理制度"}, {"k": "B", "t": "建筑垃圾实行分类收集、分类存放、统一处置制度"}, {"k": "C", "t": "鼓励以前端收集为导向对建筑垃圾进行细化分类"}, {"k": "D", "t": "鼓励采用现场泥沙分离、泥浆脱水预处理等工艺，减少工程渣土和工程泥浆排放"}], "ans": "D", "ana": "D正确:鼓励采用现场泥沙分离泥浆脱水等工艺减少工程渣土和泥浆排放。A施工单位(非建设单位)应建立分类收集存放制度。B分类收集分类存放分类处置(非统一处置)。C鼓励以后端处置为导向(非前端收集)。【法条依据】《关于推进建筑垃圾减量化的指导意见》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第8章 建设工程环境保护和历史文化遗产保护法律制度", "type": "multi", "stem": "（真题）根据《环境噪声污染防治法》，在城市市区噪声敏感建筑物集中区域内，禁止夜间 进行产生环境噪声污染的建筑施工作业，但可以除外的情形有（ ）。", "opts": [{"k": "A", "t": "抢修抢险作业"}, {"k": "B", "t": "涉及施工企业商业秘密的"}, {"k": "C", "t": "使用专有技术的"}, {"k": "D", "t": "利用扶贫资金实行以工代赈的"}, {"k": "E", "t": "因生产工艺上要求必须连续作业的"}], "ans": "AE", "ana": "AE正确:抢修抢险作业和工艺要求必须连续作业的可例外(夜间禁止施工的例外)。BCD均不是法定例外情形。【法条依据】《噪声污染防治法》第31条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第8章 建设工程环境保护和历史文化遗产保护法律制度", "type": "single", "stem": "（真题）在噪声敏感建筑物集中区域因特殊需要必须连续施工作业的，应当取得地方人民政 府住房城乡建设、生态环境主管部门或者地方人民政府指定的部门的证明，并（ ）。", "opts": [{"k": "A", "t": "向附近居民支付赔偿费用"}, {"k": "B", "t 告"}], "ans": "D", "ana": "D正确:建设单位应对配套环保设施进行验收编制验收报告。A分期建设的应分期验收。B除涉及国家秘密外公开(非一律公开)。C未经验收合格不得使用。【法条依据】《建设项目环境保护管理条例》第19条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第8章 建设工程环境保护和历史文化遗产保护法律制度", "type": "single", "stem": "关于施工发现文物保护的说法，正确的是（ ）", "opts": [{"k": "A", "t": "在施工中发现文物，应当保护现场，并在24小时内报告当地文物行政部门"}, {"k": "B", "t": "文物行政部门接到报告后，一般应在在24小时内赶赴现场，并立即提出处理意见"}, {"k": "C", "t": "文物行政部门接到报告后，应当报请当地人民政府通知公安机关协助保护现场"}, {"k": "D", "t": "施工中发现的文物属于国家所有，任何单位和个人不得哄抢、私分、藏匿"}], "ans": "D", "ana": "D正确:施工中发现的文物属国家所有,任何单位和个人不得哄抢私分藏匿。A应在24小时内报告(对,但D更全面正确)。B文物部门应在24小时内(非一般)赶赴现场。C应在24小时内通知公安机关(非报请政府通知)。【法条依据】《文物保护法》第32条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）根据《劳动合同法》，用人单位与劳动者明确合同终止时间的合同是（ ）", "opts": [{"k": "A", "t": "固定期限劳动合同"}, {"k": "B", "t": "无固定期限劳动合同"}, {"k": "C", "t": "集体合同"}, {"k": "D", "t": "以完成一定工作任务为期的劳动"}], "ans": "A", "ana": "A正确:固定期限劳动合同约定明确的合同终止时间。B无固定期限无确定终止时间。C集体合同不是以合同终止时间分类的。D以完成一定工作任务为期限的合同以任务完成而非时间终止。【法条依据】《劳动合同法》第13条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "（真题）根据《劳动合同法》，按期限划分，劳动合同可以分为（ ）。", "opts": [{"k": "A", "t": "固定期限劳动合同"}, {"k": "B", "t": "无固定期限劳动合同"}, {"k": "C", "t": "非全日制用工劳动合同"}, {"k": "D", "t": "以完成一定工作任务为期限的劳动合同"}, {"k": "E", "t": "零散用工劳动合同"}], "ans": "ABD", "ana": "ABD正确:劳动合同按期限分为固定期限、无固定期限、以完成一定工作任务为期限三种。C非全日制用工是按用工方式分类(非期限分类)。E零散用工不是法定分类。【法条依据】《劳动合同法》第12条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）某施工企业的下列劳动者中，有权要求与企业订立无固定期限劳动合同的是（ ）", "opts": [{"k": "A", "t": "在该施工企业连续工作刚满8年的张某"}, {"k": "B", "t": "在该施工企业工作满2年，并被任命为总经理的王某"}, {"k": "C", "t": "在该施工企业已经连续订立2次固定期限劳动合同，因工负伤调整到其他工作岗位的李某"}, {"k": "D", "t": "在该施工企业累计工作刚满10年，期间曾离开过企业1年的刘某"}], "ans": "C", "ana": "C正确:连续订立2次固定期限劳动合同且劳动者无过失→续订时应订立无固定期限合同。A连续工作满10年(刚满8年不够)。B满2年不够10年。D累计满10年但期间离开→非连续工作满10年(需连续)。【法条依据】《劳动合同法》第14条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（模拟题）2022年5月10日张某进入某公司工作。同年6月1日,张某与该公司签订了一年的劳 动合同,试用期1个月。根据《劳动合同法》说法正确的是（ ）。", "opts": [{"k": "A", "t": "张某与该公司2022年6月1日建立劳动关系"}, {"k": "B", "t": "合同自2022年7月1日起生效"}, {"k": "C", "t": "合同自2022年6月1日起生效"}, {"k": "D", "t": "张某与该公司2022年7月1日建立起劳动关系"}], "ans": "C", "ana": "C正确:合同自6月1日签订生效,劳动关系自5月10日用工之日起建立。A劳动关系自5月10日建立(非6月1日)。B合同自签订之日生效(非7月1日)。D劳动关系自用工之日(5月10日)建立。【法条依据】《劳动合同法》第7条、第10条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "关于劳动关系的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "用人单位自订立劳动合同之日起与劳动者建立劳动关系"}, {"k": "B", "t": "劳动关系的存在，以书面劳动合同的订立为条件"}, {"k": "C", "t": "订立了书面劳动合同，即使没有用工事实，劳动关系也已经建立"}, {"k": "D", "t": "建立劳动关系，应当订立书面劳动合同"}], "ans": "D", "ana": "D正确:建立劳动关系应订立书面劳动合同。A自用工之日起建立劳动关系(非订立合同之日)。B劳动关系以用工事实为条件(非以书面合同为条件)。C无用工事实仅有合同不建立劳动关系。【法条依据】《劳动合同法》第7条、第10条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "（真题）下列条款中，劳动合同应当具备的条款有（ ）。", "opts": [{"k": "A", "t": "试用期"}, {"k": "B", "t": "社会保险"}, {"k": "C", "t": "工作方法与要求"}, {"k": "D", "t": "劳动合同期限"}, {"k": "E", "t": "工作内容和工作地点"}], "ans": "BDE", "ana": "BDE正确:劳动合同必备条款包括:用人单位信息+劳动者信息+合同期限+工作内容地点+工作时间和休息休假+劳动报酬+社会保险+劳动保护等。A试用期是约定条款(非必备)。C工作方法与要求不是法定必备条款。【法条依据】《劳动合同法》第17条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）关于劳动合同试用期的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "初次订立劳动合同的，可以仅约定试用期，而不约定劳动合同期限"}, {"k": "B", "t": "同一用人单位与同一劳动者只能约定1次试用期"}, {"k": "C", "t": "试用期不包含在劳动合同期限之内"}, {"k": "D", "t": "劳动合同期限不满1年的，不得约定试用期"}], "ans": "B", "ana": "B正确:同一用人单位与同一劳动者只能约定1次试用期。A试用期包含在合同期限内,不得仅约定试用期。C试用期包含在合同期限内。D不满1年的→可约定试用期(不超过1个月)。【法条依据】《劳动合同法》第19条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "马某与某施工企业订立了一份2年期限的劳动合同，合同约定了试用期，同时约定合同生效时 间为5月1日，则试用期最晚应当截止于（ ）。", "opts": [{"k": "A", "t": "11月1日"}, {"k": "B", "t": "8月1日"}, {"k": "C", "t": "7月1日"}, {"k": "D", "t": "6月1日"}], "ans": "C", "ana": "C正确:2年期限劳动合同试用期最长不超过2个月,5月1日起算→最晚7月1日。试用期包含在合同期限内。【法条依据】《劳动合同法》第19条:1年≤合同<3年→试用期≤2个月。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）关于劳动合同履行的说法，正确的 是（ ）。", "opts": [{"k": "A", "t": "用人单位变更投资人不影响劳动合同的履行"}, {"k": "B", "t": "用人单位变更名称，原劳动合同可终止"}, {"k": "C", "t": "用人单位发生合并或者分立，原劳动合同解除"}, {"k": "D", "t": "用人单位变更法定代表人，应当重新订立劳动合同"}], "ans": "A", "ana": "A正确:用人单位变更投资人不影响劳动合同履行。B变更名称不影响履行。C合并分立后原劳动合同继续有效(由承继单位继续履行)。D变更法定代表人不影响履行(无需重新订立)。【法条依据】《劳动合同法》第33条、第34条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）劳动者可以立即解除劳动合同且无需事先告知用人单位的是（ ）", "opts": [{"k": "A", "t": "用人单位未按照劳动合同的约定提供劳动条件"}, {"k": "B", "t": "用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动"}, {"k": "C", "t": "用人单位未及时足额支付劳动报酬"}, {"k": "D", "t": "用人单位制定的规章制度违反法律、法规的规定，损害劳动者的权益"}], "ans": "B", "ana": "B正确:用人单位以暴力威胁或非法限制人身自由强迫劳动的,劳动者可立即解除无需事先告知。ACD均需提前30日书面通知(或试用期提前3日)。【法条依据】《劳动合同法》第38条第2款。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）陈某应聘到某施工企业，双方于2022年3月12日签订了劳动合同。合同中约定试用期 2个月，签约次日合同开始履行，2022年6月17日，陈某因找到新的工作拟解除原劳动合同。根据《劳动合同 法》，关于该劳动合同解除的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "陈某辞职必须取得用人单位同意"}, {"k": "B", "t": "陈某口头通知用人单位即可解除劳动合同"}, {"k": "C", "t": "陈某应提前30日以书面形式通知用人单位"}, {"k": "D", "t": "陈某应报请劳动行政主管部门同意后以书面形式通知用人单位"}], "ans": "C", "ana": "C正确:正式工(试用期满)解除劳动合同应提前30日书面通知。A辞职无需用人单位同意(通知即可)。B正式工不能口头通知(需书面)。D不需劳动行政主管部门同意。【法条依据】《劳动合同法》第37条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "下列情形中，用人单位提前30日以书面形式通知劳动者，可以解除劳动合同的是（ ）。", "opts": [{"k": "A", "t": "某用人单位生产经营发生严重困难的"}, {"k": "B", "t": "某公司项目部安全员孙某患肺病在规定的医疗期满后不能从事原工作，也不能从事由用人单位为行安排的 工作的"}, {"k": "C", "t": "某集团公司科技部的钱某不能胜任工作"}, {"k": "D", "t": "李某与公司订立劳动同时所依据的客况发生了重大变化，致使劳动合同无法履行的"}], "ans": "B", "ana": "B正确:医疗期满不能从事原工作也不能从事另行安排的工作→用人单位提前30日通知可解除(需支付经济补偿)。A经济性裁员需经特别程序。C钱某不能胜任→需培训或调岗后仍不能胜任才可解除。D客观情况重大变化→需先协商变更,协商不成才可解除。【法条依据】《劳动合同法》第40条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "（真题）劳动者发生下列情形，用人单位可以随时解除劳动合同的有（ ）", "opts": [{"k": "A", "t": "在试用期被证明不符合录用条件的"}, {"k": "B", "t": "不能胜任工作，经过培训或者调整工作岗位，仍不能胜任工作的"}, {"k": "C", "t": "严重违反用人单位规章制度的"}, {"k": "D", "t": "同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响的"}, {"k": "E", "t": "患病，在规定的医疗期满后不能从事原工作，也不能从事由用人单位另行安排的工作的"}], "ans": "ACD", "ana": "ACD正确:试用期不符合条件、严重违章、同时与其他单位建立劳动关系严重影响本职工作→可随时解除。B需提前30日通知(非随时解除)。E需提前30日通知+支付经济补偿(非随时解除)。【法条依据】《劳动合同法》第39条、第40条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "某公司进入破产重整程序，需要裁员30人。根据《劳动合同法》，属于应当优先留用的人员 有（ ）。", "opts": [{"k": "A", "t": "与该公司订立无固定期限劳动合同的"}, {"k": "B", "t": "家庭有未成年人的"}, {"k": "C", "t": "与该公司订立较长期限的固定期限劳动合同的"}, {"k": "D", "t": "家庭无其他就业人员，有需要扶养的老人的"}, {"k": "E", "t": "在本企业因工负伤并被确认部分丧失劳动能力的"}], "ans": "ACD", "ana": "ACD正确:裁员时优先留用:与本单位订立无固定期限合同的、订立较长期限固定期限合同的、家庭无其他就业人员有需要扶养老人的。B无未成年人的特殊保护规定。E部分丧失劳动能力应优先留用但非法律规定(属于因工负伤的特殊保护)。【法条依据】《劳动合同法》第41条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "某施工单位试验员李某2019年3月上班，2020年5月，施工单位以李某怀孕不能胜任工作为由将其 解雇。经劳动争议仲裁，如李某不愿意回单位上班，可主张按（ ）的工资标准支付赔偿金。", "opts": [{"k": "A", "t": "1个月"}, {"k": "B", "t": "1.5个月"}, {"k": "C", "t": "3个月"}, {"k": "D", "t": "4.5个月"}], "ans": "C", "ana": "C正确:违法解除劳动合同→支付赔偿金=经济补偿标准的2倍。李某工作1年2个月→经济补偿为1.5个月工资,赔偿金=1.5×2=3个月。注意:孕期属于不得解除的情形,单位违法解除应支付赔偿金(非经济补偿)。【法条依据】《劳动合同法》第42条、第47条、第87条。---", "law": "", "tag": "模拟题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "甲安装工程公司拟与在公司工作了15年的王某解除合同，劳动合同解除前12个月王某的月平均工资 为2.3万元,该公司职工月平均工资0.8万元，甲所在设区的市级人民政府公布的本地区上年度职工月平均工 资为0.65万元。根据《劳动合同法》，甲应当向王某支付的经济补偿是（ ）。", "opts": [{"k": "A", "t": "34.5万元"}, {"k": "B", "t": "12万元"}, {"k": "C", "t": "23.4万元"}, {"k": "D", "t": "9.75万元"}], "ans": "C", "ana": "C正确:工作15年→经济补偿=15个月工资。月工资上限:用人单位所在地区上年度职工月平均工资3倍=0.65×3=1.95万。王某工资2.3万>1.95万→按1.95万计算。1.95×12=23.4万(劳动者月工资高于3倍的按3倍计算,支付年限最高12年)。但王某工作15年,按15个月算...实际应为:2.3>0.65*3=1.95,按1.95*12=23.4万元(封顶12年)。【法条依据】《劳动合同法》第47条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）根据《劳动合同法》，在劳务派遣用工方式中，订立劳务派遣协议的主体是（ ）", "opts": [{"k": "A", "t": "派遣单位与用工单位"}, {"k": "B", "t": "用工单位与劳动者"}, {"k": "C", "t": "用工单位与当地人民政府"}, {"k": "D", "t": "派遣单位与劳动者"}], "ans": "A", "ana": "A正确:劳务派遣协议由派遣单位与用工单位订立。B用工单位与劳动者是用工关系(非派遣协议当事人)。C与政府无关。D派遣单位与劳动者订立劳动合同(非派遣协议)。【法条依据】《劳动合同法》第59条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "（真题）关于劳务派遣的说法，正确的有（ ）。", "opts": [{"k": "A", "t": "经营劳务派遣业务，应当向劳动行政部门申请行政许可"}, {"k": "B", "t": "劳务派遣用工劳动只能在临时性、辅助性或者替代性的工作岗位上实施"}, {"k": "C", "t": "用工单位可以将被派遣劳动者再派遣到其他用人单位"}, {"k": "D", "t": "劳务派遣用工方式使劳动者的聘用与使用分离"}, {"k": "E", "t": "除岗前培训费以外，劳务派遣单位不得再向被派遣劳动者收取费用"}], "ans": "ABD", "ana": "ABD正确:A经营劳务派遣需行政许可。B只能在临时性辅助性替代性岗位实施。D聘用与使用分离是劳务派遣的本质特征。C用工单位不得将被派遣劳动者再派遣。E劳务派遣单位不得以任何名义向劳动者收取费用(包括培训费)。【法条依据】《劳动合同法》第57条、第62条、第66条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）关于劳务派遣的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "劳务派遣中的劳动关系与用工关系相分离"}, {"k": "B", "t": "劳务派遣主要涉及劳务派遣单位和劳动者双方法律关系"}, {"k": "C", "t": "劳务派遣是目前建筑行业的主要用工形式"}, {"k": "D", "t": "劳务派遣单位不得与劳动者约定试用期"}], "ans": "A", "ana": "A正确:劳动关系(与派遣单位)与用工关系(与用工单位)相分离。B涉及三方(派遣单位+劳动者+用工单位)。C建筑行业主要用工形式是直接用工(非劳务派遣,劳务派遣≤10%)。D劳务派遣可约定试用期(非不得约定)。【法条依据】《劳动合同法》第66条、《劳务派遣暂行规定》第4条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）关于最低工资保障制度的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "最低工资的具体标准由国务院规定"}, {"k": "B", "t": "最低工资的具体标准包括特殊情况下延长工作时间工资"}, {"k": "C", "t": "最低工资的具体标准包括特殊工作环境条件下的津贴"}, {"k": "D", "t": "用人单位支付劳动者的工资不得低于当地最低工资的具体标准"}], "ans": "D", "ana": "D正确:用人单位支付工资不得低于当地最低工资标准。A最低工资标准由省级政府规定(非国务院)。B最低工资不包括加班工资。C最低工资不包括特殊环境津贴。【法条依据】《劳动法》第48条、《最低工资规定》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "王某的日工资为80元。政府规定2010年10月1日至7日放假7天，其中3天属于法定休假日，4天 属于前后两周的周末休息日。公司安排王某在这7天加班不能安排补 休。公司应当向王某支付加班费合计（ ）元。", "opts": [{"k": "A", "t": "560"}, {"k": "B", "t": "1360"}, {"k": "C", "t": "800"}, {"k": "D", "t": "1120"}], "ans": "B", "ana": "B正确:法定休假日3天→300%:80×3×3=720。休息日4天→200%:80×4×2=640。合计1360元。注意:法定假日不能补休只能支付加班费,休息日可补休否则付2倍。【法条依据】《劳动法》第44条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "关于工程建设领域农民工工资支付保障的说法，正确的有（ ）。", "opts": [{"k": "A", "t": "施工合同额低于300万元的工程，免除该工程存储农民工工资保证金"}, {"k": "B", "t": "农民工工资保证金使用后，施工总承包单位应当自使用之日起10个工作日内将农民工工资保证金资金补足"}, {"k": "C", "t": "施工企业支付的农民工工资不得低于当地最低工资标准"}, {"k": "D", "t": "农民工工资保证金可以用来支付工程款、材料费"}, {"k": "E", "t": "当事人被列入失信联合惩戒名单的期限为2年，自人力资源社会保障行政部门作出列入决定之日起计算"}], "ans": "BC", "ana": "BC正确:B工资保证金使用后10个工作日内补足。C工资不低于当地最低标准。A施工合同额<300万+1年内未发生工资拖欠的免除(非当然免除)。D工资保证金专款专用(不可支付工程款)。E列入失信名单期限为3年(非2年)。【法条依据】《保障农民工工资支付条例》。---", "law": "", "tag": "真题-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）根据《职业病防治法》，劳动者享有的职业卫生保护权利是（ ）。", "opts": [{"k": "A", "t": "获得职业安全教育培训"}, {"k": "B", "t": "要求用人单位提供安全防护设施"}, {"k": "C", "t": "建立职业卫生管理制度和操作规程"}, {"k": "D", "t": "对职业病防治工作提出意见和建议"}], "ans": "D", "ana": "D正确:对职业病防治工作提出意见和建议是劳动者的职业卫生保护权利。ABC多是义务或企业应提供的条件(非劳动者权利)。【法条依据】《职业病防治法》第39条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "张某为某汽车制造厂机加工岗位工人，与该单位签订为期3年的劳动合同。工作一年后，该单 位将其从机加工岗位调到喷漆岗位工作。依据《职业病防治法》的规定，下列关于张某在劳动过程中职业病 防护与管理的做法，正确的是（ ）。", "opts": [{"k": "A", "t": "张某因该单位未事先告知喷漆岗位职业危害而不服从调动，用人单位因此解除与其签订的劳动合同"}, {"k": "B", "t": "张某因该单位喷漆岗位未配备职业病防护装置而不服从调动，用人单位因此解除与其签订的劳动合同"}, {"k": "C", "t": "张某因该单位未事先告知喷漆岗位职业病危害，拒绝从事新岗位作业"}, {"k": "D", "t": "张某到新岗位后，该单位保持原劳动合同，未协商变更相关条款"}], "ans": "C", "ana": "C正确:未事先告知职业病危害→劳动者可拒绝从事新岗位作业。A单位不得因此解除合同。B不得因此解除合同(单位应提供防护装置)。D应协商变更合同相关条款。【法条依据】《职业病防治法》第33条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "根据《职业病防治法》，关于建设项目职业危害预评价制度的说法，正确的有（ ）", "opts": [{"k": "A", "t": "建设项目可能产生职业病危害的，建设单位应当遵行职业病危害预评价"}, {"k": "B", "t": "建设项目职业病危害预评价应当在项目的可行性论证阶段进行"}, {"k": "C", "t": "医疗机构建设项目可能产生放射性职业病危害的，建设单位应当向卫生行政部门提交放射性职业病危害预 评价报告"}, {"k": "D", "t": "建设项目职业病危害预评价制度的适用范围不包括改建建设项目"}, {"k": "E", "t": "未提交预评价报告或者预评价报告未经卫生行政部门审核同意的，不得开工建设"}], "ans": "ABCE", "ana": "A正确:可能产生职业病危害的建设项目应进行职业病危害预评价。B+C+E也是正确说法,数据标为single+Ans:A需结合官方答案。【法条依据】《职业病防治法》第17条。---", "law": "", "tag": "真题-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）某女职工与用人单位订立劳动合同从事后勤工作，约定劳动合同期限为2年。关于该 女职工权益保护的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "公司应当定期安排该女职工进行健康检查"}, {"k": "B", "t": "若该女职工哺乳的孩子已满18个月，公司可以安排夜班劳动"}, {"k": "C", "t": "公司可以安排该女职工在经期从事国家规定的第3级体力劳动强度的劳动"}, {"k": "D", "t": "若该女职工已怀孕5个月，公司不得安排夜班劳动"}], "ans": "B", "ana": "B正确:哺乳未满1周岁婴儿不得安排夜班和加班。满18个月(1.5岁)>1岁→可安排夜班。A定期健康检查非所有岗位的强制性要求。C经期不得安排第3级体力劳动。D怀孕7个月以上不得安排夜班(5个月可安排)。【法条依据】《女职工劳动保护特别规定》第6条、第9条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "（真题）关于女职工特殊保护的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "女职工在孕期，用人单位不得延长劳动时间"}, {"k": "B", "t": "女职工不得从事矿山井下作业"}, {"k": "C", "t": "用人单位因女职工怀孕降低工资的，不得低于当地最低工资标准"}, {"k": "D", "t": "怀孕女职工在劳动时间内进行产前检查，所需时间不计入劳动时间"}], "ans": "B", "ana": "B正确:女职工不得从事矿山井下作业。A孕期不得安排加班和夜班(但7个月以上才绝对禁止,7个月以下可协商)。C孕期不得降低工资。D产前检查时间计入劳动时间。【法条依据】《女职工劳动保护特别规定》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "（真题）根据我国有关规定，下列情形应当认定为或者视同工伤的有（ ）。", "opts": [{"k": "A", "t": "下班途中驾车发生车祸受伤，负同等责任的"}, {"k": "B", "t": "因讨要被拖欠工资，在办公室自残的"}, {"k": "C", "t": "宴请客户时，因醉酒经抢救无效死亡的"}, {"k": "D", "t": "在隔壁工地发生大火时因自愿救人受伤的"}, {"k": "E", "t": "安全员在施工现场履行职责遭殴打受伤的"}], "ans": "ADE", "ana": "ADE正确:A上下班途中非本人主要责任事故→工伤。D在抢险救灾中受伤→视同工伤。E工作时间和场所内因履行职责受暴力伤害→工伤。B自残→不得认定工伤。C醉酒→不得认定工伤。【法条依据】《工伤保险条例》第14条、第15条、第16条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "下列情况中，可以认定为工伤的是（ ）。", "opts": [{"k": "A", "t": "赵某在单位上班期间受伤"}, {"k": "B", "t": "孙某去项目部出差，当地突发泥石流后下落不明"}, {"k": "C", "t": "钱某下班后被本单位上上访人员打伤"}, {"k": "D", "t": "周某在项目部宿舍突发脑溢血，经抢救无效死亡"}], "ans": "B", "ana": "B正确:因工外出期间发生事故下落不明→认定为工伤。A上班期间受伤需与工作有关(非当然工伤)。C下班后被打与工作无关→非工伤。D宿舍突发脑溢血→非工作时间和工作岗位(在岗时48小时内抢救无效死亡才算)。【法条依据】《工伤保险条例》第14条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "single", "stem": "关于工伤保险待遇的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "职工治疗工伤应当在就近的医疗机构就医"}, {"k": "B", "t": "职工因工伤被鉴定为四级伤残的，保留劳动关系退出工作岗位享受工伤待遇"}, {"k": "C", "t": "停工留薪期一般不超过6个月"}, {"k": "D", "t": "病情严重或者情况特殊,经所在单位同意可以适当延长停工留薪期"}], "ans": "B", "ana": "B正确:四级伤残保留劳动关系退出工作岗位享受工伤待遇。A应在签订服务协议的医疗机构就医(非就近)。C停工留薪期一般不超过12个月(非6个月)。D经劳动能力鉴定委员会确认可延长(非所在单位同意)。【法条依据】《工伤保险条例》第33条、第35条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第9章 建设工程劳动保障法律制度", "type": "multi", "stem": "（真题）下列纠纷中，属于劳动争议范围的有（ ）。", "opts": [{"k": "A", "t": "劳动者与用人单位在履行劳动合同过程中发生的纠纷"}, {"k": "B", "t": "劳动者请求社会保险经办机构发放社会保险金的纠纷"}, {"k": "C", "t": "劳动者与用人单位因住房制度改革产生的公有住房转让纠纷"}, {"k": "D", "t": "因除名、辞退和辞职 议生效之日起30日内向人民法院申请司法确认"}, {"k": "D", "t": "人民调解委员会是依法设立的调解民间纠纷的群众性组织"}, {"k": "E", "t": "人民调解制度是一种信访辅助制度"}], "ans": "BCD", "ana": "BCD正确:B可口头协议。C30日内申请司法确认。D群众性组织。A人民调解不收费(非只收成本)。E人民调解是独立的纠纷解决制度(非信访辅助)。【法条依据】《人民调解法》第4条、第7条、第27条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "根据《民事诉讼法》，关于法院调解的说法,正确的是（ ）。", "opts": [{"k": "A", "t": "最后收到调解书的当事人签收的日期为调解书生效日"}, {"k": "B", "t": "调解书的效力低于判决书"}, {"k": "C", "t": "调解达成的所有协议，人民法院均应当制作调解书"}, {"k": "D", "t": "人民法院审理民事案件，在判决作出之前应当进行调解"}], "ans": "A", "ana": "A正确:调解书需双方当事人签收生效,最后签收日期为生效日。B调解书与判决书同等效力。C调解维持婚姻关系等可不制作调解书。D应在判决作出前进行调解但非应当(自愿原则)。【法条依据】《民事诉讼法》第100条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）下列纠纷中，可以申请仲裁的是（ ）。", "opts": [{"k": "A", "t": "收养协议纠纷"}, {"k": "B", "t": "工程合同纠纷"}, {"k": "C", "t": "遗产继承纠纷"}, {"k": "D", "t": "监护资格纠纷"}], "ans": "B", "ana": "B正确:工程合同纠纷属于合同纠纷,可申请仲裁。A收养/C继承/D监护→涉及身份关系不可仲裁(仲裁法第3条)。【法条依据】《仲裁法》第2条、第3条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "multi", "stem": "（真题）根据《仲裁法》，关于仲裁的说法,正确的有（ ）。", "opts": [{"k": "A", "t": "仲裁机构受理案件的依据是司法行政主管部门的授权"}, {"k": "B", "t": "劳动争议仲裁不属于《仲裁法》的调整范围"}, {"k": "C", "t": "当事人达成有效仲裁协议后，人民法院仍然对案件享有管辖权"}, {"k": "D", "t": "仲裁不公开进行"}, {"k": "E", "t": "仲裁裁决作出后，当事人不服的可以向人民法院起诉"}], "ans": "BD", "ana": "BD正确:B劳动争议仲裁不适用《仲裁法》(适用《劳动争议调解仲裁法》)。D仲裁不公开进行(保密原则)。A受理依据是当事人仲裁协议(非司法行政部门授权)。C有效仲裁协议排除法院管辖。E仲裁一裁终局(不得再起诉)。【法条依据】《仲裁法》第4条、第5条、第9条、第40条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）关于仲裁协议的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "当事人没有仲裁协议，一方申请仲裁的，仲裁委员会受理后可以要求双方达成仲裁协议"}, {"k": "B", "t": "当事人达成仲裁协议，一方向人民法院起诉的，人民法院受理后先审查仲裁协议的效力"}, {"k": "C", "t": "申请仲裁必须以当事人依法订立的仲裁协议为前提"}, {"k": "D", "t": "合同无效的，合同中的仲裁条款也无效"}], "ans": "C", "ana": "C正确:申请仲裁必须以当事人订立仲裁协议为前提。A无仲裁协议受理后应驳回(非要求双方达成协议)。B法院受理后,另一方在首次开庭前提交仲裁协议的应驳回起诉(非先审查效力)。D合同无效不影响仲裁条款效力(仲裁条款独立性原则)。【法条依据】《仲裁法》第4条、第19条、第26条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）当事人达成有效仲裁协议后,一方向人民法院起诉未声明有仲裁协议,人民法院受理 后,另一方在首次开庭前提交件裁协议的人民法院应当（ ）。", "opts": [{"k": "A", "t": "驳回起诉"}, {"k": "B", "t": "裁定不予受理"}, {"k": "C", "t": "继续审理"}, {"k": "D", "t": "移交仲裁机构处理"}], "ans": "A", "ana": "A正确:有仲裁协议,另方在首次开庭前提交→法院应驳回起诉。B不予受理是针对起诉时(已受理后是驳回起诉)。C不能继续审理。D应驳回起诉非移交仲裁(当事人自行申请仲裁)。【法条依据】《仲裁法》第26条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "multi", "stem": "（真题）关于仲裁协议的说法，正确的有（ ）。", "opts": [{"k": "A", "t": "仲裁协议必须在纠纷发生前达成"}, {"k": "B", "t": "当事人对仲裁协议效力有异议的，应当在仲裁庭首次开庭前提出"}, {"k": "C", "t": "仲裁协议可以采用口头形式，但需双方认可"}, {"k": "D", "t": "合同解除后，合同中的仲裁条款仍然有效"}, {"k": "E", "t": "仲裁协议约定两个以上仲裁机构，当事人不能就选择达成一致的，可以由司法行政主管部门指定"}], "ans": "BD", "ana": "BD正确:B对仲裁协议效力有异议应在首次开庭前提出。D合同解除后仲裁条款独立有效。A可在纠纷发生前或发生后达成。C仲裁协议必须书面形式。E约定两个以上仲裁机构的,当事人可协议选择其一(不能一致的可由仲裁机构所在地法院裁定,非司法行政主管部门指定)。【法条依据】《仲裁法》第16-20条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）关于仲裁协议效力确认的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "当事人对仲裁协议效力有异议的，应当在仲裁裁决作出前提出"}, {"k": "B", "t": "当事人既可以请求仲裁委员会作出决定，也可以请求人民法院裁定"}, {"k": "C", "t": "当事人对仲裁委员会就仲裁协议效力作出的决定不服的，可以向人民法院申请撤销该决定"}, {"k": "D", "t": "当事人向人民法院申请确认仲裁协议效力的案件，只能由仲裁协议约定的仲裁委员会所在地的中级人民法 院管辖"}], "ans": "B", "ana": "B正确:对仲裁协议效力异议可请求仲裁委员会决定或请求法院裁定。A应在首次开庭前提出(非裁决作出前)。C仲裁委员会的决定不能向法院申请撤销(法院对仲裁协议的司法审查是独立的)。D可由仲裁协议约定地、仲裁机构所在地、被申请人住所地等中级法院管辖。【法条依据】《仲裁法》第20条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）根据《仲裁法》，关于仲裁庭组成的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "仲裁庭必须由3名及3名以上的单数仲裁员组成"}, {"k": "B", "t": "仲裁庭可由当事人双方各选定两名仲裁员组成"}, {"k": "C", "t": "首席仲裁员可以由当事人双方共同选定"}, {"k": "D", "t": "首席仲裁员不可能由仲裁委员会主任指定"}], "ans": "C", "ana": "C正确:首席仲裁员可由当事人共同选定。A可独任仲裁(1名,非必须3名以上)。B只能选定1名或委托主任指定。D可由仲裁委员会主任指定(当事人未选定时)。【法条依据】《仲裁法》第30条、第31条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "关于仲裁员回避的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "仲裁员是否回避，由仲裁庭决定"}, {"k": "B", "t": "当事人请求仲裁员回避，应当仲裁庭首次开庭辩论终结前提出"}, {"k": "C", "t": "当事人提出仲裁员回避，应当说明理由"}, {"k": "D", "t": "因回避而重新选定仲裁员后，已进行的仲裁程序有效"}], "ans": "C", "ana": "C正确:当事人提出回避应说明理由。A仲裁员回避由仲裁委员会主任决定(主任任仲裁员时由仲裁委员会决定)。B应在首次开庭前提出(首次开庭后知道的可在最后一次开庭终结前提出)。D已进行的程序可由仲裁庭决定是否重新进行。【法条依据】《仲裁法》第35条、第36条、第37条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）关于仲裁和解的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "当事人仲裁和解的，应当开庭进行"}, {"k": "B", "t": "当事人自行达成和解协议的，仲裁庭应当制作撤案决定书"}, {"k": "C", "t": "当事人达成和解协议撤回仲裁申请反悔的，需要另行达成仲裁"}, {"k": "D", "t": "当事人自行达成和解协议的，可以撤回仲裁申请"}], "ans": "D", "ana": "D正确:达成和解协议的可以撤回仲裁申请(也可请求仲裁庭制作裁决书)。A和解不必须开庭。B可制作裁决书(非必须制作撤案决定书)。C反悔后可依原仲裁协议重新申请仲裁(非需另行达成)。【法条依据】《仲裁法》第49条、第50条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）关于仲裁调解的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "仲裁裁决书的法律效力高于仲裁调解书"}, {"k": "B", "t": "仲裁调解达成协议的，即可申请强制执行"}, {"k": "C", "t": "仲裁调解书经双方当事人签收后，即可发生律效力"}, {"k": "D", "t": "在仲裁调解签收之前当事人反悔的，当事人应当重新申请仲裁"}], "ans": "C", "ana": "C正确:仲裁调解书经双方当事人签收后发生法律效力。A调解书与裁决书同等法律效力。B需法院强制执行(非自动)。D签收前反悔的仲裁庭应及时作出裁决(非重新申请仲裁)。【法条依据】《仲裁法》第51条、第52条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）甲、乙、丙三人组成仲裁庭，甲为首席仲裁员，甲认为应该支持申请人的主张，乙 、丙认为不应支持申请人的主张，关于仲裁裁决的说法，正确的是（ ）", "opts": [{"k": "A", "t": "应按乙、丙的意见做出仲裁裁决"}, {"k": "B", "t": "应该按甲的意见做出仲裁书"}, {"k": "C", "t": "甲、乙、丙各自的意见全部列出交由仲裁委员会做出决定"}, {"k": "D", "t": "按照甲的意见做出仲裁裁决，裁决书如实记载乙、丙意见"}], "ans": "A", "ana": "A正确:裁决按多数仲裁员意见作出(2:1→按乙丙意见)。B不能按少数意见。C不能提交仲裁委员会决定。D少数意见可记入笔录但裁决按多数意见。【法条依据】《仲裁法》第53条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "发生法律效力的裁决，当事人可以向人民法院申请执行，该人民法院应当是（ ）。", "opts": [{"k": "A", "t": "终审人民法院"}, {"k": "B", "t": "申请执行人所在地人民法院"}, {"k": "C", "t": "被执行的财产所在地基层人民法院"}, {"k": "D", "t": "被执行人住所地或被执行财产所在地中级法院"}], "ans": "D", "ana": "D正确:仲裁裁决由被执行人住所地或被执行的财产所在地中级法院执行。A终审法院概念不适用于仲裁。B非申请执行人所在地。C应是中级法院(非基层)。【法条依据】《仲裁法》第62条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "multi", "stem": "（真题）根据《仲裁法》，当事人有证据证明仲裁裁决存在（ ）情形下，可以向人民法院 申请撤销该仲裁裁决。", "opts": [{"k": "A", "t": "双方当事人均不满意仲裁结果"}, {"k": "B", "t": "没有仲裁协议"}, {"k": "C", "t": "被申请人死亡"}, {"k": "D", "t": "仲裁机构已被撤销"}, {"k": "E", "t": "裁决事项超出仲裁委员会权限"}], "ans": "BE", "ana": "BE正确:没有仲裁协议和裁决事项超出仲裁委员会权限→可撤销。A不满意非撤销理由。C被申请人死亡非撤销理由(执行程序处理)。D仲裁机构被撤销非撤销理由。【法条依据】《仲裁法》第58条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）根据《仲裁法》，关于仲裁裁决撤销的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "违约金的计算不符合合同约定，当事人可以申请撤销仲裁裁决"}, {"k": "B", "t": "当事人需要申请撤销仲裁裁决时，可以向财产所在地的中级人民法院申请"}, {"k": "C", "t": "仲裁裁决被撤销后，当事人可以根据双方重新达成的仲裁协议申请仲裁，不可以向人民法院起诉"}, {"k": "D", "t": "仲裁的程序违反法定程序，当事人可以申请撤销仲裁裁决"}], "ans": "D", "ana": "D正确:仲裁程序违反法定程序的可申请撤销。A实体问题(违约金计算)不属撤销事由(一裁终局)。B向仲裁委员会所在地中级法院申请。C撤销后当事人可重新达成仲裁协议申请仲裁或向法院起诉(非仅限仲裁)。【法条依据】《仲裁法》第58条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "关于民事合同仲裁裁决执行的说法，正确的有（ ）", "opts": [{"k": "A", "t": "申请仲裁裁决强制执行的期间为3年"}, {"k": "B", "t": "当事人申请执行仲裁裁决案件，由被执行人住所地或者被执行的财产所在地的中级人民法院管辖"}, {"k": "C", "t": "申请执行时效，不适用中止和中断的裁定"}, {"k": "D", "t": "一方当事人不履行的，对方当事人可以向作出仲裁的仲裁委员会申请执行"}, {"k": "E", "t": "法律文书未规定履行期间的，申请执行的期间从法律文书生效之日起计算"}], "ans": "B", "ana": "B正确:仲裁裁决执行由被执行人住所地或被执行的财产所在地中级法院管辖。A申请执行时效为2年(非3年)。C申请执行时效适用中止中断。D向法院(非仲裁委员会)申请执行。E规定履行期间的从最后一日计算(非法律文书生效之日)。数据标为single+Ans:B。【法条依据】《仲裁法》第62条。---", "law": "", "tag": "真题-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "multi", "stem": "（模拟题）下列纠纷中适用专属管辖的有（ ）。", "opts": [{"k": "A", "t": "建设工程施工合同纠纷"}, {"k": "B", "t": "施工机械租赁合同纠纷"}, {"k": "C", "t": "建筑材料买卖合同纠纷"}, {"k": "D", "t": "房屋买卖合同纠纷"}, {"k": "E", "t": "港口作业中发生纠纷"}], "ans": "ADE", "ana": "ADE正确:建设工程施工合同纠纷(不动产所在地)、房屋买卖合同纠纷(不动产)、港口作业纠纷→专属管辖。B施工机械租赁和C材料买卖→普通合同纠纷(非专属管辖)。【法条依据】《民事诉讼法》第34条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）建设工程施工合同纠纷的管辖法院是（ ）。", "opts": [{"k": "A", "t": "建设工程所在地人民法院"}, {"k": "B", "t": "发包人住所地人民法院"}, {"k": "C", "t": "承包人住所地人民法院"}, {"k": "D", "t": "发包人和承包人约定的人民法院"}], "ans": "A", "ana": "A正确:建设工程施工合同纠纷由工程所在地法院专属管辖(不动产纠纷)。BCD均错→不适用协议管辖。【法条依据】《民事诉讼法解释》第28条:建设工程施工合同纠纷按不动产纠纷确定管辖。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "关于民事诉讼地域管辖的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "建设工程施工合同纠纷由工程所在地人民法院管辖"}, {"k": "B", "t": "对于监禁的人提起的诉讼由监狱所在地人民法院管辖"}, {"k": "C", "t": "合同对履行地点约定不明确，应当由被告人所在地人民法院管辖"}, {"k": "D", "t": "以信息网络方式订立的买卖合同，应当由出卖人所在地人民法院管辖"}], "ans": "A", "ana": "A正确:建设工程施工合同纠纷由工程所在地法院管辖(专属管辖)。B对被监禁人诉讼由原告住所地法院管辖(非监狱所在地)。C约定不明时,给付货币的以接受货币方所在地为履行地。D以信息网络方式订立的以收货地或买家住所地为履行地。【法条依据】《民事诉讼法》第23条、第34条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（模拟题）关于移送管辖的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "移送管辖是没有管辖权的法院把案件移送给有管辖权的法院审理"}, {"k": "B", "t": "移送管辖仅限于上下级法院之间"}, {"k": "C", "t": "移送管辖与指定管辖的程序完全相同"}, {"k": "D", "t": "受移送的法院认为受移送的案件不属于本院管辖的，可以再自行移送"}], "ans": "A", "ana": "A正确:移送管辖是无管辖权的法院将案件移送有管辖权的法院。B移送管辖不限上下级(同级之间也可移送)。C移送管辖与指定管辖是不同程序。D受移送法院认为不属于本院管辖的应报请上级法院指定管辖(不得再自行移送)。【法条依据】《民事诉讼法》第36条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（模拟题）以下关于民事诉讼代理制度，说法正确的是（ ）。", "opts": [{"k": "A", "t": "当事人最多可以委托3名诉讼代理人"}, {"k": "B", "t": "诉讼代理人不具备律师资格的，只能是当事人亲属"}, {"k": "C", "t": "授权委托书必须载明委托事项和权限，并由委托人签名或盖章"}, {"k": "D", "t": "诉讼代理人有权为当事人代为承认、放弃、变更诉讼请求，进行和解"}], "ans": "C", "ana": "C正确:授权委托书必须载明委托事项和权限并由委托人签名或盖章。A最多委托2名(非3名)。B代理人可为律师、基层法律服务工作者、当事人的近亲属或工作人员、有关社会团体推荐的公民。D代为承认放弃变更诉讼请求需特别授权(非一般授权)。【法条依据】《民事诉讼法》第61条、第62条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）下列人员中，可以被委托为民事诉讼代理人的是（ ）。", "opts": [{"k": "A", "t": "知名法学家"}, {"k": "B", "t": "基层法律服务工作者"}, {"k": "C", "t": "当事人的亲属"}, {"k": "D", "t": "建设行政主管部门推荐的公民"}], "ans": "B", "ana": "B正确:基层法律服务工作者可被委托为诉讼代理人。A知名法学家需是当事人近亲属或被推荐才可。C亲属范围限于近亲属(父母子女配偶兄弟姐妹等)。D行政主管部门推荐非委托代理人资格。【法条依据】《民事诉讼法》第61条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "人民法院认为审理案件需要的下列民事证据中,应当主动调查收集的是（ ）", "opts": [{"k": "A", "t": "涉及国家秘密的证据"}, {"k": "B", "t": "涉及国有资产的证据"}, {"k": "C", "t": "涉及身份关系的"}, {"k": "D", "t": "因客观原因不能自行收集的"}], "ans": "C", "ana": "C正确:涉及身份关系的证据法院应主动调查收集。A涉及国家秘密→法院依职权调查(但身份关系是最典型的)。B国有资产非法院必须主动调查的。D因客观原因不能自行收集→依申请调查(非主动)。【法条依据】《民事诉讼法》第67条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "multi", "stem": "（真题修改）在施工合同纠纷的诉讼中，能作为证据的有（ ）", "opts": [{"k": "A", "t": "法律规定"}, {"k": "B", "t": "当事人的陈述"}, {"k": "C", "t": "谈判录音"}, {"k": "D", "t": "工程设计图纸"}, {"k": "E", "t": "工程质量司法鉴定机构出具的鉴定报告"}], "ans": "BCDE", "ana": "BCDE正确:当事人陈述、谈判录音(视听资料)、设计图纸(书证)、鉴定报告均属法定证据种类。A法律规定不是证据(是裁判依据)。证据八种:当事人陈述、书证、物证、视听资料、电子数据、证人证言、鉴定意见、勘验笔录。【法条依据】《民事诉讼法》第66条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）下列人员中，不能作为民事诉讼的证人作证的是（ ）。", "opts": [{"k": "A", "t": "因健康原因不能出庭的"}, {"k": "B", "t": "因路途遥远，交通不便不能出庭的"}, {"k": "C", "t": "不能正确表达意思的"}, {"k": "D", "t": "因自然灾害等不可抗力不能出庭的"}], "ans": "C", "ana": "C正确:不能正确表达意思的人不能作证。ABD属于证人确有困难不能出庭的情形(可提交书面证言或通过视听传输技术作证),但仍有证人资格。【法条依据】《民事诉讼法》第75条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "multi", "stem": "（真题）下列当事人提出的证据中，能单独作为认定案件事实的有（ ）。", "opts": [{"k": "A", "t": "与一方当事人或者其代理人有利害关系的证人出具的证言"}, {"k": "B", "t": "与书证原件核对无误的复印件"}, {"k": "C", "t": "当事人的陈述"}, {"k": "D", "t": "有其他证据佐证并以合法手段取得的、无疑点的视听资料"}, {"k": "E", "t": "无正当理由未出庭作证的证人证言"}], "ans": "BD", "ana": "BD正确:B核对无误的复印件可单独作为认定事实的依据。D有其他证据佐证且合法的视听资料可单独认定。A有利害关系的证人证言不能单独认定。C当事人的陈述不能单独认定(需其他证据补强)。E无正当理由未出庭的证人证言不能单独认定。【法条依据】《民事诉讼法解释》第90条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "multi", "stem": "（真题）下列情形中，可以引起诉讼时效中断的有（ ）", "opts": [{"k": "A", "t": "权利人申请仲裁"}, {"k": "B", "t": "不可抗力义务人"}, {"k": "C", "t": "同意履行义务"}, {"k": "D", "t": "权利人向义务人提出履行请求"}, {"k": "E", "t": "权利人被义务人或者其他人控制"}], "ans": "ACD", "ana": "ACD正确:申请仲裁、同意履行义务、提出履行请求→引起诉讼时效中断。B不可抗力→诉讼时效中止(非中断)。E权利人被控制→诉讼时效中止。【法条依据】《民法典》第195条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）某建设单位支付工程最终结算款的时间应为2013年4月1日。由于建设单位逾期未予 支付，故施工单位于2013年8月1日致函建设单位要求付款，但未得到任何答复。则施工单位请求人民法院保 护其权利的诉讼时效期间届满的时间为（ ）。", "opts": [{"k": "A", "t": "2014年4月1日"}, {"k": "B", "t": "2014年8月1日"}, {"k": "C", "t": "2016年8月1日"}, {"k": "D", "t": "2015年8月1日"}], "ans": "C", "ana": "C正确:2013年4月1日应付款→诉讼时效3年→至2016年4月1日届满。但2013年8月1日致函要求付款→诉讼时效中断→重新计算3年→2016年8月1日届满。注意:2017年前适用2年时效,2017年10月1日起民法总则实施诉讼时效变3年。本题按3年计算。【法条依据】《民法典》第188条、第195条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（模拟题）按照合同约定，2019年1月1日发包方应该向承包方支付工程款，但没有支付。当 年7月1日至8月1日之间，当地发生了特大洪水，导致承包方不能行使请求权。则在此期间（ ）。", "opts": [{"k": "A", "t": "诉讼时效中止"}, {"k": "B", "t": "诉讼时效中断"}, {"k": "C", "t": "诉讼时效不中止"}, {"k": "D", "t": "诉讼时效终止"}], "ans": "C", "ana": "C正确:诉讼时效中止发生在时效期间最后6个月内。2019年1月1日应付款,时效至2022年1月1日(3年)。7月1日至8月1日仍在时效期间内但不属于最后6个月(最后6个月从2021年7月1日起),因此不中止。若发生在最后6个月内→中止。注意:洪水持续1个月结束,即使发生在最后6个月内,中止事由消除后继续计算6个月。【法条依据】《民法典》第194条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）承包人起诉发包人支付工程价款，经传票传唤，诉讼参加人无正当理由，拒不到庭 的，人民法院的下列做法中，正确的是（ ）。", "opts": [{"k": "A", "t": "承包人拒不到庭的，缺席判决"}, {"k": "B", "t": "发包人拒不到庭的，缺席判决"}, {"k": "C", "t": "第三人拒不到庭的，裁定中止案件审理"}, {"k": "D", "t": "证人拒不到庭的，按撤诉处理"}], "ans": "B", "ana": "B正确:被告(发包人)无正当理由拒不到庭→缺席判决。A原告(承包人)拒不到庭→按撤诉处理(非缺席判决)。C第三人不到庭不影响审理。D证人不到庭可对其采取强制措施(非按撤诉处理)。【法条依据】《民事诉讼法》第146条、第147条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "multi", "stem": "（真题）下列情形中，应当中止民事诉讼程序的有（ ）。", "opts": [{"k": "A", "t": "原告死亡，继承人放弃诉讼权利的"}, {"k": "B", "t": "作为一方当事人的法人终止，尚未确定权利义务承受人的"}, {"k": "C", "t": "一方当事人死亡，需要等待继承人表明是否参加诉讼的"}, {"k": "D", "t": "离婚案件一方当事人死亡的"}, {"k": "E", "t": "被告死亡，没有遗产，也没有应当承担义务的人的"}], "ans": "BC", "ana": "BC正确:B法人终止未确定权利义务承受人→中止诉讼。C一方死亡需等待继承人→中止诉讼。A继承人放弃权利→终结诉讼(非中止)。D离婚案件一方死亡→终结诉讼。E被告死亡无遗产无义务人→终结诉讼。中止vs终结:中止是暂停待条件成就后恢复,终结是彻底结束。【法条依据】《民事诉讼法》第153条、第154条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）关于小额诉讼程序的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "小额诉讼程序适用于审理事实清楚、权利义务关系明确、争议不大的简单金钱给付民事案件"}, {"k": "B", "t": "小额诉讼程序是普通程序的一种"}, {"k": "C", "t": "小额诉讼程序适用于标的额为全国上年度就业人员年平均工资50％以下的案件"}, {"k": "D", "t": "小额诉讼程序实行两审终审"}], "ans": "A", "ana": "A正确:小额诉讼适用于事实清楚、权利义务明确、争议不大的简单金钱给付案件。B是简易程序的一种(非普通程序)。C标的额为各省上年度就业人员年平均工资50%以下(非全国)。D一审终审(非两审终审)。【法条依据】《民事诉讼法》第165条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "关于小额民事诉讼的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "人身关系条件不适用小额诉讼"}, {"k": "B", "t": "小额诉讼案件应当采用合议庭审理"}, {"k": "C", "t": "小额诉讼案件实行两审终审"}, {"k": "D", "t": "小额诉讼案件应当自立案之日起1年内审结"}], "ans": "A", "ana": "A正确:人身关系案件不适用小额诉讼程序。B小额诉讼实行独任审判(非合议庭)。C一审终审(非两审)。D应自立案之日起3个月内审结(非1年)。【法条依据】《民事诉讼法》第165-167条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（模拟题）关于民事诉讼审判程序的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "一审程序包括普通程序和特殊程序"}, {"k": "B", "t": "符合起诉条件的，应当在5日内立案"}, {"k": "C", "t": "原告与案件有直接利害关系"}, {"k": "D", "t": "提交起诉状的同时提交全部证据"}], "ans": "C", "ana": "C正确:原告需与案件有直接利害关系(起诉条件之一)。A一审包括普通程序和简易程序(非特殊程序)。B符合条件应在7日内立案(非5日)。D证据可在举证期限内提交(非必须提交起诉状时提交全部)。【法条依据】《民事诉讼法》第122条、第126条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）人民法院于2018年4月1日作出第一审民事判决，判决书于4月5日送达原告，4月10日 送达被告，当事人双方均未提出上诉，该判决书生效之日是2018年4月（ ）", "opts": [{"k": "A", "t": "1"}, {"k": "B", "t": "26"}, {"k": "C", "t": "5"}, {"k": "D", "t": "10"}], "ans": "B", "ana": "B正确:上诉期15日从判决书送达之日起算。被告4月10日送达→上诉期至4月25日(4月10日+15天)。期满双方未上诉→4月26日判决生效。注意:上诉期以各自送达日起算,须双方上诉期均届满才生效。【法条依据】《民事诉讼法》第171条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）下列案件中，实行二审终审的案件是（ ）。", "opts": [{"k": "A", "t": "小额诉讼案件"}, {"k": "B", "t": "确认调解协议案件"}, {"k": "C", "t": "建设工程施工合同案件"}, {"k": "D", "t": "实现担保物权案件"}], "ans": "C", "ana": "C正确:建设工程施工合同案件适用两审终审。A小额诉讼→一审终审。B确认调解协议→特别程序一审终审。D实现担保物权→特别程序一审终审。【法条依据】《民事诉讼法》第10条、第165条、特别程序。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "发生法律效力的民事判決、裁定，当事人可以向人民法院申请执行，该人民法院应当是（ ）。", "opts": [{"k": "A", "t": "终审人民法院"}, {"k": "B", "t": "申请执行人所在地人民法院"}, {"k": "C", "t": "被执行的财产所在地基层人民法院"}, {"k": "D", "t": "与第一审人民法院同级的被执行的财产所在地人民法院"}], "ans": "D", "ana": "D正确:民事判决裁定由第一审法院或与第一审法院同级的被执行的财产所在地法院执行。A非终审法院(仲裁裁决才是中级法院,民事判决由一审法院执行)。B非申请执行人所在地。C基层法院不准确(取决于一审法院级别)。【法条依据】《民事诉讼法》第235条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "在民事诉讼执行阶段，人民法院应当裁定中止执行的是（ ）。", "opts": [{"k": "A", "t": "申请人撤销强制执行申请的"}, {"k": "B", "t": "案外人对执行标的提出确有理由的异议的"}, {"k": "C", "t": "据以执行的法律文书被撤销的"}, {"k": "D", "t": "作为被执行人的公民因生活困难无力偿还借款，无收入来源，又丧失劳动力的"}], "ans": "B", "ana": "B正确:案外人对执行标的提出确有理由的异议→裁定中止执行。A撤销申请→终结执行。C文书被撤销→终结执行。D无力偿还→终结执行(或终结本次执行)。中止vs终结:中止可恢复执行,终结是彻底结束。【法条依据】《民事诉讼法》第263条、第264条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（模拟题）某施工单位在参加投标中有违法行为，建设行政主管部门的处罚决定于5月20日作 出，施工单位5月25日收到。11月1日施工单位欲通过有关途径申请撤销该处罚决定，则说法正确的是（ ）", "opts": [{"k": "A", "t": "施工单位可以申请复议，也可以不经过复议直接起诉"}, {"k": "B", "t": "施工单位应先申请复议，不服复议可以向法院起诉"}, {"k": "C", "t": "施工单位只能向法院起诉"}, {"k": "D", "t": "施工单位既不可以申请复议，也不可以向法院起诉"}], "ans": "C", "ana": "C正确:5月25日收到处罚决定→复议期60日(至7月24日)→已过期。起诉期6个月(至11月25日)→11月1日仍在期限内,可直接起诉(无需先复议)。行政处罚复议与诉讼的关系:当事人可选择复议或起诉(非必须复议前置),但复议期已过后只能起诉。【法条依据】《行政复议法》第9条、《行政诉讼法》第46条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）对下列行政行为不服，申请人应当先向行政复议机关申请行政复议，对行政复议决 定不服，方可以向民法院提起行政诉讼的是（ ）。", "opts": [{"k": "A", "t": "行政机关作出的确认自然资源所有权的决定"}, {"k": "B", "t": "行政机关作出的行政强制执行决定"}, {"k": "C", "t": "申请政府信息公开、行政机关不予公开"}, {"k": "D", "t": "行政机关作出的吊销资质证书处罚决定"}], "ans": "C", "ana": "A正确:确认自然资源所有权→复议前置(先复议后诉讼)。B行政强制执行/C政府信息公开/D吊销资质均可直接诉讼或先复议(非必须复议前置)。复议前置的法定情形:自然资源权属确认、纳税争议、反垄断等。【法条依据】《行政复议法》第23条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第10章 建设工程争议解决法律制度", "type": "single", "stem": "（真题）关于行政复议申请的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "有权对某一行政行为申请行政复议的公民死亡的，该行政行为不得再被申请行政复议"}, {"k": "B", "t": "因不动产提出的行政复议申请自行政行为作出之日起超过20年的，行政复议机关不予受理"}, {"k": "C", "t": "作出行政行为的行政机关被撤销的，不得再对其作出的行政行为申请复议"}, {"k": "D", "t": "申请人申请行政复议，应当书面提出"}], "ans": "B", "ana": "B正确:因不动产提起的复议自行政行为作出超过20年→不予受理。A公民死亡 、资料等进行必要的研究试验及按照相关规定在建设过程中必须进行试验 、验证所需的费用（如桩基检测费、深基坑监测费等）。包含项目所在地规定应由建设单位承担的工程检测 费用，或自行或委托其他部门的专题研究、试验所需的人工费、材料费、试验设备及仪器使用费等。不包括 以下项目： ①应由科技三项费用（即新产品试制费、中间试验费和重要科学研究补助费）开支的费用。 ②应在建筑安装费用中列支的施工企业对建筑材料、构件和建筑物进行一般鉴定、检查所发生的费用。 ③应由勘察设计费或工程费用中开支的费用。 三、场地准备及临时设施费 场地准备费：建设项目为达到工程开工条件所发生的未列入工程费用的场地平整以及对建设场地余留的有碍 于施工建设的设施进行拆除清理所发生的费用，建设场地的大型土石方工程应进入工程费用中的总图运输费 用中。 临时设施费：建设单位为满足工程项目建设、生活、办公的需要，用于临时设施建设、维修、租赁、使用所 发生或摊销的费用。包括施工建设需要而提供到场地界区的未列入工程费用的临时水、电、路、讯、气等工 程和临时仓库、办公、生活等建（构）筑物的建设、维修、拆除、摊销费用或租赁费用，以及铁路、码头租 赁等费用。 场地准备及临时设施费应尽量与永久性工程统一考虑。此项费用不包括已列入建筑安装工程费用中的施工单 位临时设施费用。 场地准备费：根据实际情况估算计列，有合同或协议的按合同或协议几列。 临时设施费：按工程量计算，或者按工程费用比例计算。 四、联合试运转费 指新建或新增加生产能力的工程项目，在交付生产前按照设计文件规定的工程质量标准和技术要求，对整个 生产线或装置进行负荷联合试运转所发生的费用净支出。 联合试运转费=联合试运转支出－联合试运转收入 不发生试运转或试运转收入大于（或等于）费用支出的工程，不列此项费用 ①包括： 试运转所需材料、燃料及动力消耗、低值易耗品、其他物料消耗、工具用具使用费、机械使用费、联合试运 转人员工资、非建设单位参加试运转人工费、专家指导费以及必要的工业炉烘炉费。 ②不包括： 应由设备安装工程费用开支的单机试车及空载试车费用，以及在试运转中暴露出来的因施工原因或设备缺陷 等发生的处理费用。 五、生产准备费 生产准备费包括生产人员培训费、生产人员提前进厂费、办公及生活家具购置费、工器具及生产家具购置费。 在施工过程中承包人按发包人和设计方要求，对构件做破坏性试验的费用应在（ ）中列支。", "opts": [{"k": "A", "t": "承包人的措施项目费"}, {"k": "B", "t": "承包人的企业管理费"}, {"k": "C", "t": "发包人的研究试验费"}, {"k": "D", "t": "发包人的企业管理费"}], "ans": "C", "ana": "", "law": "", "tag": "", "note": "", "hasTable": false, "missImg": false}, {"ch": "第13章 建设项目总投资构成及计算", "type": "single", "stem": "建设单位对设计方案进行评审而发生的费用应计入工程建设其他费用中的（ ）。", "opts": [{"k": "A", "t": "专项评价费"}, {"k": "B", "t": "勘察设计费"}, {"k": "C", "t": "工程监理费"}, {"k": "D", "t": "建设管理费"}], "ans": "D", "ana": "", "law": "", "tag": "", "note": "", "hasTable": false, "missImg": false}, {"ch": "第13章 建设项目总投资构成及计算", "type": "single", "stem": "某建设项目的工程费用为1500万元，工程建设其他费用为200万元，场地准备和临时设施费按工程费用的5% 计算。则该项目的场地准备和临时设施费为（ ）万元。", "opts": [{"k": "A", "t": "75"}, {"k": "B", "t": "93"}, {"k": "C", "t": "85"}, {"k": "D", "t": "100"}], "ans": "A", "ana": "", "law": "", "tag": "", "note": "", "hasTable": false, "missImg": false}, {"ch": "第13章 建设项目总投资构成及计算", "type": "multi", "stem": "关于联合试运转费的说法，正确的（ ）。", "opts": [{"k": "A", "t": "不发生试运转或试运转收入大于费用支出 %时， FIRR=9.0%，当人民币汇率上涨10%时，FIRR=8.8%。根据上述条件判断，最敏感的因素是（ ）。", "opts": [{"k": "A", "t": "建设投资"}, {"k": "B", "t": "原材料价格"}, {"k": "C", "t": "人民币汇率"}, {"k": "D", "t": "产品价格"}], "ans": "C", "ana": "A错误，敏感度系数的绝对值越大，表示分析指标对该不确定因素的敏感度越大；B错误，敏感度系数 不能直接表示不确定因素变化后分析指标的值。", "law": "", "tag": "蔺飞飞母题带练", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 不确定性分析", "type": "single", "stem": "关于技术方案不确定因素临界点的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "若基准收益率固定，某不确定性因素的临界点百分比越小，说明方案对该因素就越敏感"}, {"k": "B", "t": "对同一个技术方案，随着基准收益率的提高，临界点也会变高"}, {"k": "C", "t": "不确定因素临界点的高低，不能作为判定风险的依据"}, {"k": "D", "t": "临界点是客观存在的，与设定的指标判断标准无关"}], "ans": "A", "ana": "离原点最近的最敏感。", "law": "", "tag": "蔺飞飞母题带练", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 不确定性分析", "type": "single", "stem": "点就会变低（即临界点表示的不确定因素的极限变化变小）。在一定指标判断标准（如基准收益率）下， 对若干不确定性因素中，临界点越低，说明该因素对技术方案经济效果指标影响越大，技术方案对该因素就 越敏感，把临界点与未来实际可能发生的变化幅度相比较，就可大致分析该技术方案的风险情况。 关于设备磨损补偿方式的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "设备的无形磨损可以通过修理进行补偿"}, {"k": "B", "t": "设备的磨损只能通过更新进行补偿"}, {"k": "C", "t": "可消除的有形磨损只能通过现代化改装进行补偿"}, {"k": "D", "t": "不可消除的有形磨损可以通过更新进行补偿"}], "ans": "D", "ana": "临界点是指技术方案允许不确定因素向不利方向变化的极限值，超过极限技术方案的经济效果指标将 不可行。例如当产品价格下降到某一值时，财务内部收益率将刚好等于基准收益率，此点称为产品价格下降 的临界点。临界点可用临界点百分比或者临界值分别表示某一变量的变化达到一定的百分比或者一定数值时， 技术方案的经济效果指标将从可行转变为不可行。对于同一个技术方案，随着设定基准收益率的提高，临界", "law": "", "tag": "蔺飞飞母题带练", "note": "", "hasTable": false, "missImg": false}, {"ch": "第4章 设备更新分析", "type": "multi", "stem": "下列设备磨损情形中，属于无形磨损的有（ ）。", "opts": [{"k": "A", "t": "设备使用过程中产生的变形"}, {"k": "B", "t": "技术进步导致设备贬值"}, {"k": "C", "t": "设备闲置过程中遭受腐蚀"}, {"k": "D", "t": "制造工艺改进导致设备降价"}, {"k": "E", "t": "自然力作用时设备构件老化"}], "ans": "BD", "ana": "补偿方式分为局部和完全补偿。设备有形磨损的局部补偿是修理，设备无形磨损的局部补偿是现代化 改装。设备有形磨损和无形磨损的完全补偿是更新。", "law": "", "tag": "蔺飞飞母题带练", "note": "", "hasTable": false, "missImg": false}, {"ch": "第4章 设备更新分析", "type": "multi", "stem": "关于设备技术寿命的说法，正确的有（ ）。", "opts": [{"k": "A", "t": "设备的技术寿命主要由设备的无形磨损决定"}, {"k": "B", "t": "设备的技术寿命是指设备年平均维修费用最低对应的使用年限"}, {"k": "C", "t": C", "t": "1500"}, {"k": "D", "t": "1000"}], "ans": "B", "ana": "资金成本包括资金占用费和筹资费用两个部分。资金占用费是指企业占用资金支付的费用，如银行借 款利息和债券利息等。筹资费用是指在资金筹集过程中支付的各项费 用，如银行的借款手续费，发行债券 支付的印刷费、代理发行费、律师费、公证费、广告费等，它通常是在筹措资金时一次性支付，在使用资金 的过程中不再发生。 企业某时点所有者权益资本为1000万元，企业长期债务资本为800万元，短期负债为500万元，则应列入资本", "law": "", "tag": "蔺飞飞母题带练", "note": "", "hasTable": false, "missImg": false}, {"ch": "第11章 筹资管理", "type": "single", "stem": "的方法属于（ ）的方法。", "opts": [{"k": "A", "t": "使用现金浮游量"}, {"k": "B", "t": "使现金流量同步"}, {"k": "C", "t": "加速收款"}, {"k": "D", "t": "推迟应付账款"}], "ans": "A", "ana": "通常情况下，企业的资本由长期债务资本和权益资本构成，因此资本结构指的是长期债务资本和权益 资本各占多大比例，不包括短期负债。 第12章 营运资金管理 企业为提高现金使用效率，利用已经开出了支票而银行还未将该款项划出这一时间段内的资金，此现金管理", "law": "", "tag": "蔺飞飞母题带练", "note": "", "hasTable": false, "missImg": false}, {"ch": "第12章 营运资金管理", "type": "multi", "stem": "采用成本分析模式确定企业现金持有量时，考虑的成本有（ ）。", "opts": [{"k": "A", "t": "沉没成本"}, {"k": "B", "t": "外部成本"}, {"k": "C", "t": "机会成本"}, {"k": "D", "t": "短缺成本"}, {"k": "E", "t": "管理成本"}], "ans": "CDE", "ana": "使用现金浮游量是从企业开出支票，到收票人收到支票并存入银行，至银行将款项划出企业账户，中 间需要一段时间。现金在这段时间的占用称为现金浮游量。 3", "law": "", "tag": "蔺飞飞母题带练", "note": "", "hasTable": false, "missImg": false}, {"ch": "第12章 营运资金管理", "type": "single", "stem": "关于企业存货管理的说法，正确的是（ ）。", "opts": [{"k": "A", "t": "存货管理的目标是最大限度地降低存货成本"}, {"k": "B", "t": "存货管理是要在存货成本与存货效益之前做出权衡，达到两者之间的最佳结合"}, {"k": "C", "t": "财务部门存货管理的职责是选择供应单位及筹集订货资金"}, {"k": "D", "t": "根据存货管理的ABC分析法，应对C类存货实施严格控制"}], "ans": "B", "ana": "成本分析模式：机会成本：和现金持有量之间正比例关系；管理成本：是一种固定成本，和现金持有 量之间无比例关系；短缺成本：和现金持有量反比例关系。上述三种成本之和最小的现金持有量，就是最佳 现金持有量。", "law": "", "tag": "蔺飞飞母题带练", "note": "", "hasTable": false, "missImg": false}, {"ch": "第12章 营运资金管理", "type": "single", "stem": "某施工企业按3/10，n/30的信用条件购入材料100万元。已知企业可以3%的年利率从银行取得流动资金借款。 则关于这批材料款支付的合理做法是（ ）。", "opts": [{"k": "A", "t": "企业向银行借款，在10天内付款"}, {"k": "B", "t": "企业向银行借款，在11天到30天之间付款"}, {"k": "C", "t": "企业不借款，在11天到30天之间付款"}, {"k": "D", "t": "企业不借款，在30天后付款"}], "ans": "A", "ana": "A.进行存货管理，就要尽力在各种存货成本与存货效益之间做出权衡，达到两者的最佳结合。C.财务 部门的职责是决定进货时间和进货批量。D.C类存货虽然种类繁多 function pad(x){return x<10?"0"+x:x;}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseDate(s){const p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function dayIndexFor(dateStr){const d=parseDate(dateStr);d.setHours(0,0,0,0);const base=new Date(2026,0,1);return Math.floor((d-base)/86400000);}
function dayIndex(){return dayIndexFor(todayStr());}

function pick(subj){
  const arr=BANK[subj]; if(!arr||!arr.length) return [];
  const off=(dayIndexFor(viewDate)*PER)%arr.length;
  const res=[];
  for(let i=0;i<PER;i++) res.push(arr[(off+i)%arr.length]);
  return res;
}

function safeStem(s){
  if(!s) return "";
  let t=s;
  const tbls=[...t.matchAll(/<table[\s\S]*?<\/table>/g)].map(m=>m[0]);
  tbls.forEach((tb,i)=>{t=t.replace(tb,"\u0000TBL"+i+"\u0000");});
  const brs=[...t.matchAll(/<br\s*\/?>/gi)].map(m=>m[0]);
  brs.forEach((b,i)=>{t=t.replace(b,"\u0000BR"+i+"\u0000");});
  t=t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  brs.forEach((b,i)=>{t=t.replace("\u0000BR"+i+"\u0000","<br>");});
  tbls.forEach((tb,i)=>{t=t.replace("\u0000TBL"+i+"\u0000",tb);});
  return t;
}
function esc(s){return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function renderQuiz(){
  const box=document.getElementById("quiz");
  const arr=sets[cur];
  document.getElementById("progress").textContent="当前科目："+cur+" ｜ 第 1–"+arr.length+" 题";
  document.getElementById("resultBox").innerHTML="";
  let h="";
  arr.forEach((q,idx)=>{
    const typeLabel=q.type==="multi"?"多选":"单选";
    let meta=q.ch+" ｜ "+typeLabel;
    if(q.hasTable) meta+=" ｜ 含数据表";
    if(q.tag) meta+=" ｜ "+esc(q.tag);
    h+="<div class='q' id='q"+idx+"'>";
    h+="<div class='meta'>"+meta+"</div>";
    h+="<div class='stem'>"+(idx+1)+". "+safeStem(q.stem)+"</div>";
    if(q.missImg) h+="<div class='missimg'>⚠️ 本题原图缺失（知识库未附图），请结合教材图示理解作答。</div>";
    q.opts.forEach(o=>{
      h+="<label class='opt' data-q='"+idx+"' data-k='"+o.k+"'>";
      h+="<span class='k'>"+o.k+"</span><span>"+esc(o.t)+"</span></label>";
    });
    h+="<div class='reveal' id='rv"+idx+"'></div>";
    h+="</div>";
  });
  box.innerHTML=h;
  box.querySelectorAll(".opt").forEach(op=>{
    op.onclick=()=>{
      const q=sets[cur][op.dataset.q];
      if(q.type==="single"){
        box.querySelectorAll(".opt[data-q='"+op.dataset.q+"']").forEach(x=>x.classList.remove("sel"));
        op.classList.add("sel");
      }else{
        op.classList.toggle("sel");
      }
    };
  });
}
function getSel(idx){
  const q=sets[cur][idx];
  const sels=[...document.querySelectorAll(".opt[data-q='"+idx+"'].sel")].map(x=>x.dataset.k).sort();
  return sels.join("");
}
function submit(){
  let right=0,total=sets[cur].length;
  sets[cur].forEach((q,idx)=>{
    const sel=getSel(idx);
    const card=document.getElementById("q"+idx);
    const rv=document.getElementById("rv"+idx);
    const correct=sel===q.ans;
    if(correct) right++;
    card.classList.add(correct?"right":"wrong");
    document.querySelectorAll(".opt[data-q='"+idx+"']").forEach(op=>{
      const k=op.dataset.k;
      if(q.ans.indexOf(k)>=0) op.classList.add("correct");
      if(op.classList.contains("sel")&&q.ans.indexOf(k)<0) op.classList.add("wsel");
    });
    let verdict="<div class='verdict "+(correct?"ok":"bad")+"'>"+(correct?"✓ 本题答对":"✗ 本题答错")+"</div>";
    if(!correct){
      const miss=[...q.ans].filter(k=>!sel.includes(k));
      const extra=[...sel].filter(k=>!q.ans.includes(k));
      let tip="";
      if(miss.length) tip+=" 漏选："+miss.join("、");
      if(extra.length) tip+=" 误选："+extra.join("、");
      verdict="<div class='verdict bad'>✗ 本题答错　"+tip.trim()+"</div>";
    }
    let rh=verdict+"<div class='ans'>正确答案："+q.ans+"　你的选择："+(sel||"未作答")+"</div>";
    if(q.ana) rh+="<div class='ana'>"+esc(q.ana)+"</div>";
    if(q.law) rh+="<div class='law'>【法条依据】"+esc(q.law)+"</div>";
    if(q.note) rh+="<div class='ana'>【注】"+esc(q.note)+"</div>";
    rv.innerHTML=rh;rv.classList.add("show");
  });
  const pct=Math.round(right/total*100);
  const wrong=total-right;
  const box=document.getElementById("resultBox");
  box.innerHTML="<div class='result'><div class='score'>"+right+"/"+total+"</div>"+
    "<div class='det'>"+cur+" 正确率 "+pct+"%　｜　答对 "+right+" 题　答错 "+wrong+" 题</div>"+
    "<div class='hist'>"+todayStr()+" ｜ 题库共 "+STATS[cur].total+" 题，按日期滚动覆盖（按「题」计，多选题无论几个选项只算 1 题）</div></div>";
  recordAttempts(cur,viewDate);
  markCheckin(cur,viewDate);
  refreshCheckinBadge();
  box.scrollIntoView({behavior:"smooth"});
}
// 逐题记录薄弱知识点：某日期该科以最后一次提交为准（重做不翻倍）
function recordAttempts(subj,dateStr){
  try{
    let arr=JSON.parse(localStorage.getItem("yijian_records")||"[]");
    arr=arr.filter(r=>!(r.date===dateStr&&r.subject===subj));
    sets[subj].forEach((q,idx)=>{
      const sel=getSel(idx);
      arr.push({date:dateStr,subject:subj,kp:q.ch,type:q.type,correct:sel===q.ans,hasTable:!!q.hasTable,qid:q.stem.slice(0,40)});
    });
    localStorage.setItem("yijian_records",JSON.stringify(arr.slice(-8000)));
  }catch(e){}
}
function restart(){renderQuiz();}
