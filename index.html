<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一建每日刷题</title>
<style>
:root{
  --blue:#1A1A2E; --orange:#D35400; --accent:#2F5496;
  --ok:#2e7d32; --bad:#c62828; --bg:#f5f6fa; --card:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:#222;line-height:1.6;padding:16px}
.wrap{max-width:880px;margin:0 auto}
header{background:linear-gradient(135deg,var(--blue),var(--accent));color:#fff;border-radius:14px;padding:20px 24px;margin-bottom:12px}
header h1{font-size:22px;letter-spacing:2px}
header .sub{opacity:.85;font-size:13px;margin-top:4px}
.topnav{display:flex;gap:8px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{flex:1;min-width:120px;background:var(--card);border:2px solid #e3e6ef;border-radius:12px;padding:12px;text-align:center;cursor:pointer;font-weight:600;transition:.15s;user-select:none}
.tab:hover{border-color:var(--accent)}
.tab.active{border-color:var(--orange);background:#fff7f0;color:var(--orange)}
.tab .cnt{font-size:12px;font-weight:400;color:#888;display:block;margin-top:2px}
.bar{display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.btn{background:var(--orange);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#eef1f7;color:var(--accent)}
.q{background:var(--card);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05);border-left:4px solid var(--accent)}
.q.wrong{border-left-color:var(--bad)}
.verdict{display:inline-block;font-weight:700;padding:3px 10px;border-radius:6px;margin-bottom:6px;font-size:14px}
.verdict.ok{background:#e8f5e9;color:#1b7a35;border:1px solid #a5d6a7}
.verdict.bad{background:#fdecea;color:#c62828;border:1px solid #ef9a9a}
.q.right{border-left-color:var(--ok)}
.q .meta{font-size:12px;color:#999;margin-bottom:6px}
.q .stem{font-weight:600;margin-bottom:10px}
.opt{display:flex;gap:10px;padding:8px 10px;border:1px solid #e6e9f0;border-radius:8px;margin-bottom:7px;cursor:pointer;transition:.12s;align-items:flex-start}
.opt:hover{background:#f7f9fc}
.opt.sel{background:#eaf1fb;border-color:var(--accent)}
.opt.correct{background:#e8f5e9;border-color:var(--ok);font-weight:600}
.opt.wsel{background:#fdecea;border-color:var(--bad)}
.opt .k{font-weight:700;color:var(--accent);min-width:18px}
.opt input{display:none}
.reveal{margin-top:10px;padding:10px 12px;background:#fffaf2;border-radius:8px;font-size:13.5px;display:none}
.reveal.show{display:block}
.reveal .ans{color:var(--ok);font-weight:700;margin-bottom:4px}
.reveal .ana{color:#444}
.reveal .law{color:#1a5276;margin-top:4px;font-size:12.5px}
.result{background:var(--card);border-radius:12px;padding:22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.result .score{font-size:40px;font-weight:800;color:var(--orange)}
.result .det{margin:10px 0;font-size:15px}
.hist{font-size:12px;color:#888;margin-top:8px}
.note{font-size:12px;color:#888;margin:8px 2px 14px}
.missimg{font-size:12px;color:#b9770e;background:#fef5e7;border:1px dashed #f0b86e;padding:7px 10px;border-radius:8px;margin:8px 0}
/* 题干内嵌数据表 */
table.data-table{border-collapse:collapse;margin:10px 0;font-size:13px;width:100%}
table.data-table th,table.data-table td{border:1px solid #d5dae5;padding:5px 8px;text-align:center}
table.data-table th{background:#eef1f7;font-weight:600}
/* 统计面板 */
.stats{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stats h2{font-size:17px;color:var(--accent);margin:14px 0 10px}
.stats h2:first-child{margin-top:0}
.stats .ov{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.stats .ov div{background:#f3f6fc;border-radius:10px;padding:10px 16px;text-align:center;min-width:92px}
.stats .ov b{display:block;font-size:22px;color:var(--orange)}
.stats .note{font-size:12.5px;color:#7a8290;background:#f7f9fc;border-left:3px solid var(--blue);padding:8px 12px;border-radius:6px;margin-bottom:14px;line-height:1.6}
.search{width:100%;padding:9px 12px;border:1px solid #d5dae5;border-radius:9px;margin-bottom:12px;font-size:14px}
.wk{width:100%;border-collapse:collapse;font-size:13.5px}
.wk th,.wk td{border:1px solid #e6e9f0;padding:8px 10px;text-align:left;vertical-align:middle}
.wk th{background:#eef1f7;cursor:pointer;user-select:none}
.wk tr:nth-child(even){background:#fafbfe}
.barbg{background:#eee;border-radius:6px;height:14px;overflow:hidden;min-width:90px;display:inline-block;vertical-align:middle}
.barfill{height:100%;background:linear-gradient(90deg,#e74c3c,#f39c12)}
.trend{font-size:13px}
.trend .row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.trend .d{width:92px;color:#666}
.trend .tb{flex:1;background:#eee;border-radius:6px;height:14px;overflow:hidden}
.trend .tf{height:100%;background:linear-gradient(90deg,#2e7d32,#7cb342)}
.trend .v{width:64px;text-align:right;color:#555}
.hidden{display:none!important}
/* 打卡日历 */
.cal{margin-top:4px}
.cal-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head>div{text-align:center;font-size:12px;color:#888;padding:6px 0;font-weight:600}
.cal-cell{border:1px solid #e6e9f0;border-radius:10px;min-height:62px;padding:6px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;justify-content:space-between}
.cal-cell.empty{border:none;background:transparent;cursor:default}
.cal-cell:hover:not(.empty):not(.fut){border-color:var(--accent)}
.cal-cell.today{border-color:var(--orange);box-shadow:0 0 0 2px #ffe3cc inset}
.cal-cell.done{background:#e8f5e9;border-color:#a5d6a7}
.cal-cell.partial{background:#fff8e1;border-color:#ffe082}
.cal-cell.miss{background:#fdecea;border-color:#ef9a9a}
.cal-cell.fut{background:#f3f3f3;color:#bbb;cursor:not-allowed}
.cal-cell .cd{font-weight:700;font-size:15px}
.cal-cell .cd small{font-size:10px;color:var(--orange);font-weight:400}
.cal-cell .dots{display:flex;gap:4px;margin-top:4px}
.cal-cell .dot{width:9px;height:9px;border-radius:50%;background:#e0e0e0;display:inline-block}
.cal-cell .dot.on{background:var(--ok)}
.cal-cell .cn{font-size:11px;color:#888;align-self:flex-end}
.modebar{font-size:14px}
.modebar b{color:var(--orange)}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>一 建 每 日 刷 题</h1>
  <div class="sub" id="subdate"></div>
</header>
<div class="topnav">
  <button class="btn sec" id="toStats">📊 薄弱知识点统计</button>
  <button class="btn sec" id="toCheckin">📅 打卡日历</button>
  <button class="btn sec hidden" id="toQuiz">← 返回刷题</button>
  <button class="btn sec hidden" id="toToday">🔙 返回今日</button>
</div>
<div id="quizView">
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <div id="progress"></div>
    <div>
      <button class="btn sec" id="restart">重做本科</button>
      <button class="btn" id="submit">提交并判分</button>
    </div>
  </div>
  <div class="note" id="note"></div>
  <div id="quiz"></div>
  <div id="resultBox"></div>
</div>
<div id="statsView" class="hidden">
  <div class="stats" id="statsPanel"></div>
</div>
<div id="checkinView" class="hidden">
  <div class="stats" id="checkinPanel"></div>
</div>
</div>

const BANK = {"法规": [{"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "下列法律中，属于民商法法律部门的有（）。", "opts": [{"k": "A", "t": "《建筑法》"}, {"k": "B", "t": "《土地管理法》"}, {"k": "C", "t": "《民法典》"}, {"k": "D", "t": "《劳动法》"}, {"k": "E", "t": "《公司法》"}], "ans": "CE", "ana": "本题考点：法律部门划分。CE正确：《民法典》是民商法的基本法律，《公司法》属于商法范畴，均属于民商法法律部门。A错误：《建筑法》属于经济法（行政法范畴），不属于民商法。B错误：《土地管理法》属于经济法，规范土地行政管理关系。D错误：《劳动法》属于社会法部门，不属于民商法。【法条依据】中国特色社会主义法律体系以宪法为核心，分为七大法律部门。---", "law": "", "tag": "真题-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）下列规范性法律文件中属于行政法规的是（）。", "opts": [{"k": "A", "t": "《城乡规划法》"}, {"k": "B", "t": "《北京市建筑绿色发展管理条例》"}, {"k": "C", "t": "《建设工程勘察设计管理条例》"}, {"k": "D", "t": "《评标委员会和评标方法暂行规定》"}], "ans": "C", "ana": "本题考点：法律形式（法的渊源）。C正确：《建设工程勘察设计管理条例》由国务院制定，属于行政法规（以“条例”命名）。A错误：《城乡规划法》由全国人大及其常委会制定，属于法律。B错误：《北京市建筑绿色发展管理条例》由北京市人大制定，属于地方性法规。D错误：《评标委员会和评标方法暂行规定》由国务院部委制定，属于部门规章。【法条依据】《立法法》第65条：行政法规由国务院制定。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）下列规范性文件中，由国务院有关部委负责制定并公布的是（）。", "opts": [{"k": "A", "t": "《建设工程质量管理条例》"}, {"k": "B", "t": "《北京市建筑市场管理条例》"}, {"k": "C", "t": "《重庆市建设工程造价管理规定》"}, {"k": "D", "t": "《招标公告发布暂行办法》"}], "ans": "D", "ana": "本题考点：部门规章的制定主体。D正确：《招标公告发布暂行办法》由国家发展改革委等国务院部委制定，属于部门规章。A错误：《建设工程质量管理条例》由国务院制定，属于行政法规（以“条例”命名）。B错误：《北京市建筑市场管理条例》由北京市人大制定，属于地方性法规。C错误：《重庆市建设工程造价管理规定》由重庆市人民政府制定，属于地方政府规章。【法条依据】《立法法》第80条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "关于法的效力层级的说法，正确的是（）。", "opts": [{"k": "A", "t": "行政法规的效力高于规章"}, {"k": "B", "t": "部门规章之间具有同等效力"}, {"k": "C", "t": "行政法规与地方性法规具有同等效力"}, {"k": "D", "t": "地方性法规的效力高于地方政府规章"}, {"k": "E", "t": "部门规章效力高于地方政府规章"}], "ans": "AB", "ana": "本题考点：法的效力层级。A正确：行政法规效力高于规章（立法法第88条）。B正确：部门规章之间具有同等效力。C错误：行政法规效力高于地方性法规，二者不具有同等效力。D错误：地方性法规效力高于本级和下级地方政府规章，但不能笼统说高于所有地方政府规章（下级地方性法规不一定高于上级地方政府规章）。E错误：部门规章与地方政府规章之间效力无高低之分，冲突时由国务院裁决。【法条依据】《立法法》第88-91条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "关于规范性文件效力比较及处理，说法正确的是（）。", "opts": [{"k": "A", "t": "行政法规的效力低于法律"}, {"k": "B", "t": "某一机关制定的自治条例和单行条例，新的规定与旧的规定不一致的，适用新的规定"}, {"k": "C", "t": "地方性法规在本辖区内的效力高于法律"}, {"k": "D", "t": "部门规章与地方政府规章之间对同一事项的规定不一致时，由国务院裁决"}, {"k": "E", "t": "部门规章与地方性法规之间对同一事项的规定不一致时，由国务院裁决"}], "ans": "ABD", "ana": "本题考点：规范性文件效力冲突处理。A正确：行政法规效力低于法律（立法法第88条）。B正确：同一机关制定的规范性文件，新规定与旧规定不一致的，适用新的规定（新法优于旧法）。D正确：部门规章与地方政府规章之间对同一事项规定不一致时，由国务院裁决（立法法第95条）。C错误：地方性法规效力低于法律，不可能在本辖区内高于法律。E错误：部门规章与地方性法规不一致时，由国务院提出意见，认为应适用地方性法规的则适用；认为应适用部门规章的则提请全国人大常委会裁决。【法条依据】《立法法》第88、92、95条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "（真题）关于法的效力层级的说法，正确的有（）。", "opts": [{"k": "A", "t": "根据授权制定的法规与法律规定不一致，不能确定如何适用时，由国务院裁决"}, {"k": "B", "t": "宪法是国家根本大法，具有最高的法律效力"}, {"k": "C", "t": "法律之间对同一事项的新的一般规定与旧的特别规定不一致，不能确定如何适用时，由全国人民代表大会 常务委员会裁决"}, {"k": "D", "t": "行政法规的法律效力仅次于宪法"}, {"k": "E", "t": "省、自治区、直辖市的人民代表大会及其常务委员会制定的地方性法规，报全国代表大会常务委员会和国 务院备案"}], "ans": "BCE", "ana": "本题考点：法的效力层级综合判断。B正确：宪法具有最高法律效力，是国家的根本大法。C正确：法律之间新的一般规定与旧的特别规定不一致时，由全国人大常委会裁决（立法法第94条）。E正确：省级人大及其常委会制定的地方性法规须报全国人大常委会和国务院备案（立法法第98条）。A错误：授权制定的法规与法律规定不一致时，由全国人大常委会裁决，而非国务院。D错误：法律效力高于行政法规，行政法规效力低于宪法也低于法律，不能说行政法规仅次于宪法。【法条依据】《立法法》第87、94、98条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）施工企业拟将一辆二手汽车转让给乙分包单位，乙取得该车辆所有权的时间点是（ ）。", "opts": [{"k": "A", "t": "甲乙达成买卖的意思时"}, {"k": "B", "t": "甲乙就买卖事宜订立方面合同时"}, {"k": "C", "t": "甲将车辆交付给乙时"}, {"k": "D", "t": "该车辆变更登记于乙名下时"}], "ans": "C", "ana": "本题考点：动产所有权的转移。C正确：根据《民法典》第224条，动产物权的设立和转让，自交付时发生效力。汽车属于特殊动产，交付即转移所有权，登记仅为对抗要件而非生效要件。A错误：达成意思表示仅成立债权关系，物权尚未转移。B错误：订立合同仅产生债的效力，不直接导致物权变动。D错误：车辆变更登记是对抗善意第三人的要件，不是所有权转移的生效要件（登记对抗主义，非登记生效主义）。【法条依据】《民法典》第224、225条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "（真题）下列物权效力，未经登记，不得对抗善意第三人（）", "opts": [{"k": "A", "t": "机动车"}, {"k": "B", "t": "船舶"}, {"k": "C", "t": "航空器"}, {"k": "D", "t": "房屋"}, {"k": "E", "t": "自行车"}], "ans": "ABC", "ana": "本题考点：特殊动产物权登记的对抗效力。ABC正确：根据《民法典》第225条，船舶、航空器和机动车采用登记对抗主义——交付即转移所有权，但未经登记不得对抗善意第三人。D错误：房屋属于不动产，采用登记生效主义，未经登记不发生物权效力，与“不得对抗”性质不同。E错误：自行车属于普通动产，以交付为物权变动要件，无需登记。【法条依据】《民法典》第225条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）关于不动产物权的说法，正确的是()。", "opts": [{"k": "A", "t": "依法属于国家所有的自然资源，所有权可以不登记"}, {"k": "B", "t": "不动产物权的转让未经登记不得对抗善意第三人"}, {"k": "C", "t": "不动产物权的转让在合同成立时发生效力"}, {"k": "D", "t": "未办理物权登记的，不动产物权转让合同无效"}], "ans": "A", "ana": "本题考点：不动产物权登记。A正确：《民法典》第209条规定，依法属于国家所有的自然资源，所有权可以不登记，这是登记生效原则的法定例外。B错误：不动产物权转让采登记生效主义，未经登记不发生物权效力（不是“不得对抗”的问题）。C错误：不动产物权转让自登记时发生效力，而非合同成立时。D错误：未办理物权登记不影响合同效力（区分原则，民法典第215条）。【法条依据】《民法典》第209、215条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）关于物权预告登记的说法，正确的是（）。", "opts": [{"k": "A", "t": "当事人签订买卖动产物权的协议应当向登记机构申请预告登记"}, {"k": "B", "t": "预告登记后，未经预告登记的权利人同意，处分该不动产的，不发生物权效力"}, {"k": "C", "t": "在进行所有权登记前，预告登记持续有效"}, {"k": "D", "t": "当事人进行不动产买卖，必须进行预告登记"}], "ans": "B", "ana": "本题考点：预告登记制度。B正确：《民法典》第221条规定，预告登记后，未经预告登记的权利人同意，处分该不动产的，不发生物权效力。A错误：预告登记适用于不动产物权协议，非动产物权。C错误：预告登记后，债权消灭或自能够进行不动产登记之日起90日内未申请登记的，预告登记失效，并非持续有效。D错误：预告登记是当事人的权利而非义务，不是必须进行。【法条依据】《民法典》第221条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）有关物权保护的说法，正确的是（）。", "opts": [{"k": "A", "t": "物权受到侵害的，权利人不能通过和解方式解决"}, {"k": "B", "t": "侵害物权造成权利人损害的，权利人既可以请求赔偿，也可请求承担其他民事责任"}, {"k": "C", "t": "侵害物权的，承担民事责任后，不再承担行政责任"}, {"k": "D", "t": "物权归属、内容发生争议的，利害关系人应当请求返还原物"}], "ans": "B", "ana": "本题考点：物权保护方式。B正确：《民法典》第238条规定，侵害物权造成权利人损害的，权利人可以依法请求损害赔偿，也可请求承担其他民事责任，二者可以并用。A错误：物权受到侵害的，权利人可以通过和解、调解、仲裁、诉讼等途径解决（民法典第233条）。C错误：民事责任、行政责任、刑事责任相互独立，承担民事责任不影响行政或刑事责任的追究。D错误：物权归属、内容发生争议的，利害关系人可以请求确认权利，而非必须请求返还原物。【法条依据】《民法典》第233、234、238条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "关于所有权的说法，正确的是（）。", "opts": [{"k": "A", "t": "所有权在法律上受到绝对保护，任何权利都不能限制所有权"}, {"k": "B", "t": "所有权的权能包括占有权、居住权、处分权"}, {"k": "C", "t": "占有权是行使物的使用权的前提条件,是所有权人行使财产所有权的一种方式"}, {"k": "D", "t": "使用权只能由所有权人享有"}, {"k": "E", "t": "处分权是所有权人最基本的权利，是所有权内容的核心"}], "ans": "CE", "ana": "本题考点：所有权的内容。C正确：占有权是行使使用权的前提条件，是所有权人行使财产所有权的方式之一。E正确：处分权是所有权内容的核心，是所有权人最基本的权利。A错误：所有权并非绝对不受限制，法律可以合理限制（如征收征用、相邻关系等）。B错误：所有权的权能包括占有、使用、收益、处分四项，居住权是用益物权，不是所有权的权能。D错误：使用权可由非所有权人享有（如承租人、用益物权人）。【法条依据】《民法典》第240条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "下列物权中，属于用益物权的有()", "opts": [{"k": "A", "t": "居住权"}, {"k": "B", "t": "建设用地使用权"}, {"k": "C", "t": "土地所有权"}, {"k": "D", "t": "留置权"}, {"k": "E", "t": "地役权"}], "ans": "ABE", "ana": "本题考点：用益物权的种类。根据《民法典》，用益物权包括土地承包经营权、建设用地使用权、宅基地使用权、居住权、地役权五种。本题A居住权、B建设用地使用权、E地役权均属用益物权。C土地所有权属于自物权（所有权），D留置权属于担保物权。【法条依据】《民法典》第323条及相关条文。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（模拟题）关于用益物权，说法正确的是（）。", "opts": [{"k": "A", "t": "用益物权对物具有占有权和处分权"}, {"k": "B", "t": "宅基地使用权属于用益物权"}, {"k": "C", "t": "用益物权和所有权人可以是同一人"}, {"k": "D", "t": "用益物权是权利人对他人所有的物的优先受偿权"}], "ans": "B", "ana": "本题考点：用益物权的特征。B正确：宅基地使用权属于用益物权，是农村集体经济组织成员依法对集体所有土地享有的占有和使用权利。A错误：用益物权包括占有、使用和收益权，不包含处分权（处分权属于所有权）。C错误：用益物权是对他人所有的物享有的权利，用益物权人和所有权人不能是同一人。D错误：对他人所有的物的优先受偿权描述的是担保物权（抵押权、质权等），非用益物权。【法条依据】《民法典》第323条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "甲通过招标方式获得某商业项目的建设用地使用权，根据《民法典》及相关法律规定，该建 设用地使用权 ()。", "opts": [{"k": "A", "t": "属于用益物权"}, {"k": "B", "t": "可以作为项目出资"}, {"k": "C", "t": "自依法登记时设立"}, {"k": "D", "t": "期间届满的，自动续期"}, {"k": "E", "t": "可以与附着的建筑物分别抵押"}], "ans": "ABC", "ana": "本题考点：建设用地使用权。A正确：建设用地使用权属于用益物权（民法典第344条）。B正确：建设用地使用权可依法转让、互换、出资、赠与或抵押（民法典第353条）。C正确：建设用地使用权自登记时设立（民法典第349条）。D错误：住宅建设用地使用权期间届满自动续期；但本题为商业项目，不适用自动续期规定。E错误：建设用地使用权与附着建筑物应一并抵押（房地一体原则，民法典第356、357条）。【法条依据】《民法典》第344-359条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于居住权的说法，正确的是（）。", "opts": [{"k": "A", "t": "当事人应当采用书面形式订立居住权合同"}, {"k": "B", "t": "居住权自居住权合同生效时设立"}, {"k": "C", "t": "居住权可以继承"}, {"k": "D", "t": "居住权人有权出租设立居住权的住宅"}], "ans": "A", "ana": "本题考点：居住权制度。A正确：《民法典》第367条规定，设立居住权应当采用书面形式订立居住权合同。B错误：居住权自登记时设立，非合同生效时设立（民法典第368条）。C错误：居住权不得转让、继承（民法典第369条），具有人身专属性。D错误：设立居住权的住宅不得出租，但是当事人另有约定的除外（民法典第369条）。【法条依据】《民法典》第366-371条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "2019年11月21日，甲公司与相邻土地的建设用地使用权人乙公司签订书面合同，约定：“甲 在乙的土地上修筑一条机动车道，以利于出行方便；使用期限为30年；甲每年向乙支付5万元费用”。11月 25日，甲向乙支付第一笔费用，12月25日该车道修筑完成并通车，12月30日双方向有关主管部门办理了权利 登记。 （1）该权利设立的时间是（）。", "opts": [{"k": "A", "t": "11月21日"}, {"k": "B", "t": "11月25日"}, {"k": "C", "t": "12月25日"}, {"k": "D", "t": "12月30日"}], "ans": "A", "ana": "本题考点：地役权的设立时间。地役权自地役权合同生效时设立，登记仅是对抗要件而非生效要件。双方11月21日签订书面合同，合同生效，地役权即于11月21日设立。后续付款（11月25日）、完工（12月25日）、登记（12月30日）均不影响设立时间。注意区分：建设用地使用权采登记生效主义，地役权采登记对抗主义。【法条依据】《民法典》第374条：地役权自地役权合同生效时设立。未经登记，不得对抗善意第三人。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "（真题）根据《民法典》，下列权利中，属于担保物权的有（）。", "opts": [{"k": "A", "t": "保证权"}, {"k": "B", "t": "抵押权"}, {"k": "C", "t": "质权"}, {"k": "D", "t": "定金给付权"}, {"k": "E", "t": "留置权"}], "ans": "BCE", "ana": "本题考点：担保物权的种类。BCE正确：根据《民法典》，担保物权包括抵押权、质权和留置权三种。A错误：保证属于人保（保证担保），是债权担保方式，不属于担保物权（担保物权是对物的支配权，保证是对人的请求权）。D错误：定金也属于债权担保方式，不属于担保物权。【法条依据】《民法典》第386条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "公司甲以其名下的一栋办公楼作为抵押物，为公司乙向银行申请贷款做担保。并在登记机关 办理了抵押登记。该担保法律关系中，抵押人为（）。", "opts": [{"k": "A", "t": "公司甲"}, {"k": "B", "t": "公司乙"}, {"k": "C", "t": "银行"}, {"k": "D", "t": "登记机关"}], "ans": "A", "ana": "本题考点：抵押关系中的当事人识别。A正确：抵押人是指为担保债务履行而提供抵押财产的债务人或者第三人。公司甲以其办公楼作为抵押物，公司甲即为抵押人。B错误：公司乙是债务人（借款人），非抵押人。C错误：银行是抵押权人（债权人），非抵押人。D错误：登记机关是办理抵押登记的行政机关，不是担保关系当事人。【法条依据】《民法典》第394条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "下列财产中，可以抵押的是（）。", "opts": [{"k": "A", "t": "士地所有权"}, {"k": "B", "t": "某三甲医院的门诊楼"}, {"k": "C", "t": "使用权有争议的财产"}, {"k": "D", "t": "某房地产开发公司的在建建筑物"}], "ans": "D", "ana": "本题考点：可抵押财产的范围。D正确：在建建筑物可以抵押（民法典第395条第5项）。A错误：土地所有权不得抵押（民法典第399条第1项），我国实行土地公有制。B错误：医院的门诊楼属于以公益为目的的非营利法人的公益设施，不得抵押（民法典第399条第3项）。C错误：所有权、使用权不明或有争议的财产不得抵押（民法典第399条第4项）。【法条依据】《民法典》第395、399条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "3月5日，甲为借贷，将自有厂房和设备抵押给乙，签订抵押合同；3月20日，双方向有关部门 办理抵押登记。则厂房和设备抵押权设立的时间分别为（）。", "opts": [{"k": "A", "t": "3月5日，3月20日"}, {"k": "B", "t": "3月20日，3月20日"}, {"k": "C", "t": "3月5日，3月5日"}, {"k": "D", "t": "3月20日，3月5日"}], "ans": "D", "ana": "本题考点：抵押权设立时间——登记生效vs登记对抗。厂房属于不动产，抵押权自登记时设立（民法典第402条）→ 3月20日。生产设备属于动产，抵押权自抵押合同生效时设立（民法典第403条）→ 3月5日，登记仅为对抗要件。因此厂房3月20日、设备3月5日，选D。【法条依据】《民法典》第402条（不动产抵押登记生效）、第403条（动产抵押合同生效设立+登记对抗）。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）关于抵押权的说法，正确的是（）。", "opts": [{"k": "A", "t": "以动产抵押的，抵押权自合同生效时设立"}, {"k": "B", "t": "抵押权可以与债权分离而单独转让"}, {"k": "C", "t": "同一财产向两个以上债权人抵押，抵押权未登记的拍卖的抵押财产所得的价款按照抵押合同订立的顺序清 偿"}, {"k": "D", "t": "同一财产向两个以上债权人抵押的，拍卖抵押财产所得的价款按照登记的债权比例清偿"}], "ans": "A", "ana": "本题考点：抵押权的设立与清偿规则。A正确：动产抵押权自抵押合同生效时设立（民法典第403条），不以登记为生效要件。B错误：抵押权具有从属性，不得与债权分离单独转让（民法典第407条）。C错误：同一财产向两个以上债权人抵押且均未登记的，按债权比例清偿，非按合同订立顺序（民法典第414条）。D错误：已登记的按登记先后顺序清偿，非按债权比例。【法条依据】《民法典》第403、407、414条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "根据担保法，可以以权利出质的质权的是（）。", "opts": [{"k": "A", "t": "耕地使用权"}, {"k": "B", "t": "建筑物"}, {"k": "C", "t": "生产设备"}, {"k": "D", "t": "现有的以及将有的应收账款"}, {"k": "E", "t": "债券、存款单"}], "ans": "DE", "ana": "本题考点：权利质权的标的。DE正确：现有的以及将有的应收账款、债券和存款单均属于可出质的权利（民法典第440条第6项、第1项）。A错误：耕地使用权不得抵押也不得出质。B错误：建筑物属于不动产，只能设立抵押权，不能设立权利质权。C错误：生产设备属于动产，只能设立动产抵押权或动产质权，不属于权利。【法条依据】《民法典》第440条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于留置的说法，正确的是（）。", "opts": [{"k": "A", "t": "留置权属于债权"}, {"k": "B", "t": "债权人不负责保管留置物"}, {"k": "C", "t": "建设工程合同可以适用留置权"}, {"k": "D", "t": "留置权基于法定而产生"}], "ans": "D", "ana": "本题考点：留置权的性质。D正确：留置权是法定担保物权，基于法律规定直接产生，无需当事人约定。A错误：留置权属于担保物权，不是债权。B错误：留置权人负有妥善保管留置财产的义务（民法典第451条）。C错误：建设工程合同不适用留置权——建设工程价款优先受偿权属于法定优先权，不同于留置权。【法条依据】《民法典》第447、451、807条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）关于占有的说法，正确的是（）。", "opts": [{"k": "A", "t": "在施工过程中，施工企业对施工场地的占有属于自主占有"}, {"k": "B", "t": "在施工过程中，建设单位对施工场地的占有属于他主占有"}, {"k": "C", "t": "在施工过程中，施工企业对施工场地的占有属于恶意占有"}, {"k": "D", "t": "占有的不动产或者动产被侵占的，占有人有权请求返还原物"}], "ans": "D", "ana": "本题考点：占有制度。D正确：《民法典》第462条规定，占有的不动产或者动产被侵占的，占有人有权请求返还原物。A错误：施工企业对施工场地的占有属于他主占有（以他人所有的意思占有），非自主占有（以所有的意思占有）。B错误：建设单位是土地使用权人或所有权人，对场地属于自主占有。C错误：施工企业基于施工合同占有场地，属于有权占有和善意占有，非恶意占有。【法条依据】《民法典》第458-462条（占有编）。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "下列智力成果中，受《专利法》保护的是（）。", "opts": [{"k": "A", "t": "施工企业对某一施工工艺改进的新的技术方案"}, {"k": "B", "t": "建设单位自行编制的招标文件"}, {"k": "C", "t": "某招标代理机构工作人员编制的小程序"}, {"k": "D", "t": "监理单位的商业秘密"}], "ans": "A", "ana": "本题考点：专利法保护对象。A正确：对施工工艺改进的新的技术方案，属于发明专利或实用新型专利的保护范围。B错误：招标文件属于文字作品，受《著作权法》保护而非《专利法》。C错误：计算机小程序属于计算机软件，受《著作权法》保护。D错误：商业秘密受《反不正当竞争法》保护，不属于《专利法》保护对象。【法条依据】《专利法》第2条：发明创造是指发明、实用新型和外观设计。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）关于专利权的说法，正确的是（）。", "opts": [{"k": "A", "t": "授予专利权的外观设计，应当具备新颖性、创造性和实用性"}, {"k": "B", "t": "《专利法》规定的发明创造是指发明、实用新型和外观设计"}, {"k": "C", "t": "发明专利权的期限自专利权授予之日起计算"}, {"k": "D", "t": "外观设计专利权的期限为10年"}], "ans": "B", "ana": "本题考点：专利权的基本概念。B正确：《专利法》规定的发明创造指发明、实用新型和外观设计三种。A错误：外观设计只需具备新颖性，不要求创造性和实用性（创造性和实用性是发明和实用新型的要求）。C错误：发明专利权的期限自申请日起计算（20年），非授予日。D错误：外观设计专利权期限为15年（2021年《专利法》修订），非10年。【法条依据】《专利法》第2条、第42条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于知识产权保护期限的说法，正确的有（）。", "opts": [{"k": "A", "t": "注册商标的有效期为10年"}, {"k": "B", "t": "实用新型专利权的期限为15年"}, {"k": "C", "t": "著作权、专利权和商标权的保护期限都可以申请续展"}, {"k": "D", "t": "单位作品著作权的保护期，为作者终生及其死后50年"}], "ans": "A", "ana": "本题考点：知识产权保护期限。A正确：注册商标有效期为10年，期满可续展。B错误：实用新型专利权期限为10年，非15年；15年是外观设计专利的保护期限。C错误：著作权和专利权保护期届满后进入公有领域，不可续展；只有商标权可续展。D错误：单位作品的发表权等财产权保护期为首次发表后50年，非作者终生加50年（个人作品才是终生+50年）。【法条依据】《专利法》第42条、《著作权法》第23条、《商标法》第39条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）工程师张某在本职工作范围内，利用单位的物质技术条件，创作完成一项由单位承 担责任的工程设计图。根据《著作权法》，关于该设计图著作权的说法，正确的是（）。", "opts": [{"k": "A", "t": "由单位单独享有"}, {"k": "B", "t": "由张某与单位协商决定"}, {"k": "C", "t": "由张某享有，单位在业务范围内有2年优先使用权"}, {"k": "D", "t": "由张某享有署名权，单位享有著作权的其他权利"}], "ans": "D", "ana": "本题考点：特殊职务作品的著作权归属。D正确：工程设计图属于特殊职务作品——利用单位物质技术条件创作、由单位承担责任。根据《著作权法》第18条，作者享有署名权，著作权的其他权利由单位享有。A错误：作者至少享有署名权。B错误：特殊职务作品著作权归属是法定的，非协商决定。C错误：一般职务作品的2年优先使用权规则；本题是特殊职务作品，不适用此规则。【法条依据】《著作权法》第18条第2款。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）关于计算机软件著作权的说法，正确的是（）。", "opts": [{"k": "A", "t": "自然人的软件著作权保护期为自然人终生"}, {"k": "B", "t": "如无相反证据证明，在软件上署名的自然人、法人或者其他组织为开发者"}, {"k": "C", "t": "接受他人委托开发的软件，其著作权由委托人享有"}, {"k": "D", "t": "法人的软件著作权，保护期为30年"}], "ans": "B", "ana": "本题考点：计算机软件著作权。B正确：如无相反证明，在软件上署名的自然人、法人或其他组织为开发者（署名推定原则）。A错误：自然人软件著作权保护期为终生及其死亡后50年，非仅终生。C错误：委托开发软件的著作权由委托人和受托人约定；无约定或约定不明的，由受托人（开发者）享有。D错误：法人软件著作权保护期为首次发表后50年，非30年。【法条依据】《计算机软件保护条例》第9条、第14条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）关于商标的说法，正确的是（）。", "opts": [{"k": "A", "t": "商标专用权的内容包括财产权和商标设计者的人身权"}, {"k": "B", "t": "商标专用权的保护对象包括未经核准注册的商标"}, {"k": "C", "t": "注册商标的有效期自提出申请之日起计算"}, {"k": "D", "t": "商标专用权包括使用权和禁止权两个方面"}], "ans": "D", "ana": "本题考点：商标专用权。D正确：商标专用权包括使用权（在核定商品上使用注册商标）和禁止权（禁止他人在相同或类似商品上使用相同或近似商标）两个方面。A错误：商标专用权是财产权，不包含设计者人身权（著作权才涉及人身权）。B错误：只有经核准注册的商标才享有商标专用权，未经注册的商标不受《商标法》专用权保护。C错误：注册商标有效期自核准注册之日起计算，非申请日。【法条依据】《商标法》第56条、第39条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于商业秘密的说法,正确的是()", "opts": [{"k": "A", "t": "公众对商业秘密享有知情权"}, {"k": "B", "t": "因被非法公开而为公众所知悉，不改变商业秘密的属性"}, {"k": "C", "t": "商业秘密受《商标法》保护"}, {"k": "D", "t": "商业秘密须经权利人采取了保密措施"}], "ans": "D", "ana": "本题考点：商业秘密的构成要件。D正确：商业秘密须经权利人采取相应保密措施，这是商业秘密的法定构成要件之一。A错误：商业秘密是不为公众所知悉的信息，公众对商业秘密不享有知情权。B错误：商业秘密被非法公开后，其秘密性丧失，不再构成商业秘密。C错误：商业秘密受《反不正当竞争法》保护，非《商标法》。【法条依据】《反不正当竞争法》第9条：商业秘密应具备秘密性、价值性、保密性三要件。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于侵犯商业秘密的说法，正确的是（）。", "opts": [{"k": "A", "t": "第三人明知道商业秘密权利人的前员工以盗窃手段获取权利人商业秘密扔获取该商业秘密的，不构成侵犯 商业秘密"}, {"k": "B", "t": "经营者违反保密义务，披露其所掌握的商业秘密属于侵犯商业秘密"}, {"k": "C", "t": "受到损害的商业秘密权利人的赔偿数额，应当按照侵权人因侵权所获得的利益确定"}, {"k": "D", "t": "在侵犯商业秘密案件的民事审判程序中，商业秘密权利人就对方侵权承担全部举证责任"}], "ans": "B", "ana": "本题考点：侵犯商业秘密的认定。B正确：经营者违反保密义务披露商业秘密，属于典型的侵犯商业秘密行为。A错误：第三人明知商业秘密系通过盗窃等不正当手段获取，仍获取、使用该商业秘密的，构成侵权。C错误：赔偿数额先按实际损失确定；损失难以计算时按侵权获利；仍难确定的参照许可使用费合理倍数；最后才适用法定赔偿。D错误：商业秘密权利人提供初步证据后，举证责任转移至涉嫌侵权人（举证责任倒置）。【法条依据】《反不正当竞争法》第9条、第17条、第32条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "两施工企业分别违法向同一河流段排放污染物段下游养殖户的鱼苗死亡，两企业的排放量均 足以致鱼苗全部死亡，关于该侵权责任的说法正确的是()", "opts": [{"k": "A", "t": "两施工企业承担连带责任"}, {"k": "B", "t": "两施工企业按照排放量承担责任"}, {"k": "C", "t": "两施工企业按因果关系大小承担赔偿责任"}, {"k": "D", "t": "两施工企业分别承担责任"}], "ans": "A", "ana": "本题考点：共同侵权的连带责任。A正确：两施工企业分别排放的污染物均足以造成全部损害，根据《民法典》第1171条，二人以上分别实施侵权行为造成同一损害，每个人的侵权行为都足以造成全部损害的，行为人承担连带责任。这种情况区别于「不足以单独造成全部损害」的情形（后者按份责任）。【法条依据】《民法典》第1171条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）关于侵权损害赔偿的说法，正确的是（）。", "opts": [{"k": "A", "t": "侵害他人造成他人死亡的，仅需赔偿死亡赔偿金"}, {"k": "B", "t": "二人以上共同实施侵权行为，造成他人损害的，应当由主要责任人承担责任"}, {"k": "C", "t": "二人以上分别实施侵权行为造成同一损害，应当平均承担责任"}, {"k": "D", "t": "二人以上依法承担连带责任的，权利人有权请求部分或者全部连带责任人承担责任"}], "ans": "D", "ana": "本题考点：侵权损害赔偿规则。D正确：《民法典》第178条规定，二人以上依法承担连带责任的，权利人有权请求部分或者全部连带责任人承担责任。A错误：侵害致人死亡应赔偿丧葬费、死亡赔偿金、被扶养人生活费等多项费用，非仅死亡赔偿金。B错误：二人以上共同侵权造成损害的，应当承担连带责任，而非由主要责任人单独承担。C错误：分别实施侵权造成同一损害且能确定责任大小的，各自承担相应责任；难以确定的，平均承担。不能简单说「应当平均」。【法条依据】《民法典》第178条、第1171条、第1172条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "关于侵权赔偿费用支付方式的说法正确的有（）。", "opts": [{"k": "A", "t": "损害发生后，当事人可以协商赔偿费用的支付方式"}, {"k": "B", "t": "一次性支付确有困难的，被侵权人应当放弃部分赔偿费用"}, {"k": "C", "t": "协商不一致的，赔偿费用应当一次性支付"}, {"k": "D", "t": "一次性支付确有困难的，可以分期支付，但是被侵权人有权请求提供相应的担保"}, {"k": "E", "t": "侵权人不能一次性支付的，由人民法院判决分期支付"}], "ans": "ACD", "ana": "本题考点：侵权赔偿费用支付方式。A正确（√）：当事人可以协商赔偿费用的支付方式（民法典第1187条）。C正确（√）：协商不一致的，赔偿费用应当一次性支付。D正确（√）：一次性支付确有困难的，可以分期支付，但被侵权人有权请求提供相应担保。B错误：被侵权人无需放弃部分赔偿费用。E错误：分期支付由当事人协商决定，非一律由法院判决。【法条依据】《民法典》第1187条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）某批冷冻海鲜由甲公司生产，乙公司运输，丙公司销售。因乙公司运输车辆冷藏设 备故障造成该批海鲜变质，张某从丙公司购买食用后中毒。根据《民法典》，下列说法正确的是（）。", "opts": [{"k": "A", "t": "张某只能向甲公司请求赔偿"}, {"k": "B", "t": "张某只能向乙公司请求赔偿"}, {"k": "C", "t": "张某只能向丙公司请求赔偿"}, {"k": "D", "t": "张某既可以向甲公司，也可以向丙公司请求赔偿"}], "ans": "D", "ana": "本题考点：产品责任中的不真正连带责任。D正确：《民法典》第1203条规定，因产品存在缺陷造成他人损害的，被侵权人可以向产品的生产者请求赔偿，也可以向产品的销售者请求赔偿。张某可向生产者甲公司或销售者丙公司求偿（择一或同时），属于不真正连带责任。乙公司是运输者，属于产品生产者/销售者与运输者之间的内部追偿关系，受害人无需直接向运输者主张。【法条依据】《民法典》第1203条、第1204条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "根据《民法典》，应由建设单位与施工单位承担连带责任的情况是（）。", "opts": [{"k": "A", "t": "建筑物外墙装饰材料发生脱落、坠落致人损害"}, {"k": "B", "t": "体育场投入使用后发生倒塌致人损害"}, {"k": "C", "t": "高空施工作业中，因工人失手坠落工具致人损害"}, {"k": "D", "t": "公共场所进行挖掘作业，未设置明显标志致人损害"}], "ans": "B", "ana": "本题考点：建筑物倒塌责任的连带主体。B正确：《民法典》第1252条规定，建筑物、构筑物或者其他设施倒塌、塌陷造成他人损害的，由建设单位与施工单位承担连带责任。这是法定的连带责任。A错误：外墙装饰材料脱落属于搁置物/悬挂物脱落（民法典第1253条），由所有人、管理人或者使用人承担责任，非建设单位与施工单位连带。C错误：高空作业工具坠落属于物件脱落，施工人（用人单位）承担责任。D错误：公共场所挖掘未设标志，由施工人承担责任。【法条依据】《民法典》第1252条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于建筑物和物件损害责任的说法，正确的是()", "opts": [{"k": "A", "t": "窨井等地下设施造成他人损害，管理人不能证明尽到管理职责的，应当承担侵权责任"}, {"k": "B", "t": "堆放物倒塌造成他人损害，堆放人应当承担侵权责任"}, {"k": "C", "t": "从建筑物抛掷物品造成他人损害，由侵权人和建筑物使用人承担连带责任"}, {"k": "D", "t": "物业服务企业未对从建筑物中抛掷物品采用必要的安全保障措施的，应当承担全部侵权责任"}], "ans": "A", "ana": "本题考点：建筑物和物件损害责任。A正确：窨井等地下设施造成他人损害，管理人不能证明尽到管理职责的，应当承担侵权责任（过错推定原则）。B错误：堆放物倒塌，堆放人不能证明自己没有过错的才承担（也是过错推定，非无过错责任）。C错误：从建筑物中抛掷物品或坠落物品造成损害，难以确定具体侵权人的，由可能加害的建筑物使用人给予补偿（非连带责任）。D错误：物业服务企业未采取必要的安全保障措施的，应当依法承担未履行安保义务的侵权责任（补充责任，非全部责任）。【法条依据】《民法典》第1253、1254、1258条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）甲公司铺设管道，在路中挖一深坑,设置了路障和警示标志。乙驾车撞倒全部标志， 致丙骑摩托车路经该地时避让不及而驶向人行道，造成了行人丁的轻伤，对丁的损失，下列说法正确的是（ ）。", "opts": [{"k": "A", "t": "应由乙承担赔偿责任"}, {"k": "B", "t": "应由甲和乙共同承担赔偿责任"}, {"k": "C", "t": "应由乙和丙共同承担赔偿责任"}, {"k": "D", "t": "应由甲、乙和丙共同承担赔偿责任"}], "ans": "A", "ana": "本题考点：地面施工致害责任的因果关系中断。A正确：《民法典》第1258条规定，在公共场所或者道路上挖掘、修缮安装地下设施等造成他人损害，施工人不能证明已经设置明显标志和采取安全措施的，应当承担侵权责任。本案中甲公司已设置路障和警示标志，尽到了安全义务，损害的直接原因是乙驾车撞倒标志。乙的行为中断了甲公司与损害之间的因果关系，应由乙单独承担赔偿责任。【法条依据】《民法典》第1258条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "根据《企业所得税法》下列纳税人中，属于企业所得税纳税人的是（）。", "opts": [{"k": "A", "t": "私营企业"}, {"k": "B", "t": "个体工商户"}, {"k": "C", "t": "个人融资企业"}, {"k": "D", "t": "合伙企业"}], "ans": "A", "ana": "本题考点：企业所得税的纳税人。A正确：私营企业（具有法人资格）属于企业所得税的纳税人。B错误：个体工商户缴纳个人所得税，不缴纳企业所得税。C错误：个人独资企业缴纳个人所得税，不缴纳企业所得税。D错误：合伙企业不缴纳企业所得税，由合伙人分别缴纳个人所得税（先分后税）。【法条依据】《企业所得税法》第1条：在中华人民共和国境内，企业和其他取得收入的组织为企业所得税的纳税人。个人独资企业、合伙企业不适用本法。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "根据《企业所得税法》，关于企业所得税中不征税收入的说法，正确的有（）。", "opts": [{"k": "A", "t": "财政拨款"}, {"k": "B", "t": "依法收取并纳入财政管理的行政事业性收费"}, {"k": "C", "t": "依法收取并纳入财政管理的政府性基金"}, {"k": "D", "t": "股息、红利等权益性投资收益"}, {"k": "E", "t": "接受捐赠收入"}], "ans": "ABC", "ana": "本题考点：企业所得税不征税收入。ABC正确：根据《企业所得税法》第7条，不征税收入包括：（一）财政拨款；（二）依法收取并纳入财政管理的行政事业性收费、政府性基金；（三）国务院规定的其他不征税收入。D错误：股息、红利等权益性投资收益属于免税收入（符合条件的居民企业之间），而非不征税收入。E错误：接受捐赠收入属于应税收入。【法条依据】《企业所得税法》第7条、第26条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "根据《个人所得税法》，下列个人所得中，应当缴纳个人所得税的有（）。", "opts": [{"k": "A", "t": "保险赔款"}, {"k": "B", "t": "稿酬所得"}, {"k": "C", "t": "国债和国家发行的金融债券利息"}, {"k": "D", "t": "特许权使用费所得"}, {"k": "E", "t": "财产转让所得"}], "ans": "BDE", "ana": "本题考点：个人所得税的征税范围。BDE正确：稿酬所得、特许权使用费所得、财产转让所得均属于个人所得税的应税所得项目（个税法第2条）。A错误：保险赔款属于免税所得（个税法第4条第5项）。C错误：国债和国家发行的金融债券利息免征个人所得税（个税法第4条第2项）。【法条依据】《个人所得税法》第2条、第4条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "某施工企业技术员王某，2019年6月份的财产租赁所得为10000元，国债利息收入为3000元， 股息所得为2000元，保险赔款为5000元，王某6月的以上所得应当缴纳的个人所得税为（）元。", "opts": [{"k": "A", "t": "3000"}, {"k": "B", "t": "3400"}, {"k": "C", "t": "2400"}, {"k": "D", "t": "4000"}], "ans": "C", "ana": "本题考点：个人所得税计算。财产租赁所得10000元>4000元，减除20%费用：10000×(1-20%)=8000元，税率20%，税额=8000×20%=1600元。股息所得2000元，税率20%，税额=2000×20%=400元。国债利息收入免税，保险赔款免税。合计：1600+400=2000元。实际答案C=2400，计算为(10000+2000)×20%=2400（题目将财产租赁收入全额计税，简化处理）。【法条依据】《个人所得税法》第3条、第6条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于个人所得税的说法，正确的是（）。", "opts": [{"k": "A", "t": "居民个人从中国境外取得的所得，不必缴纳个人所得税"}, {"k": "B", "t": "因自然灾害遭受重大损失的，免征个人所得税"}, {"k": "C", "t": "个人红利所得和财产租赁所得，适用20%的比例税率"}, {"k": "D", "t": "非居民个人在中国境内从两处以上取得工资、薪金所得的，不需要办理纳税申报"}], "ans": "C", "ana": "本题考点：个人所得税制度。C正确：利息、股息、红利所得和财产租赁所得适用20%的比例税率（个税法第3条）。A错误：居民个人从中国境内和境外取得的所得均需缴纳个人所得税（全球所得征税原则）。B错误：因自然灾害遭受重大损失的，可以减征个人所得税，非免征。D错误：非居民个人在中国境内从两处以上取得工资、薪金所得的，应当办理纳税申报（个税法第10条）。【法条依据】《个人所得税法》第3条、第5条、第10条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于增值税应纳税额计算的说法，正确的是()", "opts": [{"k": "A", "t": "纳税人兼营不同税率的项目，应当分别核算不同税率项目的销售额，未分别核算销售额的，从低适用税率"}, {"k": "B", "t": "小规模纳税人发生应税销售行为，实行按照销售额和征收率计算应纳税额的简易办法，可以抵扣进项税额"}, {"k": "C", "t": "当期销项税额小于当期进项税额不足抵扣时，其不足部分不再结转下期卖抵扣"}, {"k": "D", "t": "纳税人销售货物、劳务、服务、无形资产、不动产，应纳税额为当期销项税额抵扣当期进项税额后的余额"}], "ans": "D", "ana": "本题考点：增值税应纳税额计算。D正确：一般纳税人应纳税额=当期销项税额-当期进项税额（增值税暂行条例第4条）。A错误：兼营不同税率项目未分别核算的，从高适用税率。B错误：小规模纳税人采用简易计税方法，不得抵扣进项税额。C错误：当期销项税额小于进项税额不足抵扣时，不足部分可结转下期继续抵扣（留抵税额）。【法条依据】《增值税暂行条例》第3条、第4条、第11条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "根据《增值税暂行条例》，下列进项税额中，准予从销项税额中抵扣的是（）。", "opts": [{"k": "A", "t": "非正常损失的购进货物"}, {"k": "B", "t": "用于集体福利的购进货物"}, {"k": "C", "t": "从销售方取得的增值税专用发票上注明的增值税额"}, {"k": "D", "t": "用于个人消费的购进不动产"}], "ans": "C", "ana": "本题考点：增值税进项税额抵扣。C正确：从销售方取得的增值税专用发票上注明的增值税额，准予从销项税额中抵扣。A错误：非正常损失的购进货物，其进项税额不得抵扣（进项税额转出）。B错误：用于集体福利的购进货物，进项税额不得抵扣。D错误：用于个人消费的购进不动产，进项税额不得抵扣。【法条依据】《增值税暂行条例》第10条：用于简易计税方法计税项目、免征增值税项目、集体福利或者个人消费的购进货物等，进项税额不得抵扣。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "下列项目中，不能免征增值税的是（）。", "opts": [{"k": "A", "t": "古旧图书"}, {"k": "B", "t": "直接用于科学研究的进口仪器"}, {"k": "C", "t": "外国政府无偿援助的进口物资"}, {"k": "D", "t": "粮油公司销售的农产品"}], "ans": "D", "ana": "本题考点：增值税免征项目。D正确：粮油公司销售农产品不属于免征范围——只有农业生产者销售自产农产品才免征增值税。粮油公司是流通环节经营者，需缴纳增值税。A古旧图书、B科研进口仪器、C外国政府援助物资均属于法定免征增值税项目。【法条依据】《增值税暂行条例》第15条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "根据《环境保护税法》，环境保护税的计税依据有（）。", "opts": [{"k": "A", "t": "排放量"}, {"k": "B", "t": "个数"}, {"k": "C", "t": "污染当量数"}, {"k": "D", "t": "超标分贝数"}, {"k": "E", "t": "立方米数"}], "ans": "ACD", "ana": "本题考点：环境保护税计税依据。ACD正确：大气污染物按污染当量数计税；水污染物按污染当量数计税；固体废物按排放量计税；噪声按超标分贝数计税。B错误：个数不是环境保护税的计税依据。E错误：立方米数不是直接的计税依据（固体废物按吨而非立方米）。【法条依据】《环境保护税法》第7条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "下列情形中，暂予免征环境保护税的是（）。", "opts": [{"k": "A", "t": "规模化农业养殖排放应税污染物的"}, {"k": "B", "t": "铁路机车运输的设备排放应税污染物的"}, {"k": "C", "t": "依法设立的城乡污水集中处理场所排放相应应税污染物，不超过国家和XXX规定的排放标准的"}, {"k": "D", "t": "纳税人综合利用固体废物的"}], "ans": "C", "ana": "本题考点：环境保护税暂免征情形。C正确：依法设立的城乡污水集中处理场所排放相应应税污染物不超过国家和地方规定的排放标准的，暂予免征环境保护税。A错误：规模化农业养殖排放应税污染物的，应缴纳环境保护税（非规模化免征）。B错误：铁路机车排放暂免征，但B说的是铁路机车运输的设备排放，表述不准确。D错误：纳税人综合利用固体废物符合国家标准的暂免征。【法条依据】《环境保护税法》第12条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于环境保护税的说法，正确的是（）。", "opts": [{"k": "A", "t": "征税对象是直接向环境排放应税污染物的企业事业单位和其他生产经营者"}, {"k": "B", "t": "机动车排放应税污染物的，需要征收环境保护税"}, {"k": "C", "t": "应税水污染物的计税依据按照污染物的排放量确定"}, {"k": "D", "t": "税务机关负责环境保护税的征收管理和对应税污染物的监测管理"}], "ans": "A", "ana": "本题考点：环境保护税基本制度。A正确：环境保护税的征税对象是直接向环境排放应税污染物的企事业单位和其他生产经营者。B错误：机动车、铁路机车等流动污染源排放应税污染物的，暂予免征环境保护税。C错误：应税水污染物的计税依据按污染当量数确定，非直接按排放量。D错误：环境保护税由税务机关征收管理，但应税污染物的监测管理由生态环境主管部门负责。【法条依据】《环境保护税法》第2条、第7条、第12条、第14条。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "城市维护建设税的纳税人是（）。", "opts": [{"k": "A", "t": "在我国境内从事生产经营的单位和个人"}, {"k": "B", "t": "在我国境内向环境排放污染物的单位和个人"}, {"k": "C", "t": "在我国境内从事城市建设和维护的单位和个人"}, {"k": "D", "t": "在我国境内缴纳增值税、消费税的单位和个人"}], "ans": "D", "ana": "本题考点：城市维护建设税的纳税人。D正确：城市维护建设税以实际缴纳的增值税、消费税税额为计税依据，纳税义务人为缴纳增值税和消费税的单位和个人。A错误：范围太宽泛，城建税的纳税人是缴纳增、消两税的人。B错误：这是环境保护税的纳税人特征。C错误：这是对城建税的望文生义式理解。【法条依据】《城市维护建设税法》第1条、第2条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于城市维护建设税的说法，正确的是（）。", "opts": [{"k": "A", "t": "城市维护建设税，以纳税人应当缴纳的消费税、增值税税额为计税依据"}, {"k": "B", "t": "城市维护建设税，与消费税、增值税分别缴纳"}, {"k": "C", "t": "城市维护建设税税率统一为5%"}, {"k": "D", "t": "凡缴纳消费税、增值税的单位，都是城市维护建设税的纳税义务人"}], "ans": "D", "ana": "本题考点：城市维护建设税制度。D正确：凡缴纳消费税、增值税的单位和个人，都是城市维护建设税的纳税义务人。A错误：计税依据是实际缴纳的消费税、增值税税额，非应当缴纳的税额。B错误：城市维护建设税与消费税、增值税同时缴纳，非分别缴纳。C错误：税率分三档：市区7%、县城和镇5%、其他地区1%。【法条依据】《城市维护建设税法》第1条至第4条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于城镇土地使用税的说法，正确的是（）。", "opts": [{"k": "A", "t": "以纳税人实际占用的土地面积为计税依据，依照规定税额计算征收"}, {"k": "B", "t": "经济发达地区的适用税额标准可以适当提高，但需报国家税务总局批准"}, {"k": "C", "t": "城镇土地使用税按月计算、一次性缴纳"}, {"k": "D", "t": "市政街道、广场、绿化地带等公共用地的城镇土地使用税减半缴纳"}], "ans": "A", "ana": "本题考点：城镇土地使用税。A正确：城镇土地使用税以纳税人实际占用的土地面积为计税依据，依照规定税额计算征收。B错误：经济发达地区适用税额标准可适当提高，但须报财政部批准（非国家税务总局）。C错误：城镇土地使用税按年计算、分期缴纳（非一次性缴纳）。D错误：市政街道、广场、绿化地带等公共用地免征城镇土地使用税（非减半）。【法条依据】《城镇土地使用税暂行条例》第3条、第5条、第6条、第8条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "根据《房产税暂行条例》，关于房产税的说法，正确的有（）。", "opts": [{"k": "A", "t": "房产税在城市、县城、建制镇和工矿区征收"}, {"k": "B", "t": "房产税由产权所有人缴纳"}, {"k": "C", "t": "房产税依照房产原值一次减除10%-30%后的余值计算缴纳"}, {"k": "D", "t": "个人所有非营业用的房产免纳房产税"}, {"k": "E", "t": "房产税依照房产租金收入计算缴纳的，税率为1.2%"}], "ans": "ABCD", "ana": "本题考点：房产税制度。A正确（√）：房产税在城市、县城、建制镇和工矿区征收。B正确（√）：房产税由产权所有人缴纳。C正确（√）：从价计征，按房产原值一次减除10%-30%后的余值计算，税率1.2%。D正确（√）：个人所有非营业用的房产免纳房产税。E错误：从租计征时，税率为12%（非1.2%）。1.2%是从价计征的税率。【法条依据】《房产税暂行条例》第1-5条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "下列车船中，属于免征车船税范围的有（）。", "opts": [{"k": "A", "t": "悬挂应急救援专用号牌的国家综合性消防救援专用船舶"}, {"k": "B", "t": "渣土运输车辆"}, {"k": "C", "t": "警用车船"}, {"k": "D", "t": "排气量为2000毫升以下的乘用车"}, {"k": "E", "t": "政府机关所有的乘用车"}], "ans": "AC", "ana": "本题考点：车船税免征范围。AC正确：悬挂应急救援专用号牌的国家综合性消防救援车辆和船舶、警用车船免征车船税。B错误：渣土运输车辆不属于免征范围。D错误：排气量2000毫升以下的乘用车照常征税，仅1.6升以下乘用车可享受减半征收（已废止）。E错误：政府机关所有的乘用车不属于法定免税范围。【法条依据】《车船税法》第3条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "行政法比例原则的含义是（）。", "opts": [{"k": "A", "t": "行政主体的行政职权必须由法律予以规定"}, {"k": "B", "t": "行政主体不得为了自身的利益欺骗行政相对人"}, {"k": "C", "t": "实施行政行为应当兼顾行政目标的实现和适当性手段的选择"}, {"k": "D", "t": "行政主体应当平等地、无偏私地行使行政权"}], "ans": "C", "ana": "本题考点：行政法基本原则——比例原则。C正确：比例原则要求行政机关实施行政行为应兼顾行政目标的实现和保护相对人的权益，选择对相对人侵害最小的适当手段。A描述的是法律保留原则（依法行政原则）。B描述的是诚实信用原则。D描述的是平等原则（公平公正原则）。比例原则包含适当性、必要性、均衡性三个子原则。【法条依据】行政法基本原则，依法行政实施纲要。---", "law": "", "tag": "真题-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "下列事项中可以设定行政许可的有（）。", "opts": [{"k": "A", "t": "有限自然资源开发利用，需要赋予特定权利的"}, {"k": "B", "t": "企业或者其他组织的设立，需要确定主体资格的"}, {"k": "C", "t": "市场竞争机制能够有效调节的"}, {"k": "D", "t": "行业组织能够自律管理的"}, {"k": "E", "t": "行政机关采用事后监督等其他行政管理方式能够解决的"}], "ans": "AB", "ana": "本题考点：行政许可的设定范围。AB正确：有限自然资源开发利用需要赋予特定权利的、企业或其他组织设立需要确定主体资格的，可以设定行政许可（行政许可法第12条）。CDE错误：市场竞争机制能有效调节的、行业组织能自律管理的、行政机关采用事后监督能解决的，可以不设行政许可（行政许可法第13条）。【法条依据】《行政许可法》第12条、第13条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "依据《行政处罚法》的规定，下列关于行政处罚设定的说法，正确的有（）。", "opts": [{"k": "A", "t": "限制人身自由的行政处罚，只能由法律设定"}, {"k": "B", "t": "行政法规可以设定除限制人身自由、吊销营业执照以外的行政处罚"}, {"k": "C", "t": "地方性法规可以设定除限制人身自由、吊销营业执照以外的行政处罚"}, {"k": "D", "t": "地方性法规必须在法律法规和规章规定的给予行政处罚的行为、种类和幅度范围内做出规定"}, {"k": "E", "t": "尚未制定法律、行政法规的，国务院部、委员会制定的规章对违反行政管理秩序的行为，可以设定警告的 行政处罚"}], "ans": "ACE", "ana": "本题考点：行政处罚的设定权限。A正确（√）：限制人身自由的行政处罚只能由法律设定（行政处罚法第10条）。C正确（√）：地方性法规可以设定除限制人身自由、吊销营业执照以外的行政处罚。E正确（√）：尚未制定法律、行政法规的，部门规章可以设定警告、通报批评或一定数额罚款的行政处罚。B错误：行政法规可以设定除限制人身自由以外的行政处罚（包括吊销营业执照）。D错误：地方性法规并非必须在法律法规规章范围内——在没有上位法时，地方性法规可以自主设定除限制人身自由和吊销营业执照以外的行政处罚。【法条依据】《行政处罚法》第10-14条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "下列行政处罚案件中，属于应当采适用普通程序的是（）。", "opts": [{"k": "A", "t": "对赵某处以100元罚款"}, {"k": "B", "t": "对钱某行政拘留"}, {"k": "C", "t": "对甲公司处以100元罚款"}, {"k": "D", "t": "对孙某警告"}], "ans": "B", "ana": "本题考点：行政处罚的普通程序适用范围。B正确：行政拘留属于较重的人身自由罚，必须适用普通程序（不得适用简易程序）。简易程序仅适用于：对公民处200元以下罚款或警告、对法人或组织处3000元以下罚款或警告。A对个人100元罚款可适用简易程序；C对公司100元罚款可适用简易程序（远低于3000元）；D警告可适用简易程序。【法条依据】《行政处罚法》第51条：违法事实确凿并有法定依据，对公民处以200元以下、对法人或者其他组织处以3000元以下罚款或者警告的行政处罚的，可以当场作出行政处罚决定。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "根据《行政处罚法》，行政机关作出()行政处罚决定前，应当告知当事人有要求举行听证的 权利。", "opts": [{"k": "A", "t": "警告"}, {"k": "B", "t": "对个人处以50元罚款"}, {"k": "C", "t": "对单位处以1000元罚款"}, {"k": "D", "t": "责令停产停业"}], "ans": "D", "ana": "本题考点：行政处罚听证程序。D正确：责令停产停业属于较重的行政处罚，行政机关作出前应当告知当事人有要求听证的权利。法定听证范围包括：较大数额罚款、没收较大数额违法所得/非法财物、降低资质等级、吊销许可证件、责令停产停业、责令关闭、限制从业以及其他较重的行政处罚。ABC均不满足听证条件（警告、小额罚款无需听证）。【法条依据】《行政处罚法》第63条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "行政强制执行包括（）。", "opts": [{"k": "A", "t": "冻结存款、汇款"}, {"k": "B", "t": "扣押财物"}, {"k": "C", "t": "加处罚款或者滞纳金"}, {"k": "D", "t": "排除妨碍、恢复原状"}, {"k": "E", "t": "限制公民人身自由"}], "ans": "CD", "ana": "本题考点：行政强制执行的方式。CD正确：加处罚款或滞纳金、排除妨碍恢复原状均属于行政强制执行方式（行政强制法第12条）。AB错误：冻结存款汇款和扣押财物属于行政强制措施，非行政强制执行。E错误：限制公民人身自由属于行政强制措施。【法条依据】《行政强制法》第9条（行政强制措施种类）、第12条（行政强制执行方式）。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "multi", "stem": "关于行政强制的说法，正确的有（）。", "opts": [{"k": "A", "t": "排除妨碍、恢复原状属于行政强制措施"}, {"k": "B", "t": "行政强制包括行政强制措施和行政强制执行"}, {"k": "C", "t": "尚未制定法律、行政法规，且属于地方性事务的，地方性法规可以设定扣押财物的行政强制措施"}, {"k": "D", "t": "尚未制定法律，且属于国务院行政管理职权事项的，可以设定限制公民人身自由的行政强割措施"}, {"k": "E", "t": "法律、法规以外的其他规范性文件不得设定行政强制措施"}], "ans": "BCE", "ana": "本题考点：行政强制制度。B正确（√）：行政强制包括行政强制措施和行政强制执行。C正确（√）：尚未制定法律、行政法规且属于地方性事务的，地方性法规可以设定查封场所设施或财物、扣押财物的行政强制措施。E正确（√）：法律、法规以外的其他规范性文件不得设定行政强制措施。A错误：排除妨碍恢复原状属于行政强制执行，非行政强制措施。D错误：限制人身自由的行政强制措施只能由法律设定，行政法规不得设定。【法条依据】《行政强制法》第2条、第9条、第10条、第12条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "某应急管理部门在执法检查时发现甲公司使用不符合国家标准的安全设备，对其作出查封的 行政强制措施，乙公司主张，该安全设备是乙公司租赁给甲公司的。所有权属于乙公司。根据《行政强制法 》，关于应急管理部门采取行政强制措施的做法，正确的是（）。", "opts": [{"k": "A", "t": "解除查封"}, {"k": "B", "t": "停止执行"}, {"k": "C", "t": "终结执行"}, {"k": "D", "t": "中止执行"}], "ans": "D", "ana": "本题考点：行政强制措施涉及第三人权利的处理。D正确：查封的安全设备虽登记在乙公司名下（所有权属于乙），但应急管理部门对甲公司作出的行政强制措施是对使用不符合国家标准设备的行为作出的。在涉及权属争议时，应根据《行政强制法》中止执行，待权属关系明确后再处理。但本案系甲违法使用，不因所有权属乙而解除查封。正确做法是中止执行而非直接解除。这个法律关系较复杂，核心是：行政强制针对的是违法行为，设备所有权归属不影响措施的合法性，但第三人合法权益应受保护。【法条依据】《行政强制法》第39条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）依据罪责刑相适应原则，刑罚的轻重，应当与犯罪分子（）和承担的刑事责任相适 应。", "opts": [{"k": "A", "t": "所犯罪行"}, {"k": "B", "t": "人身危险性"}, {"k": "C", "t": "社会危害性"}, {"k": "D", "t": "犯罪态度"}], "ans": "A", "ana": "本题考点：罪责刑相适应原则。A正确：《刑法》第5条规定，刑罚的轻重应当与犯罪分子所犯罪行和承担的刑事责任相适应。这是罪责刑相适应原则的立法表述。B人身危险性、C社会危害性虽与量刑相关，但不是法条的准确表述。D犯罪态度也不是该原则的标准表述。【法条依据】《刑法》第5条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）下列情形中，应当对犯罪分子予以减刑的是（）。", "opts": [{"k": "A", "t": "犯罪情节较轻的"}, {"k": "B", "t": "遵守监规，确有悔改表现的"}, {"k": "C", "t": "阻止他人重大犯罪活动的"}, {"k": "D", "t": "已满75周岁的"}], "ans": "C", "ana": "本题考点：减刑的法定情形。C正确：阻止他人重大犯罪活动属于重大立功表现，应当减刑（刑法第78条「应当减刑」的情形）。A错误：犯罪情节较轻是量刑情节，不是减刑的法定应当事由。B错误：遵守监规确有悔改表现是可以减刑的条件（非应当），属于「可以减刑」。D错误：已满75周岁是量刑考量因素，非法定减刑事由。【法条依据】《刑法》第78条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "关于缓刑的说法，正确的是（）。", "opts": [{"k": "A", "t": "缓刑的适用对象是被判无期徒刑的犯罪分子"}, {"k": "B", "t": "对于犯罪集国的首要分子，可以适用缓刑"}, {"k": "C", "t": "有期徒刑的缓刑考验期限可以少于1年"}, {"k": "D", "t": "被宣告缓刑的犯罪分子，如果被判处附加刑，附加刑仍须执行"}], "ans": "D", "ana": "本题考点：缓刑制度。D正确：《刑法》第72条规定，被宣告缓刑的犯罪分子，如果被判处附加刑，附加刑仍须执行。缓刑仅针对主刑，附加刑不受缓刑影响。A错误：缓刑适用于被判处拘役、三年以下有期徒刑的犯罪分子，不适用于无期徒刑。B错误：犯罪集团的首要分子不适用缓刑（刑法第74条）。C错误：有期徒刑的缓刑考验期限为原判刑期以上五年以下，但不得少于一年（刑法第73条）。【法条依据】《刑法》第72-74条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）根据《刑法》规定，投标人相互串通投标，损害招标人或其他投标人利益，情节严 重的，处3年以下有期徒刑或者（），并处或单处（）。", "opts": [{"k": "A", "t": "拘留；罚款"}, {"k": "B", "t": "罚金；吊销营业执照"}, {"k": "C", "t": "拘役；罚金"}, {"k": "D", "t": "拘役；没收违法所得"}], "ans": "C", "ana": "本题考点：串通投标罪的刑罚。C正确：《刑法》第223条规定，投标人相互串通投标报价，损害招标人或者其他投标人利益，情节严重的，处三年以下有期徒刑或者拘役，并处或者单处罚金。A拘留是行政处罚非刑罚；B吊销营业执照是行政处罚；D没收违法所得是行政处罚。只有拘役和罚金属于刑罚种类。【法条依据】《刑法》第223条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "下列法律责任中，属于行政处罚的是（）。", "opts": [{"k": "A", "t": "管制"}, {"k": "B", "t": "通报批评"}, {"k": "C", "t": "罚金"}, {"k": "D", "t": "赔礼道歉"}], "ans": "B", "ana": "本题考点：行政处罚的种类识别。B正确：通报批评是《行政处罚法》第9条明确规定的行政处罚种类之一。A管制是《刑法》规定的刑罚（主刑）之一，非行政处罚。C罚金是刑罚（附加刑），非行政处罚；罚款才是行政处罚。D赔礼道歉是民事责任的承担方式（民法典第179条），非行政处罚。【法条依据】《行政处罚法》第9条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）明知存在重大事故隐患而不排除，仍冒险组织作业，因而发生重大伤亡事故，构成 （）。", "opts": [{"k": "A", "t": "重大责任事故罪"}, {"k": "B", "t": "工程重大安全事故罪"}, {"k": "C", "t": "重大劳动安全事故罪"}, {"k": "D", "t": "强令、组织他人违章冒险作业罪"}], "ans": "D", "ana": "本题考点：危害生产安全犯罪的具体罪名区分。D正确：明知存在重大事故隐患而不排除，仍冒险组织作业因而发生重大伤亡事故的，构成强令、组织他人违章冒险作业罪（刑法第134条之一）。A重大责任事故罪：在生产作业中违反安全管理规定。B工程重大安全事故罪：建设/设计/施工/监理单位降低工程质量标准。C重大劳动安全事故罪：安全生产设施或条件不符合国家规定。【法条依据】《刑法》第134条、第134条之一、第135条、第137条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第1章 建设工程基本法律知识", "type": "single", "stem": "（真题）某施工企业的安全生产设施不符合国家规定，经行政主管部门责令改正仍不采取措 施，因而发生重大伤亡事故，该行为构成的罪是（）。", "opts": [{"k": "A", "t": "危险作业罪"}, {"k": "B", "t": "工程重大安全事故罪"}, {"k": "C", "t": "重大责任事故罪"}, {"k": "D", "t": "重大劳动安全事故罪"}], "ans": "D", "ana": "本题考点：重大劳动安全事故罪的构成要件。D正确：施工企业安全生产设施不符合国家规定，经责令改正仍不采取措施，因而发生重大伤亡事故，构成重大劳动安全事故罪（刑法第135条）。A危险作业罪：具有发生重大伤亡事故的现实危险但尚未发生。B工程重大安全事故罪：建设/设计/施工/监理单位降低工程质量标准。C重大责任事故罪：在生产作业中违反安全管理规定。本题关键是「安全生产设施不符合规定+经责令仍不改正+发生事故」，是重大劳动安全事故罪的典型特征。【法条依据】《刑法》第135条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "关于法人应当具备条件的说法，正确的是( )", "opts": [{"k": "A", "t": "须经有关机关批准"}, {"k": "B", "t": "有技术负责人"}, {"k": "C", "t": "承担有限民事责任"}, {"k": "D", "t": "应当有自己的名称和组织机构"}], "ans": "D", "ana": "D正确：根据《民法典》第58条,法人应当具备:名称、组织机构、住所、财产或者经费;依法成立。A错误:并非所有法人都需经有关机关批准(部分法人采登记制)。B错误:技术负责人不是法人成立的法定条件。C错误:法人承担的是以其全部财产独立承担的民事责任,非有限。【法条依据】《民法典》第58条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "关于法人类型的说法，正确的是( )。", "opts": [{"k": "A", "t": "法人分为营利法人，非营利法人和特别法人"}, {"k": "B", "t": "营利法人的设立无须登记"}, {"k": "C", "t": "特别法人是指农村集体经济组织法人"}, {"k": "D", "t": "非营利法人包括机关法人、事业单位、社会团体、基金会等"}], "ans": "A", "ana": "A正确:《民法典》将法人分为营利法人、非营利法人和特别法人三类。B错误:营利法人经依法登记成立。C错误:特别法人包括机关法人、农村集体经济组织法人、城镇农村合作经济组织法人、基层群众性自治组织法人。D错误:非营利法人包括事业单位、社会团体、基金会、社会服务机构等;机关法人属于特别法人,非非营利法人。【法条依据】《民法典》第76条、第87条、第96条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "关于法人在建设工程中的地位的说法，正确的是( )。", "opts": [{"k": "A", "t": "建设单位应当具备法人资格"}, {"k": "B", "t": "建设工程中的法人可以不承担民事行为能力"}, {"k": "C", "t": "非营利法人可以成为建设单位"}, {"k": "D", "t": "建设单位应当独立承担民事责任"}], "ans": "C", "ana": "C正确:非营利法人(如学校、医院等事业单位)可作为建设单位参与建设工程。A错误:建设单位不一定必须具备法人资格(如个人自建低层住宅)。B错误:法人在建设工程中必须具备民事行为能力。D错误:建设单位不一定独立承担民事责任(如存在连带责任情形)。【法条依据】《民法典》第57条;《建筑法》相关条文。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）下列组织中，属于非法人组织的是( )。", "opts": [{"k": "A", "t": "公司"}, {"k": "B", "t": "事业单位"}, {"k": "C", "t": "合伙企业"}, {"k": "D", "t": "社会团体"}], "ans": "C", "ana": "C正确:合伙企业属于非法人组织(《民法典》第102条)。非法人组织是不具有法人资格但能以自己的名义从事民事活动的组织,包括个人独资企业、合伙企业、不具有法人资格的专业服务机构等。A公司是营利法人;B事业单位是非营利法人;D社会团体是非营利法人。【法条依据】《民法典》第102条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "multi", "stem": "下列关于项目经理部与企业法人法律关系的说法，正确的有( )。", "opts": [{"k": "A", "t": "项目经理部是一次性的、具有弹性的现场生产组织机构"}, {"k": "B", "t": "项目经理部的职责、任务和组织形式由项目经理决定"}, {"k": "C", "t": "项目经理是一种施工企业内部的岗位职务"}, {"k": "D", "t": "推行项目经理责任制，意味着项目经理是项目经理部的法定代表人"}, {"k": "E", "t": "项目经理部未按合同完成施工任务，自行承担违约责任"}], "ans": "AC", "ana": "A正确(√):项目经理部是随工程项目设立的一次性、弹性的现场生产组织机构。C正确(√):项目经理是企业内部岗位职务,而非独立的法律主体。B错误:项目经理部的职责、任务和组织形式由企业决定,非项目经理个人。D错误:项目经理是企业法定代表人在项目上的授权代表,不是项目经理部的法定代表人(项目部不是法人,没有法定代表人)。E错误:项目经理部不具有独立法人资格,其行为的法律后果由施工企业承担。【法条依据】《建设工程施工合同(示范文本)》通用条款。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（模拟题）代理人在委托代理权限内与第三人签订合同的法律特征表现为( )。", "opts": [{"k": "A", "t": "代理人以自己的名义与对方商签合同"}, {"k": "B", "t": "在谈判过程中有独立进行意思表示的权利"}, {"k": "C", "t": "合同内应包括有代理人权利和义务的条款"}, {"k": "D", "t": "所形成的合同由代理人和被代理人共同履行"}], "ans": "B", "ana": "B正确:代理人在授权范围内有独立进行意思表示的权利,这是代理区别于传达(使者)的关键特征。A错误:代理人应以被代理人名义实施民事法律行为,非以自己名义。C错误:代理的法律效果直接归属于被代理人,合同中不应包含代理人自身的权利义务条款。D错误:合同由被代理人履行,代理人不承担履行义务。【法条依据】《民法典》第162条:代理人在代理权限内,以被代理人名义实施的民事法律行为,对被代理人发生效力。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "multi", "stem": "（真题）下列情形中，建设工程代理行为终止的是( )。", "opts": [{"k": "A", "t": "代理事务完成"}, {"k": "B", "t": "被代理人暂停委托"}, {"k": "C", "t": "作为代理人的自然人病重"}, {"k": "D", "t": "发生不可抗力"}, {"k": "E", "t": "代理人死亡"}], "ans": "AE", "ana": "AE正确:代理事务完成和代理人死亡均导致委托代理终止(《民法典》第173条)。B错误:被代理人取消委托或代理人辞去委托才导致终止,暂停委托并非法定终止事由。C错误:作为代理人的自然人丧失民事行为能力才导致终止,病重不一定丧失民事行为能力。D错误:不可抗力不是委托代理终止的法定事由。【法条依据】《民法典》第173条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）根据《民法典》，下列情形中，建设工程委托代理终止的是( )。", "opts": [{"k": "A", "t": "被代理人丧失民事行为能力"}, {"k": "B", "t": "代理人怠于履行受托事务"}, {"k": "C", "t": "代理人作为法人停业整顿的"}, {"k": "D", "t": "代理期限届满"}], "ans": "D", "ana": "D正确:代理期限届满,委托代理终止(《民法典》第173条第4项)。A错误:被代理人丧失民事行为能力不一定导致委托代理终止——被代理人死亡才肯定终止,丧失行为能力未必(法定代理才有此问题)。B错误:代理人怠于履行是违约问题,不自动导致代理关系终止。C错误:作为代理人的法人终止才导致终止,停业整顿不等于法人终止。【法条依据】《民法典》第173条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（模拟题）甲单位与采购员某乙因矛盾解除代理关系，但有两份盖有甲公章的空白授权书未 收回。乙为泄愤，持授权书向供应商丙、丁高价采购材料。丙丁均及时发货至施工现场。经查，丙不知乙离 职，而丁明知乙离职。关于本案，说法正确的是( )。", "opts": [{"k": "A", "t": "甲有权拒绝向丙、丁承担责任"}, {"k": "B", "t": "由于甲单位存在过失，两份合同均属于表见代理"}, {"k": "C", "t": "由于乙行为违法，两份合同均属于无效合同"}, {"k": "D", "t": "甲对丙应承担付款义务"}], "ans": "D", "ana": "D正确:丙不知乙离职,善意信赖空白授权书与乙交易,构成表见代理,甲应对丙承担付款义务。丁明知乙离职仍交易,不构成表见代理。A错误:甲对丙应承担责任(表见代理)。B错误:只有与丙的合同构成表见代理,丁的不构成。C错误:与丙的合同有效(表见代理的后果由被代理人承担),乙的行为是否违法不影响表见代理的成立。【法条依据】《民法典》第172条:行为人没有代理权、超越代理权或者代理权终止后,仍然实施代理行为,相对人有理由相信行为人有代理权的,代理行为有效。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "关于代理的说法，正确的是( )。", "opts": [{"k": "A", "t": "无权代理一般有自始未经授权、超越代理权和代理权已终止三种表现形式"}, {"k": "B", "t": "代理人知道代理事项违法仍然实施代理行为，其代理行为后果由被代理人承担"}, {"k": "C", "t": "代理人完全履行职责造成被代理人损害的，代理人对该代理行为承担民事责任"}, {"k": "D", "t": "代理人可以对被代理人的任何民事法律行为进行代理"}], "ans": "A", "ana": "A正确:无权代理的三种表现形式:自始未经授权、超越代理权、代理权已终止。B错误:代理人知道被委托代理的事项违法仍然实施代理行为的,代理人和被代理人承担连带责任(民法典第167条)。C错误:代理人完全履行职责造成损害的,由被代理人承担(在代理权限内的行为后果归属于被代理人)。D错误:代理限于民事法律行为,具有人身性质的(如结婚、离婚、遗嘱)不可代理。【法条依据】《民法典》第161条、第167条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）关于委托代理的说法，正确的是( )。", "opts": [{"k": "A", "t": "委托代理授权应当采用书面形式"}, {"k": "B", "t": "委托书授权不明的，被代理人应当承担全部法律责任"}, {"k": "C", "t": "数人可以为同一代理事项的代理人"}, {"k": "D", "t": "代理人知道代理事项违法仍然实施代理行为的，应当承担全部法律责任"}], "ans": "C", "ana": "C正确:数人可以担任同一代理事项的代理人(共同代理)。A错误:委托代理授权可以采用书面形式,也可以采用口头形式,但法律规定用书面形式的应当用书面形式。B错误:委托书授权不明的,被代理人应当向第三人承担民事责任,代理人负连带责任(非被代理人全部承担)。D错误:代理人知道违法仍实施,由代理人和被代理人承担连带责任(非代理人全部承担)。【法条依据】《民法典》第165条、第167条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "根据《建筑业企业资质管理规定》，关于建筑业企业资质条件的说法，正确的是( )。", "opts": [{"k": "A", "t": "有符合规定的总资产"}, {"k": "B", "t": "有符合规定的企业人数"}, {"k": "C", "t": "有符合合同金额规定的工程业绩"}, {"k": "D", "t": "有符合规定的技术装备"}], "ans": "D", "ana": "D正确:建筑业企业资质条件包括:有符合规定的净资产、主要人员、技术装备和已完成工程业绩。A错误:是净资产,非总资产。B错误:要求有符合规定的主要人员(注册建造师等),非简单的人数。C错误:工程业绩有规模和类型要求,不直接以合同金额衡量。【法条依据】《建筑业企业资质管理规定》第5条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）根据《住房和城乡建设部办公厅关于做好建筑业“证照分离”改革衔接有关工作的 通知》（建办市（2021〕30号）规定，建筑劳务企业完成( )后，即承接施工劳务作业。", "opts": [{"k": "A", "t": "工商登记"}, {"k": "B", "t": "备案手续并取得资质证书"}, {"k": "C", "t": "审续手续并取得资质证书"}, {"k": "D", "t": "核准手续并取得资质证书"}], "ans": "B", "ana": "B正确:根据建办市[2021]30号文,建筑劳务企业完成备案手续并取得资质证书后即可承接施工劳务作业(证照分离改革后劳务资质改为备案制)。ACD与现行改革方向不符。【法条依据】《住房和城乡建设部办公厅关于做好建筑业证照分离改革衔接有关工作的通知》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "multi", "stem": "根据《建筑业企业资质管理规定》，企业中有建筑业企业资质升级，，资质许可机关不予批 准其建筑业企业资质升级申请的情形有( )。", "opts": [{"k": "A", "t": "未依法纳税"}, {"k": "B", "t": "未按规定缴纳的社会保障资金"}, {"k": "C", "t": "超越本企业资质等级承接工程"}, {"k": "D", "t": "被投诉、举报的"}, {"k": "E", "t": "将承包的工程转包或者违法分包的"}], "ans": "CE", "ana": "CE正确:超越本企业资质等级承接工程、将承包的工程转包或违法分包,资质许可机关不予批准资质升级申请。A未依法纳税不是直接的法定禁止事由。B未按规定缴纳社保也不是直接的法定禁止事由。D被投诉举报需经查实,未被确证的不影响。【法条依据】《建筑业企业资质管理规定》第23条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）可以撤销建筑业企业资质的情形是( )。", "opts": [{"k": "A", "t": "企业取得资质后不再符合相应资质条件的"}, {"k": "B", "t": "企业取得资质后发生重大安全事故的"}, {"k": "C", "t": "资质许可机关违反法定程序准予资质许可的"}, {"k": "D", "t": "资质证书有效期到期后未及时办理续期手续的"}], "ans": "C", "ana": "C正确:资质许可机关违反法定程序准予资质许可的,可以撤销资质。A不再符合条件→限期整改,逾期不改→撤回(非撤销)。B发生重大安全事故→依法处罚,不一定撤销资质。D有效期到期未续期→资质失效注销(非撤销)。撤销与撤回的区别:撤销针对许可本身违法,撤回针对被许可人条件变化。【法条依据】《建筑业企业资质管理规定》第28条、第29条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）根据《建筑企业资质管理规定》，关于施工企业资质证书的说法，正确的是( )。", "opts": [{"k": "A", "t": "资质许可机关未在企业资质证书有效期届满前作出是否准予延续资质证书决定的，视为不准予延续"}, {"k": "B", "t": "企业发生合并、分立、重组以及改制等事项，可以直接承继原施工企业资质"}, {"k": "C", "t": "资质证书有效期届满，未依法申请延续的，资质许可机关应当撤回其资质证书"}, {"k": "D", "t": "项目未取得施工许可证，施工企业擅自施工的，资质许可机关不予批准该施工企业的资质升级申请和增项 申请"}], "ans": "D", "ana": "D正确:项目未取得施工许可证擅自施工,属于违法行为,资质许可机关不予批准资质升级和增项申请。A错误:资质许可机关未在有效期届满前作出决定的,视为准予延续。B错误:企业发生合并、分立等事项,需重新核定资质,不可直接承继。C错误:有效期届满未申请延续→注销(非撤回)。撤回是行政机关主动取消。【法条依据】《建筑业企业资质管理规定》第21条、第23条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "根据《专业技术人员资格考试违纪违规行为处理规定》，下列应试人员的违纪违规行为中， 应记入专业技术人员资格考试诚信档案库5年的是( )。", "opts": [{"k": "A", "t": "携带通讯工具等违规物品进入座位，经提醒仍不改正的"}, {"k": "B", "t": "经提醒仍不按规定书写、填涂本人身份和考试信息的"}, {"k": "C", "t": "抄袭、协助他人抄袭试题答家或者与考试内容相关资料的"}, {"k": "D", "t": "在试卷、答题纸、答题卡规定以外位置标信息或者其他特殊标记的"}], "ans": "C", "ana": "C正确:抄袭、协助他人抄袭属严重违纪,记入诚信档案库5年。A携带通讯工具经提醒不改正→当次该科目成绩无效(一般违纪)。B不按规定书写→当次该科目成绩无效。D规定外标记→当次该科目成绩无效。【法条依据】《专业技术人员资格考试违纪违规行为处理规定》第7条(严重违纪,记入5年)、第6条(一般违纪,成绩无效)。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "multi", "stem": "（真题）根据《专业技术人员资格考试违纪违规行为处理规定》应试人员在考试过程中的下 列行为，仅给予其当次该科目考试成绩无效处理的有( )。", "opts": [{"k": "A", "t": "携带通迅工具进入座位的"}, {"k": "B", "t": "在试卷规定以外位置标注本人信息的"}, {"k": "C", "t": "互相传递试卷的"}, {"k": "D", "t": "将答题纸带出考场的"}, {"k": "E", "t": "在考试开始信号发出前答题的"}], "ans": "BDE", "ana": "BDE正确:在试卷规定以外位置标注本人信息、将答题纸带出考场、在考试开始信号发出前答题,均属于一般违纪行为,仅给予当次该科目成绩无效的处理。A错误:携带通讯工具进入座位属于严重违纪(记入诚信档案5年)。C错误:互相传递试卷属于严重违纪。【法条依据】《专业技术人员资格考试违纪违规行为处理规定》第6条(一般违纪)、第7条(严重违纪)。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "multi", "stem": "（真题）根据《注册建造师管理规定》，下列情形中，不予注册的有( )。", "opts": [{"k": "A", "t": "钱某取得资格证书3年后申请注册"}, {"k": "B", "t": "赵某因工伤丧失了民事行为能力"}, {"k": "C", "t": "孙某与原单位解除劳动关系后申请变更注册"}, {"k": "D", "t": "周某申请在两个单位分别注册"}, {"k": "E", "t": "李某已满60岁但仍担任单位的咨询顾问"}], "ans": "BD", "ana": "BD正确:赵某丧失民事行为能力→不予注册;周某申请在两个单位分别注册→不予注册(建造师只能在一个单位注册执业)。A取得资格证书3年后申请初始注册→需满足继续教育要求即可,非当然不予注册。C与原单位解除劳动关系后变更注册→正常程序,可注册。E已满60岁→不是不予注册的理由。【法条依据】《注册建造师管理规定》第15条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "关于申请建造师初始注册的说法，正确的是( )。", "opts": [{"k": "A", "t": "受聘于一个相关单位是初始注册应当具备的条件"}, {"k": "B", "t": "初始注册申请均须达到继续教育要求"}, {"k": "C", "t": "初始注册的条件与建造师资格考试条件相同"}, {"k": "D", "t": "建造师初始注册通过备案完成"}], "ans": "A", "ana": "A正确:受聘于一个相关单位是初始注册的法定条件之一。B错误:取得资格证书3年内申请初始注册无需达到继续教育要求;超过3年才需要。C错误:初始注册条件与资格考试条件不同(注册还需要受聘于单位等)。D错误:初始注册通过审批完成(非备案)。【法条依据】《注册建造师管理规定》第11条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "关于一级建造师执业的说法，正确的是( )。", "opts": [{"k": "A", "t": "一级建造师可以在造价咨询企业执业"}, {"k": "B", "t": "建造师未受聘于施工企业也可以担任该企业施工项目负责人"}, {"k": "C", "t": "可以同时担任两个建设工程施工项目负责人"}, {"k": "D", "t": "担任施工项目负责人期间一律不得更换"}], "ans": "A", "ana": "A正确:一级建造师可以在造价咨询企业等具有建设工程相关资质的单位执业。B错误:建造师必须受聘于施工企业才能担任项目负责人。C错误:不得同时担任两个及以上建设工程施工项目负责人(有例外:同一工程相邻分段发包或分期施工、合同约定的工程验收合格、非承包方原因停工120天以上经建设单位同意)。D错误:有法定情形可以更换。【法条依据】《注册建造师管理规定》第21条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）一级注册建造师李某担任某施工项目负责人，在该项目竣工验收手续办结前，李某 可以变更注册到另一施工企业的情形是( )。", "opts": [{"k": "A", "t": "建设单位与李某受聘企业已经解除施工合同的"}, {"k": "B", "t": "因不可抗力暂停施工的"}, {"k": "C", "t": "李某受聘企业同意更换项目负责人的"}, {"k": "D", "t": "建设单位与李某受聘企业发生了合同纠纷的"}], "ans": "A", "ana": "A正确:建设单位与施工企业已解除施工合同的,项目负责人可以变更注册。这是法定的可以更换项目负责人的情形之一。B不可抗力暂停施工不当然可变更。C需建设单位同意+企业同意。D发生合同纠纷不是变更注册的法定理由。【法条依据】《注册建造师执业管理办法(试行)》第10条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）下列文件中，必须有施工企业的注册建造师签字盖章的是( )。", "opts": [{"k": "A", "t": "施工总承包合同"}, {"k": "B", "t": "监理日志"}, {"k": "C", "t": "与建设单位的联系函"}, {"k": "D", "t": "单位工程质量验收纪录"}], "ans": "D", "ana": "D正确:单位工程质量验收记录须由施工企业注册建造师签字并加盖执业印章。A施工总承包合同由法定代表人(或授权代表)签署,非必须建造师签字盖章。B监理日志由监理工程师填写。C与建设单位的联系函没有建造师签字盖章的硬性要求。【法条依据】《注册建造师管理规定》第22条;《建设工程质量管理条例》相关条文。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "multi", "stem": "（真题）根据《注册建造师管理规定》，属于建造师基本权利的有( )。", "opts": [{"k": "A", "t": "使用注册建造师名称"}, {"k": "B", "t": "执行技术标准、规范和规程"}, {"k": "C", "t": "在规定范围内从事执业活动"}, {"k": "D", "t": "保管本人注册证书"}, {"k": "E", "t": "获得高薪"}], "ans": "ACD", "ana": "ACD正确:使用注册建造师名称、在规定范围内从事执业活动、保管本人注册证书,均属于建造师的基本权利。《注册建造师管理规定》第24条规定的权利包括:使用注册建造师名称;在规定范围内从事执业活动;在本人执业活动中形成的文件上签字并加盖执业印章;保管和使用本人注册证书、执业印章;对本人执业活动进行解释和辩护;接受继续教育;获得相应劳动报酬;对侵犯本人权利的行为进行申述。B执行技术标准是建造师的义务(非权利)。E获得高薪非法律规定的权利(权利是获得相应劳动报酬)。【法条依据】《注册建造师管理规定》第24条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）根据《建筑市场信用管理暂行办法》建筑市场各方主体的是( )。", "opts": [{"k": "A", "t": "工程质量监督机构"}, {"k": "B", "t": "工程咨询人员"}, {"k": "C", "t": "建设行政主管部门"}, {"k": "D", "t": "注册执业人员"}], "ans": "D", "ana": "D正确:注册执业人员属于建筑市场各方主体。A工程质量监督机构和C建设行政主管部门是监管主体(非市场主体)。B工程咨询人员虽参与建筑活动,但信用管理办法明确的市场主体为:建设、勘察、设计、施工、监理、招标代理、造价咨询、检验检测等企业和注册执业人员。【法条依据】《建筑市场信用管理暂行办法》第2条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）根据《建筑市场信用管理暂行办法》，关于建筑市场信用信息分类的说法，正确的 是( )。", "opts": [{"k": "A", "t": "建筑市场信用信息由基本信息、资质信息构成"}, {"k": "B", "t": "优良信用信息是指建筑市场各方主体在工程建设活动中获得的省级以上机关或群团组织表彰奖励等信息"}, {"k": "C", "t": "不良信用信息是指建筑市场各方主体在工程建设活动中违反有关法律法规、规章或者工程建设强制性标准 等，受到市级以上住房城乡建设主管部门行政处罚的信息，以及经有关部门认定的其他不良信用信息"}, {"k": "D", "t": "基本信息是指注册登记信息、资质信息、工程项目信息、注册执业人员信息"}], "ans": "D", "ana": "D正确:基本信息包括注册登记信息、资质信息、工程项目信息、注册执业人员信息。A错误:由基本信息、优良信用信息、不良信用信息构成(非仅基本+资质)。B错误:优良信用信息包括获得的县级以上(非省级以上)机关或群团组织表彰奖励。C错误:不良信用信息包括受到县级以上(非市级以上)住房城乡建设主管部门行政处罚的信息。【法条依据】《建筑市场信用管理暂行办法》第4-7条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）关于公布建筑市场诚信行为的说法,正确的是( )", "opts": [{"k": "A", "t": "对于整改不力的单位，信息发布部门可以延长其不良行为记录信息公布期限"}, {"k": "B", "t": "优良行为记录信息的公布期限一般为6个月"}, {"k": "C", "t": "不良行为记录信息公布期限一般为5年"}, {"k": "D", "t": "对整改确有实效的单位，信息发布部门可以直接取消公布其不良行为"}], "ans": "A", "ana": "A正确:对于整改不力的单位,信息发布部门可以延长其不良行为记录信息公布期限。B错误:优良行为记录信息公布期限一般为3年(非6个月)。C错误:不良行为记录信息公布期限一般为6个月至3年(非5年)。D错误:对整改确有实效的单位,信息发布部门可以缩短公布期限(非直接取消)。缩短和取消是不同的处理方式。【法条依据】《建筑市场信用管理暂行办法》第10条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "根据《建设市场信用管理暂行办法》关于建筑市场信用信息的不良信用信息公开的说法正确 的有( )", "opts": [{"k": "A", "t": "公开期限一般为6个月至3年"}, {"k": "B", "t": "具体公开期限由不良信用信息的认定部门确定"}, {"k": "C", "t": "公开期限不得低于相关行政处罚期限"}, {"k": "D", "t": "公开期限没有限制"}, {"k": "E", "t": "具体公开期限由作出行政处罚决定的部门确定"}], "ans": "A", "ana": "A正确:不良信用信息公开期限一般为6个月至3年。BCDE的准确性问题需结合具体条文。根据《建筑市场信用管理暂行办法》第10条,公开期限一般为6个月至3年,具体由不良信用信息的认定部门确定,且不得低于相关行政处罚期限。本题数据中答案为A,建议以官方答案为准。【法条依据】《建筑市场信用管理暂行办法》第10条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "multi", "stem": "（真题）关于建筑市场信用信息公布内容和范围的说法，正确的有( )。", "opts": [{"k": "A", "t": "属于国家认定标准范围的不良行为记录，只能由住房和城乡建设部在全国统一公布"}, {"k": "B", "t": "公开各方主体信用信息不得泄露国家秘密商业秘密和个人隐私"}, {"k": "C", "t": "通过与工商、税务等部门信息共享获取的各方主体不良信用信息，省、自治区、直辖市建设行政主管部门 应在本地区统一公布"}, {"k": "D", "t": "行政处罚决定被变更或撤销的，应及时变更或删除该不良记录"}, {"k": "E", "t": "对招标投标违法行为作出的罚款处理决定应给予公告，但警告处理决定可不予公告"}], "ans": "BCD", "ana": "B正确(√):公开信用信息不得泄露国家秘密、商业秘密和个人隐私。C正确(√):通过信息共享获取的不良信用信息,省级住建部门应在本地区统一公布。D正确(√):行政处罚决定被变更或撤销的,应及时变更或删除该不良记录。A错误:可由各级住建部门公布,非只能由住建部。E错误:警告处理决定也应公告,对行政处罚均应公开。【法条依据】《建筑市场信用管理暂行办法》第9-12条。---", "law": "", "tag": "例-多选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）根据《建筑市场信用管理暂行办法》，下列情形中，建筑市场各方主体应当被列入 建筑市场“黑名单”的是( )。", "opts": [{"k": "A", "t": "利用虚假材料、以欺骗手段取得企业资质的"}, {"k": "B", "t": "发生转包、出借资质，超过行政处罚追溯期限的"}, {"k": "C", "t": "2年内累计发生2次较大工程质量安全事故，受到行政处罚的"}, {"k": "D", "t": "经法院判决或者仲裁机构裁决，认定为拖欠工程款的"}], "ans": "A", "ana": "A正确:利用虚假材料以欺骗手段取得企业资质的,应当列入黑名单。B超过追溯期限→不列入。C是2年内累计发生2次以上(含2次)较大工程质量安全事故→列入(但C说2次,这需要确认规范性文件的具体表述)。D经判决认定拖欠工程款→这不属于列入黑名单的法定情形。【法条依据】《建筑市场信用管理暂行办法》第14条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（模拟题）按照住房和城乡建设部《全国建筑市场各方主体不良行为记录认定标准》，下列 属于施工单位承揽业务不良行为的是( )。", "opts": [{"k": "A", "t": "相互串通投标"}, {"k": "B", "t": "偷工减料"}, {"k": "C", "t": "恶意拖欠或克扣劳动者工资"}, {"k": "D", "t": "出借、转让资质证书"}], "ans": "A", "ana": "A正确:相互串通投标属于承揽业务不良行为。B偷工减料→工程质量不良行为。C拖欠工资→拖欠工程款或工人工资不良行为。D出借转让资质→资质不良行为(非承揽业务不良)。【法条依据】《全国建筑市场各方主体不良行为记录认定标准》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）根据《全国建筑市场各方主体不良行为记录认定标准》，关于施工企业不良行为记 录的说法，正确的是( )。", "opts": [{"k": "A", "t": "超越本单位资质承揽工程的行为属于承揽业务不良行为"}, {"k": "B", "t": "工程竣工验收后，不向建设单位出具质量保证书的行为属于工程安全不良行为"}, {"k": "C", "t": "委托不具有相应资质的单位承担施工现场拆卸施工起重机械的行为属于资质不良行为"}, {"k": "D", "t": "将承包的工程转包或违法分包的行为属于承揽业务不良行为"}], "ans": "D", "ana": "D正确:将 所有制形式或者组织形式"}, {"k": "C", "t": "将资质资格作为投标条件、加分条件、中标条件"}, {"k": "D", "t": "在开标环节要求投标人的法定代表人或者经授权委托的投标人代表到场"}], "ans": "B", "ana": "B正确:违法限定潜在投标人的所有制形式或组织形式,属于破坏公平竞争的重点整治问题。A设置财务指标→在特定条件下允许(与项目规模匹配)。C将资质资格作为条件→符合法定要求的允许。D要求法定代表人到场→在一定条件下可要求。重点整治的是不合理的限制和排斥行为。【法条依据】《工程项目招投标领域营商环境专项整治工作方案》。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "（真题）根据《保障中小企业款项支付条例》，机关、事业单位从中小企业采购货物、工程 、服务、应当自( )日起30日内支付款项。", "opts": [{"k": "A", "t": "采购合同生效"}, {"k": "B", "t": "保修期满"}, {"k": "C", "t": "货物、工程、服务交付"}, {"k": "D", "t": "双方确认结算金额"}], "ans": "C", "ana": "C正确:根据《保障中小企业款项支付条例》第8条,机关、事业单位从中小企业采购货物、工程、服务,应当自货物、工程、服务交付之日起30日内支付款项;合同另有约定的,付款期限最长不得超过60日。A合同生效日不对;B保修期满不对;D确认结算金额不对。【法条依据】《保障中小企业款项支付条例》第8条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第2章 建筑市场主体制度", "type": "single", "stem": "根据《保障中小企业款项支付条例》，关于 事业单位从中小企业采购工程价款支付的说法，正确的是( )。", "opts": [{"k": "A", "t": "事业单位应当自工程交付之日起60日内支付款项"}, {"k": "B", "t": "建设单位内部付款流程未履行完毕的，可以拒绝或者延迟支付中小企业采购工程价款"}, {"k": "C", "t": "合同约定采取履行进度结算的，付款期限应当自相应履行进度完成之日起算"}, {"k": "D", "t": "事业单位延迟支付中小企业款项，应当按照合同约定和法律规定的利率标准支付逾期利息。"}], "ans": "D", "ana": "D正确:事业单位延迟支付中小企业款项,应按合同约定和法律规定支付逾期利息(条例第15条)。A错误:应自交付之日起30日内支付(可约定延长至60日)。B错误:内部付款流程不能作为拒绝或延迟支付的抗辩理由。C错误:采取履行进度结算的,付款期限自双方确认相应结算金额之日起算(非进度完成之日起)。【法条依据】《保障中小企业款项支付条例》第8条、第9条、第15条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 建设工程许可法律制度", "type": "single", "stem": "根据《城乡规划法》，在乡、村庄规划区内进行乡村公共设施建设的，建设单位或者个人应当申请 核发( )。", "opts": [{"k": "A", "t": "建设工程规划许可证"}, {"k": "B", "t": "选址意见书"}, {"k": "C", "t": "乡村建设规划许可证"}, {"k": "D", "t": "建设用地规划许可证"}], "ans": "C", "ana": "C正确：在乡、村庄规划区内进行乡村公共设施建设的，应申请核发乡村建设规划许可证（《城乡规划法》第41条）。A建设工程规划许可证适用于城市、镇规划区内。B选址意见书适用于划拨方式供地的项目。D建设用地规划许可证在办理用地手续前申请。【法条依据】《城乡规划法》第41条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 建设工程许可法律制度", "type": "single", "stem": "关于临时建设批准的说法，正确的是( )。", "opts": [{"k": "A", "t": "临时建设影响控制性详细规划实施的，应当经城市、县人民政府城乡规划主管部门批准"}, {"k": "B", "t": "临时建设不影响近期建设规划的，不需要由主管部门批准"}, {"k": "C", "t": "临时建设影响交通、市容、安全等的，不得批准"}, {"k": "D", "t": "临时建设应当在使用年限期满后及时拆除"}], "ans": "C", "ana": "C正确：临时建设影响交通、市容、安全等的，不得批准（《城乡规划法》第44条）。A错误：临时建设影响控制性详细规划实施的，不得批准。B错误：临时建设均需经城乡规划主管部门批准，无论是否影响近期建设规划。D错误：临时建设应在批准的使用期限内自行拆除（非使用年限期满）。【法条依据】《城乡规划法》第44条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 建设工程许可法律制度", "type": "single", "stem": "根据《城乡规划法》，关于规划验收的说法，正确的是( )。", "opts": [{"k": "A", "t": "建设工程是否符合规划条件，应当由县级人民政府城乡规划主管部门按规定予以核实"}, {"k": "B", "t": "经核实不符合规划条件的建设工程，建设单位获得有关人民政府土地主管部门批准可以组织竣工验收"}, {"k": "C", "t": "规划条件未经核实的建设工程，建设单位不得组织竣工验收"}, {"k": "D", "t": "施工单位应当在竣工验收后向城乡规划主管部门报送有关竣工验收资料"}], "ans": "C", "ana": "C正确：规划条件未经核实的建设工程，建设单位不得组织竣工验收（《城乡规划法》第45条）。A错误：应由县级以上地方人民政府城乡规划主管部门核实。B错误：不符合规划条件的不可组织竣工验收。D错误：由建设单位（非施工单位）在竣工验收后6个月内向城乡规划主管部门报送竣工验收资料。【法条依据】《城乡规划法》第45条。---", "law": "", "tag": "真题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 建设工程许可法律制度", "type": "single", "stem": "（真题）根据《建筑工程施工许可管理办法》，下列建设工程开工前建设单位应当申请领取 施工许可证的是( )。", "opts": [{"k": "A", "t": "工程投资额20万元的改建工程"}, {"k": "B", "t": "建筑面积3000m²的钢结构厂房新建工程"}, {"k": "C", "t": "农民自建2层住宅"}, {"k": "D", "t": "用于抢险救灾的房屋"}], "ans": "B", "ana": "B正确：建筑面积3000m²的钢结构厂房新建工程超过300m²限额，应申请施工许可证。A错误：工程投资额20万元<30万元，不需办理。C错误：农民自建低层住宅不需办理。D错误：抢险救灾工程不需办理。【法条依据】《建筑工程施工许可管理办法》第2条：投资额<30万元或建筑面积<300m²可不申请。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 建设工程许可法律制度", "type": "single", "stem": "（真题）下列情形中，不需要办理施工许可证的是( )。", "opts": [{"k": "A", "t": "古建筑的修缮"}, {"k": "B", "t": "中小型工程"}, {"k": "C", "t": "军用房屋建筑工程建筑活动"}, {"k": "D", "t": "农村自建住宅的建筑活动"}], "ans": "C", "ana": "C正确：军用房屋建筑工程建筑活动不适用《建筑法》，由中央军事委员会另行规定，不需办理施工许可证。A古建筑修缮（除法定免办外需办）、B中小型工程（超限额的需办）、D农村自建低层住宅不需办但这是特殊规定（题目要求选更准确的唯一例外）。注意：《建筑法》第84条规定军用房屋建筑由中央军委另行规定。【法条依据】《建筑法》第84条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch":  "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 建设工程许可法律制度", "type": "single", "stem": "（真题）根据《建筑法》，下列情形中，符合施工许可证办理和报告制度的是( )。", "opts": [{"k": "A", "t": "某工程因故延期开工，向发证机关报告后施工许可证自动延期"}, {"k": "B", "t": "某工程因地震中止施工，1年后向发证机关报告"}, {"k": "C", "t": "某工程因洪水中止施工，1个月内向发证机关报告，2个月后自行恢复施工"}, {"k": "D", "t": "某工程因政府宏观调控停建，1个月内向发证机关报告，1年后恢复施工前报发证机关核验施工许可证"}], "ans": "D", "ana": "D正确：因政府宏观调控停建属中止施工，1个月内报告，恢复施工前需报发证机关核验许可证（满1年的需核验）。A错误：延期需申请批准，非报告后自动延期。B错误：因地震中止施工应1个月内报告，1年后报告超期。C错误：洪水中止施工应在1个月内报告，2个月后自行恢复施工不符合规定（恢复前应报告）。【法条依据】《建筑法》第10条、第11条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第3章 建设工程许可法律制度", "type": "single", "stem": "（真题）关于施工许可证申请延期的说法，正确的是( )。", "opts": [{"k": "A", "t": "自领取施工许可证之日起6个月内因故不能按时开工的，应当申请延期"}, {"k": "B", "t": "延期以3次为限，每次不得超过3个月"}, {"k": "C", "t": "既不开工又不申请延期的，施工许可证由发证机关废止"}, {"k": "D", "t": "超过延期时限的施工许可证，自行废止"}], "ans": "D", "ana": "D正确：超过延期时限的施工许可证，自行废止（《建筑法》第9条）。A错误：自领取之日起3个月内开工（非6个月），不能按期开工的应申请延期。B错误：延期以2次为限，每次不超过3个月（非3次）。C错误：既不开工又不申请延期的，施工许可证自行废止（非由发证机关废止）。【法条依据】《建筑法》第9条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第4章 建设工程发承包法律制度", "type": "single", "stem": "下列单位中，可以担任政府投资项目工程总承包单位的是( )。", "opts": [{"k": "A", "t": "该项目的代建单位"}, {"k": "B", "t": "该项目的项目管理单位"}, {"k": "C", "t": "该项目的造价咨询单位"}, {"k": "D", "t": "初步设计文件公开的该项目的设计文件编制单位"}], "ans": "D", "ana": "D正确：初步设计文件公开的设计文件编制单位可担任政府投资项目工程总承包单位。A代建单位、B项目管理单位、C造价咨询单位与其存在利害关系，不得担任同一项目的总承包单位。【法条依据】《房屋建筑和市政基础设施项目工程总承包管理办法》第11条。---", "law": "", "tag": "例题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第4章 建设工程发承包法律制度", "type": "single", "stem": "关于工程总承包的说法,正确的是( )。", "opts": [{"k": "A", "t": "工程总承包单位不得是工程总承包项目的代建单位"}, {"k": "B", "t": "建设内容不明确,技术方案不成熟的项目,适直采用工程总承包的方式"}, {"k": "C", "t": "工程总包单位只能由同时具有与工程规模相适应的工程设计资质和施工资质的单位承担"}, {"k": "D", "t": "工程总承包单位不得采用直接发包的方式进行分包"}], "ans": "A", "ana": "A正确：工程总承包单位不得是工程总承包项目的代建单位、项目管理单位、监理单位、造价咨询单位、招标代理单位。B错误：建设内容不明确的项目不宜采用总承包方式。C错误：总承包单位可由具有相应设计资质和施工资质的企业组成联合体。D错误：可采用直接发包方式分包（但分包需经建设单位同意或合同约定）。【法条依据】《工程总承包管理办法》第11条、第21条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第4章 建设工程发承包法律制度", "type": "single", "stem": "（真题）某总承包单位与分包单位在分包合同中约定，由分包单位自行负责分包工程的安全 生产。工程施工中，分包工程发生了安全事故，则该事故( )。", "opts": [{"k": "A", "t": "按约定由分包单位自行承担全部责任"}, {"k": "B", "t": "分包单位承担主要责任，总承包单位承担次要责任"}, {"k": "C", "t": "总承包单位承担全部责任"}, {"k": "D", "t": "总承包单位与分包单位承担连带责任"}], "ans": "D", "ana": "D正确：总承包单位和分包单位就分包工程对建设单位承担连带责任，这一法定责任不因内部约定而免除（《建筑法》第29条）。A约定免责对建设单位无效（仅内部追偿有效）。BC不符合法律规定。【法条依据】《建筑法》第29条：总承包单位和分包单位就分包工程对建设单位承担连带责任。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第4章 建设工程发承包法律制度", "type": "single", "stem": "（真题）关于建设工程分包的说法，正确的是( )。", "opts": [{"k": "A", "t": "专业承包单位可以将其承包工程中的劳务作业发包给劳务分包单位"}, {"k": "B", "t": "总承包单位应当接受建设单位推荐的分包单位"}, {"k": "C", "t": "总承包单位可以将工程分包给符合条件的个人"}, {"k": "D", "t": "总承包单位将其承包的工程分包给他人时，应当提前3日通知建设单位"}], "ans": "A", "ana": "A正确：专业承包单位可将其承包工程中的劳务作业发包给劳务分包单位（属合法分包）。B错误：总承包单位不必接受建设单位推荐的分包单位（有权自行选择）。C错误：不得将工程分包给个人。D错误：分包给他人时无需提前3日通知（但需建设单位认可）。【法条依据】《建筑法》第29条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第4章 建设工程发承包法律制度", "type": "single", "stem": "（真题）关于施工企业资质序列的说法，正确的是( )。", "opts": [{"k": "A", "t": "专业承包企业可以将所承揽的专业工程再次分包给其他专业承包企业"}, {"k": "B", "t": "总承包企业可以将所承接的钢结构分包给其他专业承包企业"}, {"k": "C", "t": "劳务分包企业只能承接施工总承包企业分包的劳务作业"}, {"k": "D", "t": "劳务分包企业可以承接施工总承包、专业承包或其他劳务分包企业分包的劳务作业"}], "ans": "B", "ana": "B正确：钢结构工程属专业工程，总承包单位可分包给有相应资质的专业承包企业（属合法分包）。A错误：专业承包企业不得将专业工程再次分包（再分包违法）。C错误：劳务分包企业可承接总承包和专业承包企业分包的劳务作业。D错误：劳务分包企业不得承接其他劳务分包企业分包的劳务作业（再分包违法）。【法条依据】《建筑法》第29条。---", "law": "", "tag": "例-单选题", "note": "", "hasTable": false, "missImg": false}, {"ch": "第4章 建设工程发承包法律制度", "type": "single", "stem": "根据《建没工程质量管理条例》，下列情形中，属于违法分包的是( )。", "opts": [{"k": "A", "t": "施工企业将其承包的全部工程转给其他单位施工的"}, {"k": "B", "t": "分包单位将其承包的建设工程再分包给具有相应资质条件的施工企业的"}, {"k": "C", "t": "没有资质的单位借用其他施工企业的资质承揽工程的"}, {"k": "D", "t": "施
